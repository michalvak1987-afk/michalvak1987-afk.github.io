<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סימולטור אולפנת הראל</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1e2a3a; --muted:#6b7a90;
  --brand:#4338ca; --brand2:#7c3aed; --ok:#059669; --warn:#d97706; --bad:#dc2626;
  --gold:#b45309; --line:#e4e9f2; --soft:#eef1f8;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Segoe UI','Heebo',Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:14px;}
header.app{background:linear-gradient(135deg,#312e81,#6d28d9 60%,#9333ea); color:#fff; padding:18px 26px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
header.app h1{font-size:21px; font-weight:800;}
header.app .sub{opacity:.85; font-size:12.5px;}
nav.tabs{display:flex; gap:4px; background:#fff; padding:8px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50; overflow-x:auto;}
nav.tabs button{border:none; background:transparent; padding:9px 16px; border-radius:10px; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap; font-family:inherit;}
nav.tabs button.active{background:var(--brand); color:#fff;}
nav.tabs button:hover:not(.active){background:var(--soft); color:var(--ink);}
main{padding:20px; max-width:1500px; margin:0 auto;}
.row{display:flex; gap:14px; flex-wrap:wrap;}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 1px 3px rgba(30,42,58,.06);}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px;}
.kpi{border-radius:14px; padding:14px 16px; color:#fff; position:relative; overflow:hidden;}
.kpi .n{font-size:26px; font-weight:800;}
.kpi .t{font-size:12.5px; opacity:.92;}
.kpi.k1{background:linear-gradient(135deg,#4338ca,#6366f1);}
.kpi.k2{background:linear-gradient(135deg,#047857,#10b981);}
.kpi.k3{background:linear-gradient(135deg,#b45309,#f59e0b);}
.kpi.k4{background:linear-gradient(135deg,#7c3aed,#a78bfa);}
.kpi.k5{background:linear-gradient(135deg,#be123c,#f43f5e);}
.kpi.k6{background:linear-gradient(135deg,#475569,#94a3b8);}
h2.sec{font-size:16px; font-weight:800; margin:6px 0 12px;}
h3.sec{font-size:14px; font-weight:700; margin:4px 0 10px; color:var(--brand);}
table.tbl{width:100%; border-collapse:collapse; font-size:13px;}
table.tbl th{background:var(--soft); padding:8px 9px; text-align:right; font-weight:700; border-bottom:2px solid var(--line); position:sticky; top:0; white-space:nowrap;}
table.tbl td{padding:7px 9px; border-bottom:1px solid var(--line); text-align:right;}
table.tbl tr:hover td{background:#f8faff;}
.scroll{overflow:auto; max-height:70vh; border:1px solid var(--line); border-radius:10px;}
.badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap;}
.b-exc{background:#fef3c7; color:#92400e; border:1px solid #f59e0b;}
.b-pot{background:#ede9fe; color:#5b21b6; border:1px solid #a78bfa;}
.b-ok{background:#d1fae5; color:#065f46;}
.b-warn{background:#ffedd5; color:#9a3412;}
.b-bad{background:#fee2e2; color:#991b1b;}
.b-miss{background:#e2e8f0; color:#334155;}
.grade-exc{color:var(--gold); font-weight:800;}
.grade-ok{color:var(--ink);}
.grade-warn{color:var(--warn); font-weight:700;}
.grade-bad{color:var(--bad); font-weight:800;}
.grade-miss{color:#94a3b8;}
input[type=number], select, input[type=text]{border:1px solid #cbd5e1; border-radius:8px; padding:6px 8px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink);}
input[type=number]{width:62px; text-align:center;}
input[type=number]:focus, select:focus{outline:2px solid #a5b4fc; border-color:var(--brand);}
input.cell-miss{background:#f1f5f9; border-style:dashed;}
input.g-red, .g-red{color:#dc2626 !important; font-weight:800;}
input.g-blue, .g-blue{color:#1d4ed8 !important; font-weight:800; font-style:italic;}
input.sim-cell{background:#fff7ed !important; border-color:#f59e0b !important; color:#b45309; font-weight:800; box-shadow:0 0 0 1px #f59e0b;}
#simBanner{display:none; background:linear-gradient(90deg,#fff7ed,#ffedd5); border-bottom:2px solid #f59e0b; padding:8px 18px; font-size:13px; align-items:center; gap:10px; flex-wrap:wrap; position:sticky; top:49px; z-index:49;}
body.sim-on #simBanner{display:flex;}
body.sim-on nav.tabs{border-bottom-color:#f59e0b;}
#simTabBtn{border:2px solid transparent;}
body.sim-on #simTabBtn{background:#f59e0b !important; color:#fff !important; border-color:#b45309;}
button.btn{border:none; border-radius:10px; padding:9px 16px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit; background:var(--brand); color:#fff;}
button.btn:hover{filter:brightness(1.1);}
button.btn.sec{background:var(--soft); color:var(--ink); border:1px solid var(--line);}
button.btn.ok{background:var(--ok);}
button.btn.warn{background:var(--warn);}
button.btn.bad{background:var(--bad);}
button.btn.sm{padding:5px 10px; font-size:12px; border-radius:8px;}
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px;}
.toolbar label{font-weight:600; color:var(--muted); font-size:13px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr;}}
.alert-item{display:flex; gap:10px; align-items:center; padding:8px 12px; border-radius:10px; margin-bottom:6px; font-size:13px;}
.al-bad{background:#fef2f2; border-right:4px solid var(--bad);}
.al-warn{background:#fffbeb; border-right:4px solid var(--warn);}
.al-info{background:#eff6ff; border-right:4px solid #3b82f6;}
.al-pot{background:#f5f3ff; border-right:4px solid var(--brand2);}
.al-miss{background:#f8fafc; border-right:4px solid #94a3b8;}
.chartbox{position:relative; height:280px;}
.subj-card{border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden;}
.subj-head{background:var(--soft); padding:10px 14px; font-weight:700; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
.subj-body{padding:12px 14px; display:none;}
.subj-card.open .subj-body{display:block;}
.pill{background:#fff; border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:11.5px; color:var(--muted);}
.note{font-size:12px; color:var(--muted); margin-top:6px;}
.delta-up{color:var(--ok); font-weight:800;}
.delta-dn{color:var(--bad); font-weight:800;}
.name-link{color:var(--brand); font-weight:700; cursor:pointer; text-decoration:none;}
.name-link:hover{text-decoration:underline;}
#giModal{position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:210; display:none; align-items:flex-start; justify-content:center; padding:30px 15px; overflow:auto;}
#giModal.show{display:flex;}
#giModal .box{background:#fff; border-radius:16px; max-width:900px; width:100%; padding:20px; max-height:88vh; overflow:auto;}
#studentModal{position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:200; display:none; align-items:flex-start; justify-content:center; padding:30px 15px; overflow:auto;}
#studentModal.show{display:flex;}
#studentModal .box{background:#fff; border-radius:16px; max-width:1000px; width:100%; padding:20px; max-height:88vh; overflow:auto;}
.comp-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px;}
.comp-box{border:1px solid var(--line); border-radius:10px; padding:9px; background:#fbfcff;}
.comp-box .cn{font-size:11.5px; color:var(--muted); font-weight:600; margin-bottom:5px; min-height:28px;}
.comp-inputs{display:flex; gap:6px; align-items:center; font-size:11.5px; flex-wrap:wrap;}
.comp-row{display:flex; gap:6px; align-items:center; font-size:11.5px; padding:3px 0; border-top:1px dashed #e2e8f0;}
.comp-row:first-of-type{border-top:none;}
.comp-row .lbl{min-width:54px; color:var(--muted); font-weight:700;}
.comp-row input[type=number]{width:58px;}
.comp-box .cn{min-height:auto;}
footer{padding:14px; text-align:center; color:var(--muted); font-size:12px;}
@media print{
  body>*{display:none !important;}
  #printArea{display:block !important; padding:0;}
  #printArea .no-print{display:none !important;}
  table.tbl th{position:static;}
  .scroll{max-height:none; overflow:visible; border:none;}
}
#printArea{display:none;}
body.print-mode #printArea{display:block; padding:20px; background:#fff;}
.status-cell{min-width:110px;}
.toast{position:fixed; bottom:20px; left:20px; background:#1e293b; color:#fff; padding:12px 20px; border-radius:12px; z-index:500; font-size:13.5px; box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; transition:opacity .3s;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<header class="app">
  <div id="logoSlot" style="flex-shrink:0;"></div>
  <div>
    <h1>סימולטור אולפנת הראל</h1>
    <div class="sub">מגזר ממלכתי דתי · חישוב זכאות, איתור מצטיינות, סימולציות ודוחות</div>
  </div>
  <div id="profileSlot" style="display:flex; gap:6px; align-items:center; margin-inline-start:14px;"></div>
  <div id="saveInd" onclick="setTab('settings')" title="לחצי לפרטי השמירה והגיבוי" style="cursor:pointer; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); border-radius:10px; padding:5px 10px; font-size:12px; line-height:1.35; white-space:nowrap;"></div>
  <div style="margin-inline-start:auto; display:flex; gap:8px; flex-wrap:wrap;">

    <input type="file" id="xlsxFile" accept=".xlsx" style="display:none" onchange="importExcel(this)">

  </div>

<nav class="tabs" id="tabs">
  <button data-tab="dash" class="active" onclick="setTab('dash')">📊 דשבורד</button>
  <button data-tab="students" onclick="setTab('students')">👩‍🎓 תלמידות</button>
  <button data-tab="entry" onclick="setTab('entry')">✏️ הזנת ציונים</button>
  <button data-tab="sim" onclick="setTab('sim')">🧪 סימולציה</button>
  <button data-tab="reports" onclick="setTab('reports')">📄 דוחות</button>
  <button data-tab="alerts" onclick="setTab('alerts')">🚨 התראות</button>

  <button data-tab="help" onclick="setTab('help')">❓ מדריך</button>

<main id="main"></main>
<div id="studentModal" onclick="if(event.target===this)closeStudent()"><div class="box" id="studentBox"></div></div>
<div id="giModal" onclick="if(event.target===this)closeGradeImport()"><div class="box" id="giBox"></div></div>
<div id="printArea"></div>
<div class="toast" id="toast"></div>
<footer>סימולטור אולפנת הראל · <b>גרסה 1.0</b> (31.08.2026) · הנתונים נשמרים אוטומטית בדפדפן המקומי</footer>
<script>
"use strict";
/* ============ מודל המקצועות ============ */
const I=(n,w)=>({n,t:'i',w});
const E=(n,w,s)=>({n,t:'e',w,s}); // s = אחוז מגן
const B=()=>({n:'עבודה נוספת / הערכה חלופית',t:'i',w:0,b:1}); // רכיב שיפור ציון — מופעל ע"י מתן משקל; האחוזים מתחלקים יחסית
const MUGBAR_COMPS=u=>[I('הערכה פנימית',30),E('בחינה חיצונית א׳',70,30),E('בחינה חיצונית ב׳',0,30),E('בחינה חיצונית ג׳',0,30),B()];
const SUBJECTS=[
 {id:'lashon',   name:'לשון',          opts:[2], comps:u=>[I('הערכה פנימית',30),E('בחינה חיצונית',70,50),B()]},
 {id:'history',  name:'היסטוריה',      opts:[2], comps:u=>[I('הערכה חלופית',30),E('בגרות חיצונית',35,0),E('משימות מבוקרות',35,0),B()]},
 {id:'sifrut',   name:'ספרות',         opts:[1], comps:u=>[I('הערכה פנימית',30),E('בחינה חיצונית',70,30),B()]},
 {id:'machshevet',name:'מחשבת ישראל',  opts:[1], comps:u=>[I('הערכה חלופית',30),E('בגרות חיצונית',50,0),E('משימה מבוקרת',20,0),B()]},
 {id:'ezrachut', name:'אזרחות',        opts:[2], comps:u=>[I('הערכה חלופית',30),E('בגרות חיצונית',70,0),B()]},
 {id:'english',  name:'אנגלית',        opts:[4,5], comps:u=>[I('הערכה פנימית',26),E('שאלון א׳',27,30),E('שאלון ב׳',27,60),E('בחינה בע"פ',20,30),B()]},
 {id:'math',     name:'מתמטיקה',       opts:[3,4,5], comps:u=> u===3?[I('הערכה פנימית',25),E('שאלון ראשון',35,50),E('שאלון שני',40,60),B()]
                                                     : u===4?[I('הערכה פנימית',0),E('שאלון ראשון',65,50),E('שאלון שני',35,60),B()]
                                                            :[I('הערכה פנימית',0),E('שאלון ראשון',60,50),E('שאלון שני',40,60),B()]},
 {id:'tanakh',   name:'תנ"ך',          opts:[3,5], comps:u=> u===5?[I('הערכה חלופית',20),E('בגרות חיצונית',20,0),E('משימות מבוקרות',20,0),I('הערכה חלופית הגבר',16),E('מבחן הגבר',24,0),B()]
                                                            :[I('הערכה חלופית',30),E('בגרות חיצונית',35,0),E('משימות מבוקרות',35,0),I('הערכה חלופית הגבר',0),E('מבחן הגבר',0,0),B()]},
 {id:'toshba',   name:'תושב"ע',        opts:[3,5], comps:u=> u===5?[I('הערכה פנימית',18),E('בחינה חיצונית א׳',21,0),E('בחינה חיצונית ב׳',21,0),E('בחינת הגבר',28,0),I('הערכה פנימית הגבר',12),B()]
                                                            :[I('הערכה פנימית',30),E('בחינה חיצונית א׳',35,0),E('בחינה חיצונית ב׳',35,0),E('בחינת הגבר',0,0),I('הערכה פנימית הגבר',0),B()]},
 {id:'mugbar1',  name:'מקצוע מוגבר',   opts:[0,5], named:true, comps:MUGBAR_COMPS},
 {id:'mugbar2',  name:'מוגבר/התמחות ב׳',opts:[0,3,5], named:true, comps:MUGBAR_COMPS},
 {id:'mugbar3',  name:'מוגבר/התמחות ג׳',opts:[0,3,5], named:true, comps:MUGBAR_COMPS},
 {id:'hng',      name:'חנ"ג',           opts:[0,1], internalOnly:true, comps:u=>[I('ציון סופי',100)]},
 {id:'mada',     name:'מבוא למדעים',    opts:[0,1], internalOnly:true, comps:u=>[I('ציון סופי',100)]},
 {id:'shelach',  name:'של"ח',           opts:[0,1], internalOnly:true, comps:u=>[I('ציון סופי',100)]},
 {id:'taavura',  name:'חינוך תעבורתי',  opts:[0,1], internalOnly:true, comps:u=>[I('ציון סופי',100)]},
];
const SUBJ_MAP=Object.fromEntries(SUBJECTS.map(s=>[s.id,s]));

/* ============ צבעי ציונים: שחור=דווח למשרד · אדום=אמיתי לא דווח · כחול=פיקטיבי/סימולציה ============ */
const GSTAT={r:{lbl:'ציון אמיתי — טרם דווח למשרד',cls:'g-red',ic:'🔴'},b:{lbl:'ציון פיקטיבי / הערכה',cls:'g-blue',ic:'🔵'}};
function gstatOf(st,key){ return (st.gstat||{})[key]||''; }
function gstatCls(st,key){ const s=gstatOf(st,key); return s?' '+GSTAT[s].cls:''; }
function cycleGstat(id,key){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.gstat=st.gstat||{};
  const cur=st.gstat[key]||'';
  const nxt=cur===''?'r':(cur==='r'?'b':'');
  if(nxt) st.gstat[key]=nxt; else delete st.gstat[key];
  save(); refreshOpenViews(id);
}
function statusLegend(){
  return `<div class="note" style="display:flex; gap:14px; flex-wrap:wrap; align-items:center;">
    <b>סימון ציונים:</b>
    <span><span style="color:#111; font-weight:800;">■</span> שחור — דווח למשרד</span>
    <span><span style="color:#dc2626; font-weight:800;">■</span> אדום — אמיתי, טרם דווח</span>
    <span><span style="color:#1d4ed8; font-weight:800;">■</span> כחול — פיקטיבי / הערכה</span>
    <span class="pill">💡 לחיצה ימנית על ציון מחליפה סימון</span>
    ${state.flipFav?'<span class="pill" style="background:#fffbeb; border-color:#fcd34d;">🔀 היפוך אחוזים לטובת הבחינה — פעיל</span>':''}
  </div>`;
}
// קריאת צבעי הגופן מתוך ה-XML של קובץ האקסל
function sheetFontColors(wb,sheetName){
  try{
    const files=wb.files; if(!files) return null;
    const get=n=>{ const e=files[n]; if(!e) return null;
      if(typeof e==='string') return e;
      if(e.content!==undefined) return typeof e.content==='string'?e.content:new TextDecoder('utf-8').decode(new Uint8Array(e.content));
      return new TextDecoder('utf-8').decode(new Uint8Array(e)); };
    const styles=get('xl/styles.xml'); if(!styles) return null;
    const fontsBlock=(styles.match(/<fonts[\s\S]*?<\/fonts>/)||[''])[0];
    const fonts=fontsBlock.match(/<font>[\s\S]*?<\/font>|<font\/>/g)||[];
    const fcol=fonts.map(fo=>{ const m=fo.match(/<color([^\/>]*)\/?>/); if(!m) return null;
      const a=m[1];
      const rgb=a.match(/rgb="([0-9A-Fa-f]{6,8})"/); if(rgb) return rgb[1].slice(-6).toUpperCase();
      return null; });
    const xfsBlock=(styles.match(/<cellXfs[\s\S]*?<\/cellXfs>/)||[''])[0];
    const xfs=xfsBlock.match(/<xf [^>]*?\/?>/g)||[];
    const s2c=xfs.map(x=>{ const m=x.match(/fontId="(\d+)"/); return m?fcol[+m[1]]:null; });
    const wbxml=get('xl/workbook.xml'); if(!wbxml) return null;
    const names=[]; const rn=/<sheet[^>]*name="([^"]*)"/g; let mm;
    while((mm=rn.exec(wbxml))) names.push(mm[1]);
    const idx=names.indexOf(sheetName); if(idx<0) return null;
    const sheet=get('xl/worksheets/sheet'+(idx+1)+'.xml'); if(!sheet) return null;
    const out={};
    const re=/<c r="([A-Z]+\d+)"([^>]*)>/g; let m2;
    while((m2=re.exec(sheet))){
      const sm=m2[2].match(/ s="(\d+)"/); if(!sm) continue;
      const c=s2c[+sm[1]]; if(c) out[m2[1]]=c;
    }
    return out;
  }catch(e){ return null; }
}
function classifyColor(hex){
  if(!hex) return '';
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  if(r>120&&r>g*2&&r>b*2) return 'r';           // אדום
  if(b>110&&b>r+40&&b>g+10) return 'b';          // כחול
  return '';                                      // שחור/ברירת מחדל
}

/* ============ קטלוג שאלונים (בגרות גמישה) ============ */

const MUGBAR_PRESETS={
 'תקשורת':      [[30,'788283'],[70,'788381']],
 'פיזיקה':      [[30,'36283'],[30,'36361'],[25,'36371'],[15,'36386']],

function applyMugbarPreset(stId,sid,presetName){
  if(!presetName) return;
  const st=state.students.find(s=>s.id===stId); if(!st) return;
  const p=MUGBAR_PRESETS[presetName]; if(!p) return;
  st.mugbarNames=st.mugbarNames||{}; st.mugbarNames[sid]=presetName;
  st.units=st.units||{}; if(!st.units[sid]) st.units[sid]=5;
  st.ov=st.ov||{}; st.codes=st.codes||{};
  // רכיב 0 = פנימי; רכיבים 1-3 = חיצוניים
  const ext=p.slice(1);
  st.ov[sid+'.0']=Object.assign({},st.ov[sid+'.0'],{w:p[0][0]});
  st.codes[sid+'.0']=p[0][1];
  for(let i=1;i<=3;i++){
    const e=ext[i-1];
    st.ov[sid+'.'+i]=Object.assign({},st.ov[sid+'.'+i],{w:e?e[0]:0});
    if(e) st.codes[sid+'.'+i]=e[1];
  }
  save(); refreshOpenViews(stId,true);
  toast('הוחל מבנה '+presetName+' מהקטלוג: '+p.map(x=>x[0]+'%').join(' / '));
}

function applyLegacyStructure(st){
  st.ov=st.ov||{};
  const setW=(k,w)=>{ st.ov[k]=Object.assign({},st.ov[k]); if(st.ov[k].w===undefined) st.ov[k].w=w; };
  setW('history.1',70);   setW('history.2',0);
  setW('machshevet.1',70); setW('machshevet.2',0);
  setW('ezrachut.0',20);  setW('ezrachut.1',80);
  if((st.units||{}).tanakh===5){ setW('tanakh.0',18); setW('tanakh.1',21); setW('tanakh.2',21); }
  return st;
}

const DEFAULT_STATE={classes:[], students:[], custom:{}, includeInternal:false, reqUnits:true, flipFav:true, logo:null, thresholds:{pass:54.5, excel:90, potential:85, gap:20}};
/* ============ שכבת הניסוי של הסימולציה (חיה רק בלשונית הסימולציה, לא נוגעת במקור) ============ */
function gradesOf(st,sim){
  if(sim&&st.simg&&Object.keys(st.simg).length) return Object.assign({},st.grades||{},st.simg);
  return st.grades||{};
}
function isSimKey(st,key){ return !!(st.simg&&st.simg[key]!==undefined); }
function simCount(){ return state.students.reduce((a,s)=>a+(s.simg?Object.keys(s.simg).length:0),0); }
function setGradeSim(id,key,val){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.simg=st.simg||{};
  if(val===''||val===null){ delete st.simg[key]; }
  else{
    const v=Math.max(0,Math.min(100,+val));
    if((st.grades||{})[key]===v) delete st.simg[key]; // חזרה לערך האמיתי = ביטול השינוי
    else st.simg[key]=v;
  }
  save(); render();
}
function clearSim(){
  const n=simCount();
  if(!n){ toast('אין שינויי ניסוי'); return; }
  if(!confirm('למחוק את '+n+' שינויי הניסוי ולחזור לציונים האמיתיים?')) return;
  state.students.forEach(s=>{ delete s.simg; });
  save(); render(); toast('שינויי הניסוי נמחקו — חזרנו לציונים האמיתיים');
}
function commitSim(){
  const n=simCount();
  if(!n){ toast('אין שינויים בתרחיש'); return; }
  if(!confirm('להעביר '+n+' ציונים מהניסוי אל טבלת הציונים האמיתית?')) return;
  state.students.forEach(s=>{
    if(!s.simg) return;
    s.grades=s.grades||{};
    Object.keys(s.simg).forEach(k=>{ s.grades[k]=s.simg[k]; });
    delete s.simg;
  });
  save(); render(); toast(n+' ציונים הועברו לטבלה האמיתית');
}

function newProfile(){
  const name=prompt('שם הסימולטור החדש (למשל: יב תשפ"ז, שכבת יא):');
  if(!name||!name.trim()) return;
  const nm=name.trim();
  const id='p'+Date.now().toString(36);
  profiles.push({id,name:nm}); currentProfileId=id; saveProfiles();
  // סימולטור חדש מתחיל נקי לגמרי — בלי הכיתות של הסימולטור הקודם
  state=JSON.parse(JSON.stringify(DEFAULT_STATE));
  state.classes=[];
  const first=prompt('שם הכיתה הראשונה בסימולטור "'+nm+'":', nm);
  if(first&&first.trim()) state.classes.push(first.trim());
  save();
  renderProfileBar(); renderLogo(); setTab('students');
  toast('נוצר סימולטור "'+nm+'"'+(state.classes.length?' עם כיתה "'+state.classes[0]+'"':'')+' — אפשר להוסיף תלמידות');

function renameProfile(){
  const p=profiles.find(x=>x.id===currentProfileId);
  const name=prompt('שם הסימולטור (למשל: יב תשפ"ו):',p.name||'');
  if(name===null) return;
  if(name.trim()){ p.name=name.trim(); delete p.unnamed; saveProfiles(); renderProfileBar(); render(); toast('השם עודכן'); }
}
function deleteProfile(){
  if(profiles.length<=1){ toast('חייב להישאר לפחות סימולטור אחד'); return; }
  const p=profiles.find(x=>x.id===currentProfileId);
  if(!confirm(`למחוק לצמיתות את הסימולטור "${p.name}" על כל הנתונים שבו?`)) return;
  localStorage.removeItem(profileKey());
  profiles=profiles.filter(x=>x.id!==currentProfileId);
  currentProfileId=profiles[0].id; saveProfiles();
  state=loadState(); renderProfileBar(); renderLogo(); render();

let state=loadState();
function loadState(){
  try{const raw=localStorage.getItem(profileKey()); if(raw){const s=JSON.parse(raw); return Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)),s);}}catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
let lastSaveAt=null, saveOk=null;
function save(){
  try{
    const json=JSON.stringify(state);
    localStorage.setItem(profileKey(),json);
    // אימות אמיתי: קוראים בחזרה ומשווים
    const back=localStorage.getItem(profileKey());
    saveOk=(back===json);
    lastSaveAt=new Date();
    localStorage.setItem('bagrutLastSave:'+currentProfileId,lastSaveAt.toISOString());
  }catch(e){
    saveOk=false;
    alert('⚠️ השמירה נכשלה! ייתכן שהדפדפן במצב גלישה בסתר או שהאחסון מלא.\nשגיאה: '+e.message+'\n\nמומלץ ללחוץ "💾 גיבוי" ולשמור את הקובץ מיד.');
  }

}
function storageBytes(){
  let n=0;
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf('bagrut')===0) n+=(k.length+(localStorage.getItem(k)||'').length)*2; } }catch(e){}
  return n;
}

/* ============ מנוע חישוב ============ */
function getUnits(st,subj){
  if(subj.opts.length===1) return subj.opts[0];
  const u=(st.units||{})[subj.id];
  return (u===0||u)?u:subj.opts[subj.opts.length-1];
}
function getComps(subj,u){
  const base=subj.comps(u);
  return base.map((c,i)=>{
    const ov=state.custom[subj.id+'.'+u+'.'+i];
    return ov?Object.assign({},c,ov):c;
  });
}
// רכיבים אפקטיביים לתלמידה ספציפית: ברירת מחדל ← הגדרות גלובליות ← התאמה אישית לתלמידה
function getCompsFor(st,subj,u){
  const base=getComps(subj,u);
  const stOv=st.ov||{};
  return base.map((c,i)=>{
    const po=stOv[subj.id+'.'+i];
    if(!po) return c;
    const merged=Object.assign({},c);
    if(po.w!==undefined&&po.w!==null&&po.w!=='') merged.w=+po.w;
    if(po.s!==undefined&&po.s!==null&&po.s!=='') merged.s=+po.s;
    merged._custom=true;
    return merged;
  });
}
function hasOverrides(st,subj){
  const stOv=st.ov||{};
  return Object.keys(stOv).some(k=>k.startsWith(subj.id+'.')&&stOv[k]&&Object.keys(stOv[k]).length);
}
function num(v){ if(v===''||v===null||v===undefined) return null; const n=+v; return isNaN(n)?null:n; }
// opts: {split: אחוז מגן גלובלי או null, predict:bool, bonus:number}
function calcSubject(st,subj,opts){
  opts=opts||{};
  const u=getUnits(st,subj);
  if(u===0) return {active:false,u:0};
  const comps=getCompsFor(st,subj,u);
  const g=gradesOf(st,opts.sim);
  let sum=0, missing=0, gaps=[], flips=[], predictedUsed=false;
  const details=[];
  comps.forEach((c,i)=>{
    if(!c.w){details.push(null); return;}
    const key=subj.id+'.'+i;
    let val=null;
    if(c.t==='i'){
      val=num(g[key]);
      if(val===null) missing++;
    }else{
      let m=num(g[key+'.m']), e=num(g[key+'.e']);
      if(opts.predict && e===null && m!==null){ e=m; predictedUsed=true; }
      if(opts.bonus && e!==null){ e=Math.min(100,e+opts.bonus); }
      let s=(opts.split!==null&&opts.split!==undefined)?opts.split:c.s;
      // חוק ההיפוך: כשציון הבחינה גבוה מהמגן — המשקל הגדול עובר לבחינה
      let flipped=false;
      if(state.flipFav && s>0 && s<100 && m!==null && e!==null && e>m){
        const lo=Math.min(s,100-s);
        if(lo!==s){ s=lo; flipped=true; }
      }
      const needM=s>0, needE=s<100;
      if((needM&&m===null)||(needE&&e===null)){ missing++; }
      else{
        // ציון הרכיב (מגן+בחינה) מעוגל לשלם לפי הכלל — 85.5 ← 86
        val=Math.round((needM?m*s/100:0)+(needE?e*(100-s)/100:0));
        if(flipped) flips.push({comp:c.n,m,e,s});
        if(needM&&needE&&m-e>=state.thresholds.gap) gaps.push({comp:c.n,m,e});
      }
    }
    if(val!==null) sum+=val*c.w/100;
    details.push({comp:c,val:val===null?null:Math.round(val*10)/10});
  });
  const wSum=comps.reduce((a,c)=>a+(+c.w||0),0);
  // נרמול: אם סך המשקלים שונה מ-100 (למשל אחרי הוספת עבודה נוספת) — האחוזים מתחלקים יחסית
  // ציון סופי מעוגל לשלם: 85.5 ← 86 · 85.4 ← 85
  const raw=(missing>0||wSum<=0)?null:sum/wSum*100;
  const final=raw===null?null:Math.round(raw);
  return {active:true,u,final,raw:raw===null?null:Math.round(raw*100)/100,missing,gaps,flips,details,predictedUsed,wSum,
          internalOnly:!!subj.internalOnly,
          blocker: final!==null&&final<state.thresholds.pass,
          borderline: final!==null&&final>=state.thresholds.pass&&final<60};
}
function calcStudent(st,opts){
  const per={}; let wsum=0, usum=0, blockers=[], missing=[], borderlines=[], gaps=[], flipList=[], anyFinal=false, predicted=false, predIn=[];
  SUBJECTS.forEach(subj=>{
    const r=calcSubject(st,subj,opts);
    per[subj.id]=r;
    if(!r.active) return;
    if(subj.internalOnly&&!state.includeInternal) return; // מקצוע פנימי — לא נכלל בממוצע ובזכאות
    if(r.final!==null){ wsum+=r.final*r.u; usum+=r.u; anyFinal=true; }
    if(r.missing>0) missing.push(subj);
    if(r.blocker) blockers.push(subj);
    if(r.borderline) borderlines.push(subj);
    if(r.gaps.length) gaps.push({subj,gaps:r.gaps});
    if(r.flips&&r.flips.length) flipList.push({subj,flips:r.flips});
    if(r.predictedUsed){ predicted=true; predIn.push(subj.name); }
  });
  const avg=usum>0?Math.round(wsum/usum*10)/10:null;
  const totalUnits=SUBJECTS.reduce((a,s)=>{const r=per[s.id]; if(!r.active)return a; if(s.internalOnly&&!state.includeInternal)return a; return a+r.u;},0);
  const complete=missing.length===0;
  const eligible=complete&&blockers.length===0&&anyFinal;
  // תנאי יח"ל להצטיינות: מתמטיקה 4-5 יח"ל + אנגלית 5 יח"ל
  const uMath=per.math&&per.math.active?per.math.u:0;
  const uEng=per.english&&per.english.active?per.english.u:0;
  const unitsOk=!state.reqUnits||(uMath>=4&&uEng>=5);
  let status, cls;
  const T=state.thresholds;
  if(!anyFinal){ status='אין נתונים'; cls='b-miss'; }
  else if(blockers.length>0){ status='מעכבים: '+blockers.length; cls='b-bad'; }
  else if(!complete){ status='חסר נתונים'; cls='b-miss'; }
  else if(avg>T.excel&&unitsOk){ status='מצטיינת ⭐'; cls='b-exc'; }
  else if(avg>=T.potential&&avg<=T.excel&&unitsOk){ status='פוטנציאל הצטיינות'; cls='b-pot'; }
  else{ status='זכאית'; cls='b-ok'; }
  return {per,avg,totalUnits,blockers,missing,borderlines,gaps,flipList,eligible,complete,status,cls,predicted,predIn,unitsOk,
          excellent: eligible&&avg>T.excel&&unitsOk,
          potential: complete&&blockers.length===0&&avg>=T.potential&&avg<=T.excel&&unitsOk};
}
function studentAlerts(st,r){
  const A=[];
  r.blockers.forEach(s=>A.push({sev:'bad',text:`${st.name}: ציון מעכב ב${s.name} (${r.per[s.id].final})`}));
  r.borderlines.forEach(s=>A.push({sev:'warn',text:`${st.name}: ציון גבולי ב${s.name} (${r.per[s.id].final}) — מומלץ תגבור`}));
  r.gaps.forEach(g=>g.gaps.forEach(x=>A.push({sev:'warn',text:`${st.name}: פער חריג ב${g.subj.name} · ${x.comp} — מגן ${x.m} מול בחינה ${x.e}`})));
  if(r.complete&&r.blockers.length===0&&r.avg>=88&&r.avg<=state.thresholds.excel&&r.unitsOk)
    A.push({sev:'pot',text:`${st.name}: ממוצע ${r.avg} — קרובה מאוד להצטיינות! נדרש ממוצע מעל ${state.thresholds.excel} (חסרות ${(state.thresholds.excel-r.avg+0.1).toFixed(1)} נק׳)`});
  else if(r.potential) A.push({sev:'pot',text:`${st.name}: פוטנציאל הצטיינות (ממוצע ${r.avg})`});
  if(r.complete&&r.blockers.length===0&&r.avg>=state.thresholds.potential&&!r.unitsOk)
    A.push({sev:'pot',text:`${st.name}: ממוצע ${r.avg} אך אינה עומדת בתנאי היח"ל להצטיינות (נדרש: מתמטיקה 4-5 יח"ל + אנגלית 5 יח"ל)`});
  const gs=st.gstat||{};
  const nR=Object.values(gs).filter(v=>v==='r').length, nB=Object.values(gs).filter(v=>v==='b').length;
  if(nR) A.push({sev:'warn',text:`${st.name}: ${nR} ציונים אמיתיים שטרם דווחו למשרד (מסומנים באדום)`});
  if(nB) A.push({sev:'info',text:`${st.name}: ${nB} ציונים פיקטיביים/הערכות בשימוש (מסומנים בכחול) — לא ציונים סופיים`});
  if(r.missing.length>0&&r.missing.length<=3) A.push({sev:'miss',text:`${st.name}: חסרים ציונים ב: ${r.missing.map(s=>s.name).join(', ')}`});
  else if(r.missing.length>3) A.push({sev:'miss',text:`${st.name}: חסרים ציונים ב-${r.missing.length} מקצועות`});
  return A;
}
function gradeClass(v){
  if(v===null||v===undefined) return 'grade-miss';
  if(v<state.thresholds.pass) return 'grade-bad';
  if(v<60) return 'grade-warn';
  if(v>state.thresholds.excel) return 'grade-exc';
  return 'grade-ok';
}

function addStudent(){
  const name=document.getElementById('newName').value.trim();
  const sel=document.getElementById('newCls');
  const cls=sel?sel.value:'';
  if(!name){toast('נא להזין שם');return;}
  if(!cls){toast('קודם צרי כיתה — בחלונית "ניהול כיתות" משמאל');return;}
  state.students.push({id:uid(),name,cls,units:{},mugbarNames:{},grades:{}});
  save(); render(); toast('נוספה: '+name);
}
function bulkAdd(){
  const sel=document.getElementById('newCls');
  const cls=sel?sel.value:'';
  if(!cls){toast('קודם צרי כיתה — בחלונית "ניהול כיתות" משמאל');return;}
  const names=document.getElementById('bulkNames').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!names.length){toast('לא הודבקו שמות');return;}
  names.forEach(name=>state.students.push({id:uid(),name,cls,units:{},mugbarNames:{},grades:{}}));
  save(); render(); toast(`נוספו ${names.length} תלמידות ל${cls}`);
}
function addClass(){
  const c=document.getElementById('newClsName').value.trim();
  if(!c||state.classes.includes(c)){toast('שם כיתה חסר או קיים');return;}
  state.classes.push(c); save(); render();
}
function delClass(c){
  const cnt=state.students.filter(s=>s.cls===c).length;
  if(!confirm(`למחוק את כיתה ${c}${cnt?` יחד עם ${cnt} תלמידותיה`:''}?`)) return;
  state.classes=state.classes.filter(x=>x!==c);
  state.students=state.students.filter(s=>s.cls!==c);
  save(); render();
}
function setStudentClass(id,val){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.cls=val; save();
  const modal=document.getElementById('studentModal');
  if(modal.classList.contains('show')) openStudent(id); else render();
}
function delStudent(id){
  const st=state.students.find(s=>s.id===id);
  if(!confirm(`למחוק את ${st.name}?`)) return;
  state.students=state.students.filter(s=>s.id!==id); save(); render();
}

function studentSubjEditor(st,subj){
  const u=getUnits(st,subj);
  const r=calcSubject(st,subj);
  const unitsSel=subj.opts.length>1?`<select onchange="setUnits('${st.id}','${subj.id}',this.value)">${subj.opts.map(o=>`<option value="${o}" ${o===u?'selected':''}>${o===0?'לא נלמד':o+' יח"ל'}</option>`).join('')}</select>`:`<span class="pill">${u} יח"ל</span>`;
  const nameInput=subj.named?`<input type="text" style="width:130px;" placeholder="שם המקצוע" value="${esc((st.mugbarNames||{})[subj.id]||'')}" onchange="setMugbarName('${st.id}','${subj.id}',this.value)">`:'';
  const custom=hasOverrides(st,subj);
  let body='';
  if(u===0){ body='<div class="note">לא נלמד</div>'; }

    const stOv=st.ov||{}, codes=st.codes||{};
    body=`<div class="comp-grid">${comps.map((c,i)=>{
      // במקצועות מוגברים וברכיב "עבודה נוספת" מציגים גם רכיבים במשקל 0 כדי לאפשר הפעלה; בשאר מסתירים
      if(!c.w&&!subj.named&&!c.b) return '';
      const key=subj.id+'.'+i, g=st.grades||{};
      const po=stOv[key]||{};
      const wOv=po.w!==undefined&&po.w!==null&&po.w!=='';
      const sOv=po.s!==undefined&&po.s!==null&&po.s!=='';
      const codeIn=`<div class="comp-inputs" style="margin-top:4px;">סמל ${codeSelect(st,key)}</div>`;
      const wIn=`משקל <input type="number" min="0" max="100" style="width:52px; ${wOv?'border-color:var(--brand2); background:#f5f3ff; font-weight:700;':''}" value="${wOv?po.w:''}" placeholder="${baseComps[i].w}" title="ברירת מחדל: ${baseComps[i].w}% — הזנת ערך יוצרת התאמה אישית לתלמידה זו" onchange="setOv('${st.id}','${key}','w',this.value)">%`;
      const stBtn=k=>{ const s=gstatOf(st,k); const ic=s?GSTAT[s].ic:'⚫';
        return `<button class="btn sec sm" style="padding:2px 6px; font-size:11px;" onclick="cycleGstat('${st.id}','${k}')" title="${s?esc(GSTAT[s].lbl):'דווח למשרד'} — לחצי להחלפה">${ic}</button>`; };
      if(c.t==='i'){
        return `<div class="comp-box" ${wOv?'style="border-color:var(--brand2);"':c.b?'style="background:#f0fdf4; border-color:#86efac;"':''}><div class="cn">${esc(c.n)}${c.b&&!c.w?' <span class="pill" style="background:#dcfce7; color:#166534;">לשיפור ציון — הזיני משקל להפעלה</span>':''}</div>
        <div class="comp-row"><span class="lbl">ציון</span><input type="number" min="0" max="100" class="${gstatCls(st,key).trim()}" value="${g[key]??''}" onchange="setGrade('${st.id}','${key}',this.value)">${stBtn(key)}
        ${(()=>{const dv=(r.details||[])[i]; const v=dv&&dv.val!==null&&dv.val!==undefined?dv.val:null;
          return (v!==null&&c.w)?`<span class="pill" title="תרומה לציון הסופי">= ${Math.round(v*c.w/100*10)/10} נק׳ מתוך ${c.w}</span>`:'';})()}</div>
        <div class="comp-row"><span class="lbl">משקל</span>${wIn}</div>
        <div class="comp-row"><span class="lbl">סמל</span>${codeSelect(st,key)}</div></div>`;
      }
      const fl=(r.flips||[]).find(f=>f.comp===c.n);
      const flBadge=fl?` <span class="badge b-warn" title="ציון הבחינה (${fl.e}) גבוה מהמגן (${fl.m}) — המשקל הגדול עבר לבחינה: מגן ${fl.s}% / בחינה ${100-fl.s}%">🔀 היפוך לטובת הבחינה</span>`:'';
      const sSel=`<select style="font-size:11px; ${sOv?'border-color:var(--brand2); background:#f5f3ff; font-weight:700;':''}" onchange="setOv('${st.id}','${key}','s',this.value)">
        <option value="">מגן ${baseComps[i].s}/${100-baseComps[i].s} (רגיל)</option>
        ${[70,60,50,40,30,20,0].map(s=>`<option value="${s}" ${sOv&&+po.s===s?'selected':''}>מגן ${s}% / בחינה ${100-s}%</option>`).join('')}</select>`;
      const eff=c.s;  // אחוז המגן בפועל

      ${rowM}${rowE}${rowFinal}
      <div class="comp-row"><span class="lbl">חלוקה</span>${sSel}</div>
      <div class="comp-row"><span class="lbl">משקל</span>${wIn}</div>
      <div class="comp-row"><span class="lbl">סמל</span>${codeSelect(st,key)}</div></div>`;
    }).join('')}</div>`;
    if(Math.round(r.wSum)!==100&&!subj.internalOnly) body+=`<div class="note" style="color:var(--warn); font-weight:700;">ℹ️ סה"כ משקלי הרכיבים: ${r.wSum}% — הציון הסופי מחושב בחלוקה יחסית (למשל אחרי הוספת עבודה נוספת)</div>`;
  }
  const finalHtml=u===0?'':`${subj.internalOnly&&!state.includeInternal?'<span class="pill">לא נכלל בממוצע</span> ':''}${custom?'<span class="badge b-pot">מותאם אישית</span> ':''}<span class="${gradeClass(r.final)}" style="font-size:15px; font-weight:800;" title="${r.raw!==null?'לפני עיגול: '+r.raw:''}">${fmt(r.final)}</span>${r.blocker&&!subj.internalOnly?' <span class="badge b-bad">מעכב</span>':''}${r.missing?' <span class="badge b-miss">חסר</span>':''}`;
  const resetBtn=custom?`<button class="btn sec sm" onclick="event.stopPropagation();resetOv('${st.id}','${subj.id}')" title="ביטול ההתאמות האישיות במקצוע זה">↩️ איפוס התאמות</button>`:'';
  const presetSel=subj.named?`<select onclick="event.stopPropagation()" onchange="applyMugbarPreset('${st.id}','${subj.id}',this.value)" style="font-size:11.5px;" title="החלת מבנה משקלים וסמלי שאלונים מקטלוג בית הספר">
    <option value="">📋 מבנה מהקטלוג...</option>
    ${Object.keys(MUGBAR_PRESETS).map(p=>`<option>${esc(p)}</option>`).join('')}</select>`:'';
  return `<div class="subj-card open"><div class="subj-head"><span>${esc(subj.name)} ${nameInput} ${unitsSel} ${presetSel} ${resetBtn}</span><span>${finalHtml}</span></div>
  <div class="subj-body">${body}</div></div>`;
}
function setOv(id,key,field,val){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.ov=st.ov||{};
  if(val===''||val===null){ if(st.ov[key]){ delete st.ov[key][field]; if(!Object.keys(st.ov[key]).length) delete st.ov[key]; } }
  else{ st.ov[key]=st.ov[key]||{}; st.ov[key][field]=+val; }
  save(); refreshOpenViews(id);
}
function resetOv(id,sid){
  const st=state.students.find(s=>s.id===id); if(!st||!st.ov) return;
  Object.keys(st.ov).filter(k=>k.startsWith(sid+'.')).forEach(k=>delete st.ov[k]);
  save(); refreshOpenViews(id);
}
function setCode(id,key,val){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.codes=st.codes||{};
  if(!val.trim()) delete st.codes[key]; else st.codes[key]=val.trim();
  save();
}
function setGrade(id,key,val){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.grades=st.grades||{};
  if(val===''||val===null) delete st.grades[key];
  else st.grades[key]=Math.max(0,Math.min(100,+val));
  save(); refreshOpenViews(id);
}
function setUnits(id,sid,val){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.units=st.units||{}; st.units[sid]=+val;
  save(); refreshOpenViews(id,true);
}
function setMugbarName(id,sid,val){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.mugbarNames=st.mugbarNames||{}; st.mugbarNames[sid]=val.trim();
  save();
}
function refreshOpenViews(id,full){
  const modal=document.getElementById('studentModal');
  if(modal.classList.contains('show')) openStudent(id);
  else if(currentTab==='entry'&&full) render();
}
function closeStudent(){
  document.getElementById('studentModal').classList.remove('show');
  render();
}

function entryGrid(subj,studs){
  if(!studs.length) return '<div class="note">אין תלמידות — הוסיפי בלשונית "תלמידות"</div>';
  // כותרות לפי יח"ל מקסימלי כדי לכלול את כל הרכיבים
  const maxU=subj.opts[subj.opts.length-1];
  const headComps=subj.comps(maxU);
  let head=`<tr><th>שם</th>${subj.opts.length>1?'<th>יח"ל</th>':''}${subj.named?'<th>מקצוע</th>':''}`;
  headComps.forEach((c,i)=>{
    head+=c.t==='i'?`<th>${esc(c.n)}</th>`:`<th>${esc(c.n)}<br><small>${c.s===0?'100% בחינה':(c.s===100?'מגן בלבד':'מגן '+c.s+'% / בחינה '+(100-c.s)+'%')}</small></th>`;
  });
  head+='<th>ציון סופי</th><th>סטטוס</th></tr>';
  const rows=studs.map(st=>{
    const u=getUnits(st,subj);
    const r=calcSubject(st,subj);
    const comps=u===0?[]:getCompsFor(st,subj,u);
    let tds=`<td><span class="name-link" onclick="openStudent('${st.id}')">${esc(st.name)}</span><br><small style="color:var(--muted)">${esc(st.cls)}</small></td>`;
    if(subj.opts.length>1) tds+=`<td><select onchange="setUnits('${st.id}','${subj.id}',this.value)">${subj.opts.map(o=>`<option value="${o}" ${o===u?'selected':''}>${o===0?'—':o}</option>`).join('')}</select></td>`;
    if(subj.named) tds+=`<td><input type="text" style="width:110px;" value="${esc((st.mugbarNames||{})[subj.id]||'')}" onchange="setMugbarName('${st.id}','${subj.id}',this.value)"></td>`;
    headComps.forEach((hc,i)=>{
      const c=comps[i];
      if(u===0||!c||!c.w){ tds+='<td style="color:#cbd5e1;">—</td>'; return; }
      const key=subj.id+'.'+i, g=st.grades||{};
      const kc=k=>((g[k]==null?'cell-miss':'')+gstatCls(st,k));
      const ct=k=>`oncontextmenu="event.preventDefault();cycleGstat('${st.id}','${k}')" title="לחיצה ימנית: שחור→אדום→כחול"`;
      if(c.t==='i'){
        tds+=`<td><input type="number" min="0" max="100" class="${kc(key)}" ${ct(key)} value="${g[key]??''}" onchange="setGrade('${st.id}','${key}',this.value)"></td>`;
      }else{
        const eff=c.s;
        const rM=eff>0?`<div style="display:flex; gap:4px; align-items:center; justify-content:flex-end;"><small style="color:var(--muted);">מגן</small><input type="number" min="0" max="100" class="${kc(key+'.m')}" ${ct(key+'.m')} value="${g[key+'.m']??''}" onchange="setGrade('${st.id}','${key}.m',this.value)"></div>`:'';
        const rE=eff<100?`<div style="display:flex; gap:4px; align-items:center; justify-content:flex-end; ${eff>0?'margin-top:3px;':''}"><small style="color:var(--muted);">בחינה</small><input type="number" min="0" max="100" class="${kc(key+'.e')}" ${ct(key+'.e')} value="${g[key+'.e']??''}" onchange="setGrade('${st.id}','${key}.e',this.value)"></div>`:'';
        tds+=`<td>${rM}${rE}</td>`;
      }
    });
    const flIc=(r.flips&&r.flips.length)?' <span title="היפוך אחוזים לטובת הבחינה ב: '+esc(r.flips.map(f=>f.comp).join(', '))+'">🔀</span>':'';
    const stat=u===0?'—':r.blocker?'<span class="badge b-bad">מעכב</span>':r.missing?'<span class="badge b-miss">חסר</span>':r.borderline?'<span class="badge b-warn">גבולי</span>':(r.final>state.thresholds.excel?'<span class="badge b-exc">מצוין</span>':'<span class="badge b-ok">תקין</span>');
    tds+=`<td class="${gradeClass(u===0?null:r.final)}" id="fin-${st.id}" style="font-weight:800;">${u===0?'—':fmt(r.final)}${flIc}</td><td>${stat}</td>`;
    return `<tr>${tds}</tr>`;
  }).join('');
  return `<table class="tbl"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

let gi={subj:'',comp:0,target:'e',rows:[],map:{},color:''};
function normName(s){
  return String(s||'').replace(/["'`׳״]/g,'').replace(/\s+/g,' ').trim();
}
function matchStudent(name,pool){
  const n=normName(name);
  if(!n) return null;
  let f=pool.find(s=>normName(s.name)===n);
  if(f) return f;
  const rev=n.split(' ').reverse().join(' ');
  f=pool.find(s=>normName(s.name)===rev);
  if(f) return f;
  const words=n.split(' ').filter(Boolean);
  const cands=pool.filter(s=>{ const sw=normName(s.name).split(' '); return words.every(w=>sw.some(x=>x===w)); });
  if(cands.length===1) return cands[0];
  const part=pool.filter(s=>normName(s.name).indexOf(n)===0||n.indexOf(normName(s.name))===0);
  return part.length===1?part[0]:null;
}

function giSetMap(idx,val){
  if(val==='') delete gi.map[idx]; else gi.map[idx]=val;
  renderGradeImport();
}
function giParseText(){
  const t=(document.getElementById('giText')||{}).value||'';
  const rows=[];
  t.split('\n').forEach(line=>{
    const s=line.trim(); if(!s) return;
    const m=s.match(/^(.+?)[\t,;]+\s*(\d{1,3}(?:\.\d+)?)\s*$/)||s.match(/^(.+?)\s+(\d{1,3}(?:\.\d+)?)\s*$/);
    if(!m) return;
    const g=+m[2];
    if(g<0||g>100) return;
    rows.push({name:m[1].trim(),grade:g});
  });
  if(!rows.length){ toast('לא זוהו שורות — ודאי שכל שורה היא: שם ואחריו ציון'); return; }
  gi.rows=rows; gi.map={}; renderGradeImport();
}
function giParseFile(input){
  const file=input.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false});
      // זיהוי עמודת שמות (טקסט) ועמודת ציונים (מספרים 0-100)
      const width=Math.max(...aoa.map(r=>r.length));
      const score=[],txt=[];
      for(let c=0;c<width;c++){ let n=0,s=0;
        aoa.forEach(r=>{ const v=r[c];
          if(typeof v==='number'&&v>=0&&v<=100) n++;
          else if(typeof v==='string'&&v.trim().length>1&&!/^\d+$/.test(v.trim())) s++; });
        score[c]=n; txt[c]=s; }
      const nameCol=txt.indexOf(Math.max(...txt));
      let gCol=-1,best=-1;
      for(let c=0;c<width;c++){ if(c!==nameCol&&score[c]>best){best=score[c];gCol=c;} }
      if(nameCol<0||gCol<0){ toast('לא זוהו עמודות שם וציון בקובץ'); input.value=''; return; }
      const rows=[];
      aoa.forEach(r=>{ const nm=r[nameCol], g=r[gCol];
        if(typeof nm!=='string'||!nm.trim()) return;
        const gv=typeof g==='number'?g:(g!==undefined&&g!==''&&!isNaN(+g)?+g:null);
        if(gv===null||gv<0||gv>100) return;
        rows.push({name:nm.trim(),grade:Math.round(gv*10)/10}); });
      if(!rows.length){ toast('לא נמצאו שורות עם שם וציון'); input.value=''; return; }
      gi.rows=rows; gi.map={}; renderGradeImport(); toast(`נקראו ${rows.length} שורות מהקובץ`);
    }catch(err){ toast('שגיאה בקריאת הקובץ: '+err.message); }
    input.value='';
  };
  rd.readAsArrayBuffer(file);
}
function giApply(){
  const subj=SUBJ_MAP[gi.subj]||SUBJECTS[0];
  const comps=giCompOptions();
  const cur=comps.find(c=>c.i===gi.comp)||comps[0];
  const pool=state.students.filter(s=>!entryClass||s.cls===entryClass);
  let n=0, skipped=[];
  gi.rows.forEach((r,idx)=>{
    const manual=gi.map[idx];
    let st;
    if(manual==='__skip'){ return; }
    else if(manual) st=pool.find(s=>s.id===manual);
    else st=matchStudent(r.name,pool);
    if(!st){ skipped.push(r.name); return; }
    const base=subj.id+'.'+cur.i;
    const key=cur.t==='e'?base+'.'+gi.target:base;
    st.grades=st.grades||{};
    st.grades[key]=Math.max(0,Math.min(100,r.grade));
    st.gstat=st.gstat||{};
    if(gi.color) st.gstat[key]=gi.color; else delete st.gstat[key];
    n++;
  });
  save();
  const cTxt=gi.color==='r'?' (אדום — טרם דווח)':gi.color==='b'?' (כחול — פיקטיבי)':' (שחור — דווח)';
  toast(`הוזנו ${n} ציונים ב${subj.name} · ${cur.n}${cTxt}`+(skipped.length?` · ${skipped.length} לא זוהו ודולגו`:''));
  gi.rows=[]; closeGradeImport();
}

function applyEntryColor(){
  const subj=SUBJ_MAP[entrySubj]||SUBJECTS[0];
  const scope=(document.getElementById('ecScope')||{}).value||'all';
  const color=(document.getElementById('ecColor')||{}).value||'';
  const studs=filteredStudents(entryClass);
  if(!studs.length){ toast('אין תלמידות בבחירה'); return; }
  const cTxt=color==='r'?'🔴 אדום (טרם דווח)':color==='b'?'🔵 כחול (פיקטיבי)':'⚫ שחור (דווח למשרד)';
  const sTxt=scope==='all'?'כל הציונים במקצוע':'הרכיב שנבחר';
  if(!confirm(`לצבוע ${sTxt} ב${subj.name} אצל ${studs.length} תלמידות בצבע ${cTxt}?\n(רק ציונים שהוזנו — תאים ריקים לא ישתנו)`)) return;
  let n=0;
  studs.forEach(st=>{
    const u=getUnits(st,subj); if(u===0) return;
    const comps=getCompsFor(st,subj,u);
    st.gstat=st.gstat||{};
    const mark=k=>{ if((st.grades||{})[k]===undefined) return;
      if(color) st.gstat[k]=color; else delete st.gstat[k]; n++; };
    if(scope==='all'){
      comps.forEach((c,i)=>{ const base=subj.id+'.'+i;
        if(c.t==='i') mark(base); else { mark(base+'.m'); mark(base+'.e'); } });
    }else{
      const [idxS,part]=String(scope).split('|');
      const i=+idxS, base=subj.id+'.'+i;
      if(part==='g') mark(base);
      else if(part==='m') mark(base+'.m');
      else if(part==='e') mark(base+'.e');
      else { mark(base+'.m'); mark(base+'.e'); }
    }
  });
  save(); render();
  toast(`נצבעו ${n} ציונים ב${subj.name} — ${cTxt}`);
}

    </tbody></table>`:'<div class="note">אין שינוי בין המצב האמיתי לתרחיש — שני ציון בטבלת הניסוי או בחרי תרחיש כללי</div>'}
    </div>
  </div>`;
}
// טבלת עריכה של הסימולציה: מציגה את הציונים האמיתיים, שינויים נשמרים בשכבת הניסוי בלבד
function simGrid(subj,studs){
  if(!studs.length) return '<div class="note">אין תלמידות</div>';
  const maxU=subj.opts[subj.opts.length-1];
  const headComps=subj.comps(maxU);
  let head=`<tr><th>שם</th>${subj.opts.length>1?'<th>יח"ל</th>':''}`;
  headComps.forEach(c=>{ head+=c.t==='i'?`<th>${esc(c.n)}</th>`:`<th>${esc(c.n)}<br><small>${c.s===0?'100% בחינה':'מגן '+c.s+'%'}</small></th>`; });
  head+='<th>ציון אמיתי</th><th>ציון בניסוי</th></tr>';
  const rows=studs.map(st=>{
    const u=getUnits(st,subj);
    const comps=u===0?[]:getCompsFor(st,subj,u);
    const rReal=calcSubject(st,subj);
    const rSim=calcSubject(st,subj,{sim:true});
    const g=gradesOf(st,true);
    let tds=`<td><span class="name-link" onclick="openStudent('${st.id}')">${esc(st.name)}</span><br><small style="color:var(--muted)">${esc(st.cls)}</small></td>`;
    if(subj.opts.length>1) tds+=`<td>${u===0?'—':u}</td>`;
    headComps.forEach((hc,i)=>{
      const c=comps[i];
      if(u===0||!c||!c.w){ tds+='<td style="color:#cbd5e1;">—</td>'; return; }
      const key=subj.id+'.'+i;
      const cls=k=>((g[k]==null?'cell-miss ':'')+(isSimKey(st,k)?'sim-cell':''));
      if(c.t==='i'){
        tds+=`<td><input type="number" min="0" max="100" class="${cls(key)}" value="${g[key]??''}" onchange="setGradeSim('${st.id}','${key}',this.value)"></td>`;
      }else{
        const eff=c.s;
        const rM=eff>0?`<div style="display:flex; gap:4px; align-items:center; justify-content:flex-end;"><small style="color:var(--muted);">מגן</small><input type="number" min="0" max="100" class="${cls(key+'.m')}" value="${g[key+'.m']??''}" onchange="setGradeSim('${st.id}','${key}.m',this.value)"></div>`:'';
        const rE=eff<100?`<div style="display:flex; gap:4px; align-items:center; justify-content:flex-end; ${eff>0?'margin-top:3px;':''}"><small style="color:var(--muted);">בחינה</small><input type="number" min="0" max="100" class="${cls(key+'.e')}" value="${g[key+'.e']??''}" onchange="setGradeSim('${st.id}','${key}.e',this.value)"></div>`:'';
        tds+=`<td>${rM}${rE}</td>`;
      }
    });
    const diff=u!==0&&rReal.final!==rSim.final;
    tds+=`<td class="${gradeClass(u===0?null:rReal.final)}">${u===0?'—':fmt(rReal.final)}</td>
    <td class="${gradeClass(u===0?null:rSim.final)}" style="font-weight:800; ${diff?'background:#fff7ed;':''}">${u===0?'—':fmt(rSim.final)}${diff?' 🔶':''}</td>`;
    return `<tr>${tds}</tr>`;
  }).join('');
  return `<table class="tbl"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

/* ============ מחשבון "כמה צריך בהערכה הפנימית" ============ */
// מאתר את רכיב ההערכה הפנימית שניתן לשחק בו
function internalComp(st,subj){
  const u=getUnits(st,subj); if(u===0) return null;
  const comps=getCompsFor(st,subj,u);
  for(let i=0;i<comps.length;i++){ if(comps[i].t==='i'&&comps[i].w>0) return {i,c:comps[i]}; }
  return null;
}
// הציון המינימלי בהערכה הפנימית שיביא את ציון המקצוע ליעד (חיפוש מדויק, מכבד עיגול והיפוך)
function neededInternalForSubject(st,subj,target){
  const ic=internalComp(st,subj); if(!ic) return {ok:false,reason:'אין הערכה פנימית'};
  const key=subj.id+'.'+ic.i;
  st.grades=st.grades||{};
  const orig=st.grades[key];
  const start=orig===undefined?0:Math.max(0,Math.min(100,Math.ceil(orig)));
  let found=null;
  for(let x=start;x<=100;x++){   // רק העלאה — לא נציע להוריד ציון קיים
    st.grades[key]=x;
    const r=calcSubject(st,subj);
    if(r.final!==null&&r.final>=target){ found=x; break; }
  }
  if(orig===undefined) delete st.grades[key]; else st.grades[key]=orig;
  return found===null?{ok:false,reason:'לא ניתן להגיע ליעד'}:{ok:true,x:found,comp:ic.c.n,key,cur:orig===undefined?null:orig,w:ic.c.w};
}
// הציון המינימלי בהערכה פנימית של מקצוע כלשהו שיביא את הממוצע ליעד
function neededInternalForAvg(st,target){
  const best=[];
  SUBJECTS.forEach(subj=>{
    if(subj.internalOnly) return;
    const ic=internalComp(st,subj); if(!ic) return;
    const key=subj.id+'.'+ic.i;
    st.grades=st.grades||{};
    const orig=st.grades[key];
    const start=orig===undefined?0:Math.max(0,Math.min(100,Math.ceil(orig)));
    let found=null;
    for(let x=start;x<=100;x++){   // רק העלאה
      st.grades[key]=x;
      const rr=calcStudent(st);
      if(rr.avg!==null&&rr.avg>target){ found=x; break; }
    }
    if(orig===undefined) delete st.grades[key]; else st.grades[key]=orig;
    if(found!==null) best.push({subj,x:found,cur:orig===undefined?null:orig,comp:ic.c.n,delta:found-(orig===undefined?0:orig)});
  });
  best.sort((a,b)=>a.delta-b.delta);
  return best[0]||null;
}
// מסלול שני: העלאת כל ההערכות הפנימיות לרף אחיד X (רק אלה שמתחתיו)
function neededInternalAll(st,target){
  const keys=[];
  SUBJECTS.forEach(subj=>{
    if(subj.internalOnly) return;
    const ic=internalComp(st,subj); if(!ic) return;
    keys.push({key:subj.id+'.'+ic.i,name:subj.name});
  });
  if(!keys.length) return null;
  st.grades=st.grades||{};
  const orig={}; keys.forEach(k=>{ orig[k.key]=st.grades[k.key]; });
  let found=null,changed=0;
  for(let x=0;x<=100;x++){
    let ch=0;
    keys.forEach(k=>{ const cur=orig[k.key];
      if(cur===undefined||cur<x){ st.grades[k.key]=x; ch++; } else st.grades[k.key]=cur; });
    const rr=calcStudent(st);
    if(rr.avg!==null&&rr.avg>target){ found=x; changed=ch; break; }
  }
  keys.forEach(k=>{ if(orig[k.key]===undefined) delete st.grades[k.key]; else st.grades[k.key]=orig[k.key]; });
  return found===null?null:{x:found,changed,total:keys.length};
}
function calcPanel(studs){
  const T=state.thresholds;
  const passT=Math.ceil(T.pass); // ציון עובר בפועל (55)
  const failRows=[];
  studs.forEach(st=>{
    SUBJECTS.forEach(subj=>{
      if(subj.internalOnly) return;
      const r=calcSubject(st,subj);
      if(!r.active||r.final===null||r.final>=T.pass) return;
      const need=neededInternalForSubject(st,subj,passT);
      failRows.push({st,subj,cur:r.final,need});
    });
  });
  const excRows=[];
  studs.forEach(st=>{
    const r=calcStudent(st);
    if(r.avg===null||r.blockers.length||!r.complete) return;
    if(r.avg>T.excel) return;                 // כבר מצטיינת
    if(r.avg<T.excel-12) return;              // רחוקה מדי — לא רלוונטי
    const n=neededInternalForAvg(st,T.excel);
    const nAll=n?null:neededInternalAll(st,T.excel);
    excRows.push({st,avg:r.avg,n,nAll,unitsOk:r.unitsOk});
  });
  excRows.sort((a,b)=>b.avg-a.avg);
  if(!failRows.length&&!excRows.length) return '';
  return `<div class="card" style="margin-bottom:14px; border:2px solid var(--ok);">
    <h3 class="sec">🎯 מחשבון: כמה צריך בהערכה הפנימית?</h3>
    <div class="note" style="margin-bottom:10px;">החישוב מבוסס על הציונים <b>האמיתיים</b> ומחפש את הציון המינימלי בהערכה הפנימית שמביא ליעד (מכבד עיגול, משקלים והיפוך אחוזים). זו המלצה לצורך שיקול דעת — ההזנה בפועל נעשית בטבלת הניסוי או בכרטיס התלמידה.</div>
    ${failRows.length?`<h3 class="sec" style="font-size:14px; color:var(--bad);">🔴 כדי לעבור (${passT}) — ${failRows.length} מקצועות מעכבים</h3>
    <div class="scroll" style="max-height:34vh; margin-bottom:12px;"><table class="tbl">
    <thead><tr><th>תלמידה</th><th>מקצוע</th><th>ציון נוכחי</th><th>רכיב ההערכה</th><th>ציון נוכחי ברכיב</th><th>נדרש</th></tr></thead><tbody>
    ${failRows.map(f=>`<tr><td><span class="name-link" onclick="openStudent('${f.st.id}')">${esc(f.st.name)}</span></td>
      <td>${esc(f.subj.name)}</td><td class="grade-bad" style="font-weight:800;">${f.cur}</td>
      <td>${f.need.ok?esc(f.need.comp)+' <span class="pill">'+f.need.w+'%</span>':'—'}</td>
      <td>${f.need.ok?(f.need.cur===null?'<span class="badge b-miss">לא הוזן</span>':f.need.cur):'—'}</td>
      <td>${f.need.ok?`<b style="color:var(--ok); font-size:15px;">${f.need.x}</b>${f.need.cur!==null&&f.need.x>f.need.cur?` <span class="pill">+${f.need.x-f.need.cur}</span>`:''}`:`<span class="badge b-bad">${esc(f.need.reason)}</span>`}</td>
    </tr>`).join('')}</tbody></table></div>`:''}
    ${excRows.length?`<h3 class="sec" style="font-size:14px; color:var(--gold);">⭐ כדי להצטיין (ממוצע מעל ${T.excel}) — ${excRows.length} תלמידות בטווח</h3>
    <div class="scroll" style="max-height:34vh;"><table class="tbl">
    <thead><tr><th>תלמידה</th><th>ממוצע נוכחי</th><th>הדרך הקצרה ביותר</th><th>ציון נדרש בהערכה הפנימית</th><th>תנאי יח"ל</th></tr></thead><tbody>
    ${excRows.map(x=>`<tr><td><span class="name-link" onclick="openStudent('${x.st.id}')">${esc(x.st.name)}</span></td>
      <td class="${gradeClass(x.avg)}" style="font-weight:800;">${x.avg}</td>
      <td>${x.n?esc(x.n.subj.name)+' · '+esc(x.n.comp)
            :(x.nAll?`<b>העלאת כל ההערכות הפנימיות</b> <span class="pill">${x.nAll.changed} מתוך ${x.nAll.total} רכיבים</span>`
                    :'<span class="badge b-bad">לא ניתן להגיע דרך ההערכות הפנימיות</span>')}</td>
      <td>${x.n?`<b style="color:var(--ok); font-size:15px;">${x.n.x}</b>${x.n.cur!==null?` <span class="pill">כרגע ${x.n.cur}${x.n.delta>0?' · +'+x.n.delta:''}</span>`:''}`
             :(x.nAll?`<b style="color:var(--ok); font-size:15px;">${x.nAll.x}</b> <span class="pill">לכל רכיב שמתחת לרף</span>`:'—')}</td>
      <td>${x.unitsOk?'✓':'<span class="badge b-warn">✗ לא עומדת</span>'}</td>
    </tr>`).join('')}</tbody></table></div>`:''}
  </div>`;
}

/* ============ חיזוי מצטיינות סוף שנה ============ */
function predictionPanel(studs){
  const T=state.thresholds;
  const pOpts={split:simSplit===''?null:+simSplit, predict:true, bonus:+simBonus, sim:true};
  const res=studs.map(st=>({st,r:calcStudent(st,pOpts)})).filter(x=>x.r.avg!==null);
  if(!res.length) return '';
  res.sort((a,b)=>b.r.avg-a.r.avg);
  const exc=res.filter(x=>x.r.excellent);
  const pot=res.filter(x=>x.r.potential);
  const close=res.filter(x=>x.r.complete&&x.r.blockers.length===0&&x.r.unitsOk&&x.r.avg>=87&&x.r.avg<=T.excel);
  const noUnits=res.filter(x=>x.r.complete&&x.r.blockers.length===0&&!x.r.unitsOk&&x.r.avg>=T.potential);
  const gapCell=v=>{
    const d=Math.round((v-T.excel)*10)/10;
    if(d>0) return `<span class="delta-up">+${d} ✓</span>`;
    return `<span class="${d>=-3?'grade-warn':'grade-bad'}" style="font-weight:800;">${d===0?'0 (לא מספיק — נדרש מעל)':d}</span>`;
  };
  return `<div class="card" style="margin-bottom:14px; border:2px solid var(--brand2);">
    <h3 class="sec">🔮 חיזוי סוף שנה — מי צפויה להיות מצטיינת</h3>
    <div class="note" style="margin-bottom:10px;">בתחילת השנה מזינים לכל רכיב את ציון המגן / הערכת המורה — והחיזוי משלים אוטומטית כל בחינה חסרה לפי המגן. ככל שמוזנים ציונים אמיתיים במהלך השנה, החיזוי מתעדכן ומתדייק.</div>
    <div class="kpis">
      <div class="kpi k3"><div class="n">${exc.length}</div><div class="t">מצטיינות צפויות ⭐</div></div>
      <div class="kpi k4"><div class="n">${pot.length}</div><div class="t">פוטנציאל צפוי (${T.potential} עד ${T.excel})</div></div>
      <div class="kpi k1"><div class="n">${close.length}</div><div class="t">במרחק נגיעה (87+)</div></div>
      <div class="kpi k6"><div class="n">${noUnits.length}</div><div class="t">ממוצע גבוה בלי תנאי היח"ל</div></div>
    </div>
    <div class="scroll" style="max-height:50vh;">
    <table class="tbl"><thead><tr><th>#</th><th>שם</th><th>כיתה</th><th>ממוצע חזוי</th><th>פער מהסף (מעל ${T.excel})</th><th>מבוסס חיזוי ב...</th><th>תנאי יח"ל</th><th>סטטוס חזוי</th></tr></thead><tbody>
    ${res.slice(0,60).map((x,i)=>`<tr ${x.r.excellent?'style="background:#fffbeb;"':x.r.potential?'style="background:#f5f3ff;"':''}>
      <td>${i+1}</td>
      <td><span class="name-link" onclick="openStudent('${x.st.id}')">${esc(x.st.name)}</span></td>
      <td>${esc(x.st.cls)}</td>
      <td class="${gradeClass(x.r.avg)}" style="font-weight:800; font-size:14px;">${x.r.avg}</td>
      <td>${gapCell(x.r.avg)}</td>
      <td>${x.r.predIn.length?`<span class="pill" title="${esc(x.r.predIn.join(', '))}">${x.r.predIn.length} מקצועות</span>`:'<span class="badge b-ok">נתונים מלאים</span>'}</td>
      <td>${x.r.unitsOk?'✓':'<span class="badge b-warn" title="נדרש: מתמטיקה 4-5 ואנגלית 5 יח&quot;ל">✗</span>'}</td>
      <td><span class="badge ${x.r.cls}">${x.r.status}</span></td>
    </tr>`).join('')}
    </tbody></table></div>
  </div>`;
}

/* ============ התראות ============ */
function renderAlerts(m){
  const studs=filteredStudents(alertClass);
  let all=[];
  studs.forEach(st=>{ all=all.concat(studentAlerts(st,calcStudent(st)).map(a=>({...a,st}))); });
  const sevOrder={bad:0,warn:1,pot:2,info:3,miss:4};
  all.sort((a,b)=>sevOrder[a.sev]-sevOrder[b.sev]);
  const groups=[['bad','🔴 מעכבים — טיפול דחוף'],['warn','🟠 גבוליים, פערים חריגים וציונים שטרם דווחו'],['pot','🟣 פוטנציאל הצטיינות'],['info','🔵 ציונים פיקטיביים בשימוש'],['miss','⚪ ציונים חסרים']];
  m.innerHTML=`
  <div class="toolbar"><label>כיתה:</label><select onchange="alertClass=this.value;render()"><option value="">כל השכבה</option>${state.classes.map(c=>`<option ${alertClass===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
  <span class="pill">${all.length} התראות</span></div>
  ${groups.map(([sev,title])=>{
    const items=all.filter(a=>a.sev===sev);
    if(!items.length) return '';
    return `<div class="card" style="margin-bottom:14px;"><h3 class="sec">${title} (${items.length})</h3>
    ${items.map(a=>`<div class="alert-item al-${a.sev}"><span class="name-link" onclick="openStudent('${a.st.id}')">${esc(a.st.name)}</span> · ${esc(a.text.replace(a.st.name+': ',''))}</div>`).join('')}</div>`;
  }).join('')||'<div class="card"><div class="note">אין התראות 🎉</div></div>'}`;
}

  <div class="toolbar">
    <label>דוח עבור:</label><select onchange="reportClass=this.value;render()"><option value="">כל השכבה</option>${state.classes.map(c=>`<option ${reportClass===c?'selected':''}>${esc(c)}</option>`).join('')}</select>

function buildReportHtml(cls){
  const studs=filteredStudents(cls).sort((a,b)=>a.cls.localeCompare(b.cls)||a.name.localeCompare(b.name));
  const results=studs.map(st=>({st,r:calcStudent(st)}));
  const n=studs.length;
  if(!n) return '<div class="note">אין תלמידות</div>';
  const elig=results.filter(x=>x.r.eligible).length;
  const exc=results.filter(x=>x.r.excellent);
  const pot=results.filter(x=>x.r.potential);
  const blocked=results.filter(x=>x.r.blockers.length>0);
  const avgAll=avgOf(results.map(x=>x.r.avg).filter(v=>v!==null));
  const today=new Date().toLocaleDateString('he-IL');
  const subjAvgs=SUBJECTS.map(sub=>{const vs=results.map(x=>x.r.per[sub.id]).filter(r=>r&&r.active&&r.final!==null).map(r=>r.final); return {name:sub.name,avg:avgOf(vs)};}).filter(x=>x.avg!==null);
  let alerts=[];
  results.forEach(x=>{ alerts=alerts.concat(studentAlerts(x.st,x.r).filter(a=>a.sev==='bad'||a.sev==='warn')); });
  return `
  <div style="display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px;">
    ${logoHtml(48)}
    <div style="text-align:center;">
      <h2 style="font-size:20px;">אולפנת הראל · דוח מצב בגרות — ${cls?esc(cls):'כל השכבה'}</h2>
      <div class="note">הופק בתאריך ${today} · סימולטור אולפנת הראל</div>
    </div>
  </div>
  <div class="kpis">
    <div class="kpi k1"><div class="n">${n}</div><div class="t">תלמידות</div></div>
    <div class="kpi k2"><div class="n">${elig} (${Math.round(elig/n*100)}%)</div><div class="t">זכאיות</div></div>
    <div class="kpi k3"><div class="n">${exc.length}</div><div class="t">מצטיינות</div></div>
    <div class="kpi k4"><div class="n">${pot.length}</div><div class="t">פוטנציאל</div></div>
    <div class="kpi k5"><div class="n">${blocked.length}</div><div class="t">עם מעכבים</div></div>
    <div class="kpi k6"><div class="n">${avgAll===null?'—':avgAll}</div><div class="t">ממוצע</div></div>
  </div>
  <h3 class="sec">טבלת תלמידות מפורטת</h3>
  <div class="scroll" style="max-height:none;">
  <table class="tbl"><thead><tr><th>שם</th><th>כיתה</th>${SUBJECTS.map(s=>`<th>${esc(s.name)}</th>`).join('')}<th>ממוצע</th><th>סטטוס</th></tr></thead><tbody>
  ${results.map(x=>`<tr><td style="font-weight:700;">${esc(x.st.name)}</td><td>${esc(x.st.cls)}</td>
    ${SUBJECTS.map(s=>{const r=x.r.per[s.id]; if(!r||!r.active)return '<td style="color:#cbd5e1;">—</td>'; return `<td class="${gradeClass(r.final)}">${fmt(r.final)}</td>`;}).join('')}
    <td class="${gradeClass(x.r.avg)}" style="font-weight:800;">${fmt(x.r.avg)}</td>
    <td><span class="badge ${x.r.cls}">${x.r.status}</span></td></tr>`).join('')}
  </tbody></table></div>
  <div class="grid2" style="margin-top:16px;">
    <div>
      <h3 class="sec">⭐ מצטיינות (${exc.length})</h3>
      ${exc.length?exc.sort((a,b)=>b.r.avg-a.r.avg).map(x=>`<div class="alert-item al-pot">${esc(x.st.name)} · ${esc(x.st.cls)} · ממוצע ${x.r.avg}</div>`).join(''):'<div class="note">אין עדיין</div>'}

function reportText(cls){
  const studs=filteredStudents(cls);
  const results=studs.map(st=>({st,r:calcStudent(st)}));
  const n=studs.length; if(!n) return 'אין נתונים';
  const elig=results.filter(x=>x.r.eligible).length;
  const exc=results.filter(x=>x.r.excellent);
  const pot=results.filter(x=>x.r.potential);
  const blocked=results.filter(x=>x.r.blockers.length>0);
  const avgAll=avgOf(results.map(x=>x.r.avg).filter(v=>v!==null));
  let t=`אולפנת הראל · דוח מצב בגרות — ${cls||'כל השכבה'} (${new Date().toLocaleDateString('he-IL')})\n`;
  t+=`תלמידות: ${n} | זכאיות: ${elig} (${Math.round(elig/n*100)}%) | מצטיינות: ${exc.length} | פוטנציאל: ${pot.length} | עם מעכבים: ${blocked.length} | ממוצע: ${avgAll??'—'}\n\n`;
  if(exc.length) t+='⭐ מצטיינות:\n'+exc.sort((a,b)=>b.r.avg-a.r.avg).map(x=>`  ${x.st.name} (${x.st.cls}) — ${x.r.avg}`).join('\n')+'\n\n';
  if(pot.length) t+='💜 פוטנציאל הצטיינות:\n'+pot.sort((a,b)=>b.r.avg-a.r.avg).map(x=>`  ${x.st.name} (${x.st.cls}) — ${x.r.avg}`).join('\n')+'\n\n';
  if(blocked.length) t+='🚨 עם מקצועות מעכבים:\n'+blocked.map(x=>`  ${x.st.name} (${x.st.cls}) — ${x.r.blockers.map(s=>s.name).join(', ')}`).join('\n')+'\n';
  return t;
}
function emailReport(){

  window.location.href=`mailto:?subject=${subj}&body=${encodeURIComponent(t)}`;
}

    </tr>`;

function bulkApply(i){
  const subj=SUBJ_MAP[bulkSubj]||SUBJECTS[0];
  const key=subj.id+'.'+i;
  const sEl=document.getElementById('bs_'+i), wEl=document.getElementById('bw_'+i), cEl=document.getElementById('bc_'+i);
  const sVal=sEl?sEl.value:'', wVal=wEl?wEl.value:'';
  let cVal=cEl?cEl.value:'';
  if(cVal==='__c'){ const t=prompt('הקלידי סמל שאלון להחלה על כל התלמידות:',''); if(t===null) return; cVal=t.trim(); }
  if(sVal===''&&wVal===''&&cVal===''){ toast('בחרי סמל שאלון, חלוקה או משקל'); return; }
  const targets=bulkTargets();
  if(!targets.length){ toast('אין תלמידות בבחירה'); return; }
  const what=[cVal?`סמל ${cVal}`:'',sVal!==''?`מגן ${sVal}%/בחינה ${100-sVal}%`:'',wVal!==''?`משקל ${wVal}%`:''].filter(Boolean).join(' · ');
  if(!confirm(`להחיל על ${targets.length} תלמידות ב${esc(subj.name)} — ${esc(String(what))}?`)) return;
  targets.forEach(st=>{
    if(cVal){ st.codes=st.codes||{}; st.codes[key]=cVal; }
    if(sVal!==''||wVal!==''){
      st.ov=st.ov||{}; st.ov[key]=Object.assign({},st.ov[key]);
      if(sVal!=='') st.ov[key].s=+sVal;
      if(wVal!=='') st.ov[key].w=+wVal;
    }
  });
  save(); render(); toast(`הוחל על ${targets.length} תלמידות`);
}
function bulkCodesAll(){
  const subj=SUBJ_MAP[bulkSubj]||SUBJECTS[0];
  const u=subj.opts[subj.opts.length-1];
  const comps=getComps(subj,u);
  const targets=bulkTargets();
  if(!targets.length){ toast('אין תלמידות בבחירה'); return; }

  comps.forEach((c,i)=>{
    const el=document.getElementById('bc_'+i);
    if(el&&el.value&&el.value!=='__c') picks.push([subj.id+'.'+i,el.value,c.n]);

  targets.forEach(st=>{ st.codes=st.codes||{}; picks.forEach(([k,v])=>{ st.codes[k]=v; }); });
  save(); render(); toast(`הוחלו ${picks.length} סמלים על ${targets.length} תלמידות`);
}
function bulkClear(){
  const subj=SUBJ_MAP[bulkSubj]||SUBJECTS[0];
  const targets=bulkTargets();
  const n=targets.filter(s=>Object.keys(s.ov||{}).some(k=>k.indexOf(subj.id+'.')===0)).length;

}
