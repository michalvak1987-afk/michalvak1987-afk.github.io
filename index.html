<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סימולטור בגרות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Assistant:wght@400;600;700;800&family=Heebo:wght@400;600;700;800;900&family=Varela+Round&family=Noto+Sans+Hebrew:wght@400;600;700;800&family=Secular+One&family=Frank+Ruhl+Libre:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#eef1f9; --card:#fff; --ink:#16233a; --muted:#64748b;
  --brand:#4f46e5; --brand2:#9333ea; --ok:#059669; --warn:#e0820c; --bad:#e11d48;
  --gold:#b45309; --line:#e6eaf4; --soft:#f1f4fb;
  --sh:0 4px 16px rgba(30,41,80,.07); --sh2:0 12px 32px rgba(30,41,80,.13);
}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);}to{opacity:1; transform:none;}}
@keyframes pop{from{transform:scale(.94); opacity:0;}to{transform:scale(1); opacity:1;}}
@keyframes shimmer{0%{background-position:-500px 0;}100%{background-position:500px 0;}}
.ic{vertical-align:-4px; flex-shrink:0;}
nav.tabs button .ic{margin-inline-end:6px;}
.kpi{display:flex; align-items:center; gap:13px;}
.kpi .ico{width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.3); backdrop-filter:blur(6px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 3px 10px rgba(0,0,0,.12); flex-shrink:0;
  transition:transform .34s cubic-bezier(.34,1.56,.64,1);}
.kpi .ico svg{width:24px; height:24px; stroke-width:2.1;}
.kpi:hover .ico{transform:scale(1.1) rotate(-5deg);}
.kpi .txt{min-width:0;}
h2.sec .ic,h3.sec .ic{margin-inline-end:7px; color:var(--brand);}
button.btn .ic{margin-inline-end:5px;}
h1,h2,h3,.kpi .n,.ring .rn,table.tbl th,button.btn,.badge{font-family:var(--font-head,'Rubik'),sans-serif;}
/* ===== מספרים: שחור מודגש כברירת מחדל ===== */
input[type=number]{font-family:var(--font-num,'Rubik'),sans-serif; font-weight:800; color:#0b1220; font-size:14px; letter-spacing:-.2px;}
.grade-ok,.grade-exc,.grade-warn,.grade-bad{font-family:var(--font-num,'Rubik'),sans-serif; font-weight:800;}
.grade-ok{color:#0b1220;}
table.tbl td{font-weight:600;}
table.tbl td .grade-ok,table.tbl td.grade-ok{font-weight:800; color:#0b1220;}
/* גופן נעים גם לתפריטים ולשדות טקסט */
select,input[type=text],textarea{font-family:var(--font-body,'Assistant'),sans-serif; font-weight:600;}
nav.tabs button{font-family:var(--font-head,'Rubik'),sans-serif; font-weight:600;}
.name-link{font-family:var(--font-body,'Assistant'),sans-serif; font-weight:800;}
td,th{font-variant-numeric:tabular-nums;}
@keyframes sheetUp{from{transform:translateY(40px) scale(.97); opacity:0;}to{transform:none; opacity:1;}}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
@keyframes ringIn{from{stroke-dashoffset:var(--circ);}}
/* ===== ערכות צבע ===== */
html[data-accent="indigo"]{--brand:#4f46e5; --brand2:#9333ea; --h1:#312e81; --h2:#5b21b6; --h3:#9333ea;}
html[data-accent="ocean"]{--brand:#0284c7; --brand2:#0891b2; --h1:#0c4a6e; --h2:#0369a1; --h3:#06b6d4;}
html[data-accent="emerald"]{--brand:#059669; --brand2:#0d9488; --h1:#064e3b; --h2:#047857; --h3:#14b8a6;}
html[data-accent="rose"]{--brand:#e11d48; --brand2:#db2777; --h1:#881337; --h2:#be123c; --h3:#f43f5e;}
html[data-accent="sunset"]{--brand:#ea580c; --brand2:#db2777; --h1:#7c2d12; --h2:#c2410c; --h3:#f59e0b;}
/* ===== מתג iOS ===== */
input[type=checkbox]{appearance:none; -webkit-appearance:none; width:44px; height:26px; border-radius:99px;
  background:#d5dbe8; position:relative; cursor:pointer; transition:background .25s cubic-bezier(.2,.9,.3,1.2); vertical-align:middle; flex-shrink:0; border:none;}
input[type=checkbox]::after{content:''; position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%;
  background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.28); transition:transform .25s cubic-bezier(.2,.9,.3,1.2);}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--brand),var(--brand2));}
input[type=checkbox]:checked::after{transform:translateX(-18px);}
input[type=checkbox]:active::after{width:24px;}
label:has(input[type=checkbox]){display:inline-flex; align-items:center; gap:9px; cursor:pointer;}
/* ===== גלילה מעוצבת ===== */
::-webkit-scrollbar{width:11px; height:11px;}
::-webkit-scrollbar-thumb{background:#c3cddf; border-radius:99px; border:3px solid transparent; background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:#9fadc7; background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}
/* ===== טבעת התקדמות ===== */
.ring-wrap{display:flex; gap:22px; flex-wrap:wrap; justify-content:center; align-items:center;}
.ring{position:relative; width:132px; height:132px; text-align:center;}
.ring svg{transform:rotate(-90deg);}
.ring .rv{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring .rn{font-size:27px; font-weight:800; letter-spacing:-1px;}
.ring .rl{font-size:11.5px; color:var(--muted); font-weight:700; margin-top:1px;}
/* ===== חיפוש מהיר ===== */
#cmdk{position:fixed; inset:0; background:rgba(15,23,42,.45); backdrop-filter:blur(6px); z-index:600; display:none; align-items:flex-start; justify-content:center; padding-top:12vh;}
#cmdk.show{display:flex;}
#cmdk .panel{background:rgba(255,255,255,.96); backdrop-filter:blur(24px) saturate(180%); width:min(620px,92vw); border-radius:20px;
  box-shadow:0 30px 80px rgba(15,23,42,.42); overflow:hidden; animation:sheetUp .22s cubic-bezier(.2,.9,.3,1.1) both; border:1px solid rgba(255,255,255,.7);}
#cmdk input{width:100%; border:none; border-bottom:1px solid var(--line); border-radius:0; padding:17px 20px; font-size:16.5px; outline:none; background:transparent;}
#cmdk .res{max-height:48vh; overflow:auto; padding:6px;}
#cmdk .it{padding:11px 14px; border-radius:12px; cursor:pointer; display:flex; align-items:center; gap:10px; font-size:14px;}
#cmdk .it:hover,#cmdk .it.sel{background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff;}
#cmdk .it:hover .pill,#cmdk .it.sel .pill{background:rgba(255,255,255,.22); color:#fff; border-color:transparent;}
#cmdk .hint{padding:9px 16px; font-size:11.5px; color:var(--muted); border-top:1px solid var(--line); background:#fafbfe; display:flex; gap:14px;}
kbd{background:#fff; border:1px solid #d6deec; border-bottom-width:2px; border-radius:6px; padding:1px 6px; font-size:11px; font-family:inherit; font-weight:700;}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:var(--font-body,'Assistant'),-apple-system,'Segoe UI',Arial,sans-serif; font-weight:600; letter-spacing:-.1px; color:var(--ink); font-size:14px;
  background:var(--bg);
  background-image:radial-gradient(1200px 500px at 100% -80px,rgba(147,51,234,.10),transparent 60%),radial-gradient(900px 400px at -10% 0,rgba(79,70,229,.10),transparent 55%);
  background-attachment:fixed;}
header.app{background:linear-gradient(120deg,#312e81 0%,#5b21b6 45%,#9333ea 100%); color:#fff; padding:14px 26px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:relative; z-index:70; min-height:82px; box-shadow:0 6px 24px rgba(49,46,129,.28);}
header.app::after{content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(600px 200px at 85% -40px,rgba(255,255,255,.18),transparent 70%);}
header.app>*{position:relative; z-index:1;}
header.app h1{font-size:22px; font-weight:800; letter-spacing:-.4px; text-shadow:0 2px 10px rgba(0,0,0,.18);}
header.app .sub{opacity:.85; font-size:12.5px;}
#hdrCenter{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:14px; text-align:center; pointer-events:none; z-index:2;}
#hdrCenter .ttl{text-align:center;}
#hdrActions{margin-inline-start:auto; display:flex; gap:8px; align-items:center; z-index:3;}
.glassIcon{width:56px; height:56px; border-radius:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  background:linear-gradient(145deg,rgba(255,255,255,.34),rgba(255,255,255,.12));
  border:1px solid rgba(255,255,255,.45); backdrop-filter:blur(12px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), inset 0 -8px 16px rgba(255,255,255,.09), 0 8px 22px rgba(0,0,0,.22);
  position:relative; overflow:hidden; animation:floaty 4.5s ease-in-out infinite;}
.glassIcon::before{content:''; position:absolute; top:-60%; left:-30%; width:80%; height:180%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent); transform:rotate(22deg); animation:sheen 5s ease-in-out infinite;}
.glassIcon svg{width:28px; height:28px; stroke-width:2; filter:drop-shadow(0 2px 4px rgba(0,0,0,.25)); position:relative; z-index:1;}
@keyframes sheen{0%,72%{left:-40%;}88%,100%{left:120%;}}
.coordLine{display:inline-flex; align-items:center; gap:6px; margin-top:5px; font-size:12px; font-weight:700;
  background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); border-radius:99px; padding:3px 12px; backdrop-filter:blur(8px);}
@media(max-width:1150px){#hdrCenter{position:static; transform:none; margin-inline-start:14px; text-align:right;} #hdrCenter .ttl{text-align:right;}}
.hbtn{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); color:#fff; border-radius:12px;
  padding:8px 12px; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700; display:flex; align-items:center; gap:7px; transition:all .15s ease;}
.hbtn:hover{background:rgba(255,255,255,.28); transform:translateY(-1px);}
#subBar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 22px; position:relative; z-index:40;
  background:rgba(255,255,255,.72); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); font-size:12.5px;}
#profileSlot{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
#saveInd{cursor:pointer; background:#eef7f1; border:1px solid #cfe8db; color:#0f5132; border-radius:10px; padding:4px 10px; font-size:11.5px; line-height:1.3; white-space:nowrap;}
#hdrMenu{display:none; position:absolute; inset-inline-end:0; top:calc(100% + 10px); background:#fff; border:1px solid var(--line);
  border-radius:16px; box-shadow:0 24px 60px rgba(15,23,42,.32); min-width:255px; padding:7px; z-index:500; animation:sheetUp .16s ease both;}
#hdrMenu.show{display:block;}
#hdrMenu .mi{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:11px; cursor:pointer; font-size:13.5px; font-weight:700; color:var(--ink); white-space:nowrap;}
#hdrMenu .mi:hover{background:var(--soft);}
#hdrMenu .sep{height:1px; background:var(--line); margin:5px 8px;}
#hdrMenu .lbl{font-size:11px; color:var(--muted); padding:6px 12px 3px; font-weight:800;}
nav.tabs{display:flex; gap:5px; background:rgba(255,255,255,.72); backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%); padding:9px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; overflow-x:auto; box-shadow:0 2px 12px rgba(30,41,80,.05);}
nav.tabs button{border:none; background:transparent; padding:9px 16px; border-radius:10px; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap; font-family:inherit;}
nav.tabs button{transition:all .18s ease;}
nav.tabs button.active{background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; box-shadow:0 4px 14px rgba(79,70,229,.35); transform:translateY(-1px);}
nav.tabs button:hover:not(.active){background:var(--soft); color:var(--ink);}
main{padding:20px; max-width:1500px; margin:0 auto;}
.row{display:flex; gap:14px; flex-wrap:wrap;}
.card{background:rgba(255,255,255,.86); backdrop-filter:blur(14px) saturate(150%); -webkit-backdrop-filter:blur(14px) saturate(150%); border:1px solid rgba(255,255,255,.75); border-radius:20px; padding:17px; box-shadow:var(--sh); animation:fadeUp .3s ease both; transition:box-shadow .2s ease;}
.card{transition:transform .34s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease;}
.card:hover{box-shadow:var(--sh2);}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px;}
.kpi{border-radius:22px; padding:14px 16px; color:#fff; position:relative; overflow:hidden;
  box-shadow:0 6px 20px rgba(30,41,80,.16), inset 0 1px 0 rgba(255,255,255,.22);
  animation:kpiIn .5s cubic-bezier(.22,1.2,.36,1) both;
  transition:transform .34s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease;
  cursor:default; will-change:transform;}
.kpi:hover{transform:translateY(-6px) scale(1.03); box-shadow:0 16px 34px rgba(30,41,80,.26), inset 0 1px 0 rgba(255,255,255,.3);}
.kpi:active{transform:translateY(-2px) scale(.99); transition-duration:.12s;}
.kpis .kpi:nth-child(1){animation-delay:.02s}.kpis .kpi:nth-child(2){animation-delay:.07s}
.kpis .kpi:nth-child(3){animation-delay:.12s}.kpis .kpi:nth-child(4){animation-delay:.17s}
.kpis .kpi:nth-child(5){animation-delay:.22s}.kpis .kpi:nth-child(6){animation-delay:.27s}
@keyframes kpiIn{from{opacity:0; transform:translateY(18px) scale(.94);}to{opacity:1; transform:none;}}
.kpi::after{content:''; position:absolute; inset:0; background:radial-gradient(140px 70px at 90% -10px,rgba(255,255,255,.3),transparent 70%); pointer-events:none;}
.kpi .n{font-size:28px; font-weight:800; letter-spacing:-.5px; text-shadow:0 2px 8px rgba(0,0,0,.15);}
.kpi .t{font-size:12.5px; opacity:.92;}
.kpi.k1{background:linear-gradient(140deg,#4f46e5,#7c8cf8);}
.kpi.k2{background:linear-gradient(140deg,#059669,#34d399);}
.kpi.k3{background:linear-gradient(140deg,#d97706,#fbbf24);}
.kpi.k4{background:linear-gradient(140deg,#7c3aed,#c084fc);}
.kpi.k5{background:linear-gradient(140deg,#e11d48,#fb7185);}
.kpi.k6{background:linear-gradient(140deg,#475569,#94a3b8);}
h2.sec{font-size:16px; font-weight:800; margin:6px 0 12px;}
h3.sec{font-size:14px; font-weight:700; margin:4px 0 10px; color:var(--brand);}
table.tbl{width:100%; border-collapse:collapse; font-size:13px;}
table.tbl th{background:linear-gradient(180deg,#f4f7fd,#eaf0fa); padding:9px; text-align:right; font-weight:800; border-bottom:2px solid #dbe3f2; position:sticky; top:0; white-space:nowrap; color:#33415c;}
table.tbl td{padding:7px 9px; border-bottom:1px solid var(--line); text-align:right;}
table.tbl tbody tr{transition:background .12s ease;}
table.tbl tr:hover td{background:#f2f6ff;}
.scroll{overflow:auto; max-height:70vh; border:1px solid var(--line); border-radius:10px;}
.badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.07);}
.b-exc{background:linear-gradient(135deg,#e9d5ff,#c084fc); color:#4c1d95; border:1px solid #9333ea; box-shadow:0 2px 8px rgba(147,51,234,.32);}
.b-pot{background:linear-gradient(135deg,#fef3c7,#fcd34d); color:#7c2d12; border:1px solid #f59e0b;}
.b-ok{background:#d1fae5; color:#065f46;}
.b-warn{background:#ffedd5; color:#9a3412;}
.b-bad{background:#fee2e2; color:#991b1b;}
.b-miss{background:#e2e8f0; color:#334155;}
.grade-exc{color:#7e22ce; font-weight:800;}
.grade-ok{color:var(--ink);}
.grade-warn{color:var(--warn); font-weight:700;}
.grade-bad{color:var(--bad); font-weight:800;}
.grade-miss{color:#94a3b8;}
.grade-part{color:#475569; font-style:italic; border-bottom:2px dotted #94a3b8; cursor:help;}
.rep-part{opacity:.5; font-style:italic; font-weight:700;}
.rep-part sup{font-size:9px; opacity:.9;}
.partTag{background:#f1f5f9; border:1px dashed #cbd5e1; color:#475569; border-radius:99px; padding:1px 7px; font-size:10px; font-weight:700; white-space:nowrap;}
input[type=number], select, input[type=text], textarea{border:1.5px solid #d6deec; border-radius:9px; padding:6px 9px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink); transition:border-color .15s ease, box-shadow .15s ease;}
input[type=number]:hover, select:hover, input[type=text]:hover{border-color:#a9b8d4;}
input[type=number]{width:62px; text-align:center;}
input[type=number]:focus, select:focus, input[type=text]:focus, textarea:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(79,70,229,.16);}
input.cell-miss{background:#f1f5f9; border-style:dashed;}
input.g-red, .g-red{color:#dc2626 !important; font-weight:800;}
input.g-blue, .g-blue{color:#1d4ed8 !important; font-weight:800; font-style:italic;}
input.sim-cell{background:#fff7ed !important; border-color:#f59e0b !important; color:#b45309; font-weight:800; box-shadow:0 0 0 1px #f59e0b;}
#simBanner{display:none; background:linear-gradient(90deg,#fff7ed,#ffedd5); border-bottom:2px solid #f59e0b; padding:8px 18px; font-size:13px; align-items:center; gap:10px; flex-wrap:wrap; position:sticky; top:49px; z-index:49;}
body.sim-on #simBanner{display:flex;}
body.sim-on nav.tabs{border-bottom-color:#f59e0b;}
#simTabBtn{border:2px solid transparent;}
body.sim-on #simTabBtn{background:#f59e0b !important; color:#fff !important; border-color:#b45309;}
button.btn{border:none; border-radius:13px; padding:9px 16px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit;
  background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; box-shadow:0 3px 10px rgba(79,70,229,.28); transition:all .16s ease;}
button.btn{transition:transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease, filter .2s ease;}
button.btn:hover{transform:translateY(-2px) scale(1.02); box-shadow:0 6px 18px rgba(79,70,229,.4); filter:brightness(1.06);}
button.btn:active{transform:translateY(0) scale(.98);}
button.btn.sec{background:var(--soft); color:var(--ink); border:1px solid var(--line); box-shadow:none;}
button.btn.sec:hover{background:#e8edf9; box-shadow:0 3px 10px rgba(30,41,80,.1);}
button.btn.ok{background:linear-gradient(135deg,#059669,#10b981); box-shadow:0 3px 10px rgba(5,150,105,.3);}
button.btn.warn{background:linear-gradient(135deg,#d97706,#f59e0b); box-shadow:0 3px 10px rgba(217,119,6,.3);}
button.btn.bad{background:linear-gradient(135deg,#e11d48,#f43f5e); box-shadow:0 3px 10px rgba(225,29,72,.3);}
button.btn.sm{padding:5px 10px; font-size:12px; border-radius:8px;}
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px;}
.toolbar label{font-weight:600; color:var(--muted); font-size:13px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr;}}
@media(max-width:820px){.hide-sm{display:none;} header.app{padding:12px 16px;} #subBar{padding:7px 14px;} header.app h1{font-size:18px;} header.app .sub{display:none;}}
.alert-item{display:flex; gap:10px; align-items:center; padding:9px 13px; border-radius:11px; margin-bottom:7px; font-size:13px; transition:transform .12s ease;}
.alert-item:hover{transform:translateX(-3px);}
.al-bad{background:#fef2f2; border-right:4px solid var(--bad);}
.al-warn{background:#fffbeb; border-right:4px solid var(--warn);}
.al-info{background:#eff6ff; border-right:4px solid #3b82f6;}
.al-pot{background:#f5f3ff; border-right:4px solid var(--brand2);}
.al-miss{background:#f8fafc; border-right:4px solid #94a3b8;}
.chartbox{position:relative; height:280px;}
.subj-card{border:1px solid var(--line); border-radius:13px; margin-bottom:11px; overflow:hidden; box-shadow:0 2px 10px rgba(30,41,80,.05);}
.subj-head{background:linear-gradient(135deg,#f1f4fb,#e9eefb); padding:11px 14px; font-weight:800; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
.subj-head:hover{background:linear-gradient(135deg,#e9eefb,#e0e8fa);}
.subj-body{padding:12px 14px; display:none;}
.subj-card.open .subj-body{display:block;}
.pill{background:#fff; border:1px solid var(--line); border-radius:999px; padding:2.5px 10px; font-size:11.5px; color:var(--muted); box-shadow:0 1px 2px rgba(30,41,80,.04);}
.note{font-size:12px; color:var(--muted); margin-top:6px;}
.delta-up{color:var(--ok); font-weight:800;}
.delta-dn{color:var(--bad); font-weight:800;}
.name-link{color:var(--brand); font-weight:700; cursor:pointer; text-decoration:none;}

#ndModal .box{background:#fff; border-radius:22px; max-width:520px; width:100%; padding:20px; box-shadow:0 24px 60px rgba(15,23,42,.4); animation:sheetUp .22s cubic-bezier(.2,.9,.3,1.1) both;}
.noteBtn{background:transparent; border:1px solid var(--line); border-radius:8px; padding:2px 6px; cursor:pointer; color:#94a3b8; position:relative; line-height:1;}
.noteBtn:hover{background:var(--soft); color:var(--brand); border-color:var(--brand);}
.noteBtn.has{background:#fffbeb; border-color:#f59e0b; color:#b45309;}
.noteBtn .dot{position:absolute; top:-3px; inset-inline-end:-3px; width:7px; height:7px; border-radius:50%; background:#f59e0b; border:1.5px solid #fff;}
td.hasNote{position:relative;}
td.hasNote::before{content:''; position:absolute; top:0; inset-inline-end:0; border-width:0 9px 9px 0; border-style:solid; border-color:transparent #f59e0b transparent transparent;}
#tdModal{position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:215; display:none; align-items:flex-start; justify-content:center; padding:30px 15px; overflow:auto;}

#giModal{position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:210; display:none; align-items:flex-start; justify-content:center; padding:30px 15px; overflow:auto;}

/* טבלאות ציונים — הכול ממורכז חוץ מעמודת השם */

<script>
"use strict";
/* ============ מודל המקצועות ============ */
const I=(n,w)=>({n,t:'i',w});
const E=(n,w,s)=>({n,t:'e',w,s}); // s = אחוז מגן
const B=()=>({n:'עבודה נוספת / הערכה חלופית',t:'i',w:0,b:1}); // רכיב שיפור ציון — מופעל ע"י מתן משקל; האחוזים מתחלקים יחסית
const MUGBAR_COMPS=u=>[I('הערכה פנימית',30),E('בחינה חיצונית א׳',70,30),E('בחינה חיצונית ב׳',0,30),E('בחינה חיצונית ג׳',0,30),B()];
const SUBJECTS=[
 {id:'lashon',   name:'לשון',          opts:[2], comps:u=>[I('הערכה פנימית',30),E('בחינה חיצונית',70,50),B()]},
 {id:'history',  name:'היסטוריה',      opts:[2], comps:u=>[I('הערכה חלופית',30),E('בגרות חיצונית',35,0),E('משימות מבוקרות',35,0),B()]},
 {id:'sifrut',   name:'ספרות',         opts:[1], comps:u=>[I('הערכה פנימית',30),E('בחינה חיצונית',70,30),B()]},
 {id:'machshevet',name:'מחשבת ישראל',  opts:[1], comps:u=>[I('הערכה חלופית',30),E('בגרות חיצונית',50,0),E('משימה מבוקרת',20,0),B()]},
 {id:'ezrachut', name:'אזרחות',        opts:[2], comps:u=>[I('הערכה חלופית',30),E('בגרות חיצונית',70,0),B()]},
 {id:'english',  name:'אנגלית',        opts:[4,5], comps:u=>[I('הערכה פנימית',26),E('שאלון א׳',27,30),E('שאלון ב׳',27,60),E('בחינה בע"פ',20,30),B()]},
 {id:'math',     name:'מתמטיקה',       opts:[3,4,5], comps:u=> u===3?[I('הערכה פנימית',25),E('שאלון ראשון',35,50),E('שאלון שני',40,60),B()]
                                                     : u===4?[I('הערכה פנימית',0),E('שאלון ראשון',65,50),E('שאלון שני',35,60),B()]
                                                            :[I('הערכה פנימית',0),E('שאלון ראשון',60,50),E('שאלון שני',40,60),B()]},
 {id:'tanakh',   name:'תנ"ך',          opts:[3,5], comps:u=> u===5?[I('הערכה חלופית',20),E('בגרות חיצונית',20,0),E('משימות מבוקרות',20,0),I('הערכה חלופית הגבר',16),E('מבחן הגבר',24,0),B()]
                                                            :[I('הערכה חלופית',30),E('בגרות חיצונית',35,0),E('משימות מבוקרות',35,0),I('הערכה חלופית הגבר',0),E('מבחן הגבר',0,0),B()]},
 {id:'toshba',   name:'תושב"ע',        opts:[3,5], comps:u=> u===5?[I('הערכה פנימית',18),E('בחינה חיצונית א׳',21,0),E('בחינה חיצונית ב׳',21,0),E('בחינת הגבר',28,0),I('הערכה פנימית הגבר',12),B()]
                                                            :[I('הערכה פנימית',30),E('בחינה חיצונית א׳',35,0),E('בחינה חיצונית ב׳',35,0),E('בחינת הגבר',0,0),I('הערכה פנימית הגבר',0),B()]},
 {id:'mugbar1',  name:'מקצוע מוגבר',   opts:[0,5], named:true, comps:MUGBAR_COMPS},
 {id:'mugbar2',  name:'מוגבר/התמחות ב׳',opts:[0,3,5], named:true, comps:MUGBAR_COMPS},
 {id:'mugbar3',  name:'מוגבר/התמחות ג׳',opts:[0,3,5], named:true, comps:MUGBAR_COMPS},
 {id:'hng',      name:'חנ"ג',           opts:[0,1], internalOnly:true, comps:u=>[I('ציון סופי',100)]},
 {id:'mada',     name:'מבוא למדעים',    opts:[0,1], internalOnly:true, comps:u=>[I('ציון סופי',100)]},
 {id:'shelach',  name:'של"ח',           opts:[0,1], internalOnly:true, comps:u=>[I('ציון סופי',100)]},
 {id:'taavura',  name:'חינוך תעבורתי',  opts:[0,1], internalOnly:true, comps:u=>[I('ציון סופי',100)]},
];
const SUBJ_MAP=Object.fromEntries(SUBJECTS.map(s=>[s.id,s]));

/* ============ צבעי ציונים: שחור=דווח למשרד · אדום=אמיתי לא דווח · כחול=פיקטיבי/סימולציה ============ */
const GSTAT={r:{lbl:'ציון אמיתי — טרם דווח למשרד',cls:'g-red',ic:'🔴'},b:{lbl:'ציון פיקטיבי / הערכה',cls:'g-blue',ic:'🔵'}};
function gstatOf(st,key){ return (st.gstat||{})[key]||''; }
function gstatCls(st,key){ const s=gstatOf(st,key); return s?' '+GSTAT[s].cls:''; }
function cycleGstat(id,key){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.gstat=st.gstat||{};
  const cur=st.gstat[key]||'';
  const nxt=cur===''?'r':(cur==='r'?'b':'');
  if(nxt) st.gstat[key]=nxt; else delete st.gstat[key];
  save();
  const modal=document.getElementById('studentModal');
  if(modal&&modal.classList.contains('show')) refreshOpenViews(id);
  else renderKeepScroll();
}
function statusLegend(){
  return `<div class="note" style="display:flex; gap:14px; flex-wrap:wrap; align-items:center;">
    <b>סימון ציונים:</b>
    <span><span style="color:#111; font-weight:800;">■</span> שחור — דווח למשרד</span>
    <span><span style="color:#dc2626; font-weight:800;">■</span> אדום — אמיתי, טרם דווח</span>
    <span><span style="color:#1d4ed8; font-weight:800;">■</span> כחול — פיקטיבי / הערכה</span>
    <span class="pill">💡 לחיצה ימנית על ציון מחליפה סימון</span>
    ${state.flipFav?'<span class="pill" style="background:#fffbeb; border-color:#fcd34d;">🔀 היפוך אחוזים לטובת הבחינה — פעיל</span>':''}
  </div>`;
}
// קריאת צבעי הגופן מתוך ה-XML של קובץ האקסל
function sheetFontColors(wb,sheetName){
  try{
    const files=wb.files; if(!files) return null;
    const get=n=>{ const e=files[n]; if(!e) return null;
      if(typeof e==='string') return e;
      if(e.content!==undefined) return typeof e.content==='string'?e.content:new TextDecoder('utf-8').decode(new Uint8Array(e.content));
      return new TextDecoder('utf-8').decode(new Uint8Array(e)); };
    const styles=get('xl/styles.xml'); if(!styles) return null;
    const fontsBlock=(styles.match(/<fonts[\s\S]*?<\/fonts>/)||[''])[0];
    const fonts=fontsBlock.match(/<font>[\s\S]*?<\/font>|<font\/>/g)||[];
    const fcol=fonts.map(fo=>{ const m=fo.match(/<color([^\/>]*)\/?>/); if(!m) return null;
      const a=m[1];
      const rgb=a.match(/rgb="([0-9A-Fa-f]{6,8})"/); if(rgb) return rgb[1].slice(-6).toUpperCase();
      return null; });
    const xfsBlock=(styles.match(/<cellXfs[\s\S]*?<\/cellXfs>/)||[''])[0];
    const xfs=xfsBlock.match(/<xf [^>]*?\/?>/g)||[];
    const s2c=xfs.map(x=>{ const m=x.match(/fontId="(\d+)"/); return m?fcol[+m[1]]:null; });
    const wbxml=get('xl/workbook.xml'); if(!wbxml) return null;
    const names=[]; const rn=/<sheet[^>]*name="([^"]*)"/g; let mm;
    while((mm=rn.exec(wbxml))) names.push(mm[1]);
    const idx=names.indexOf(sheetName); if(idx<0) return null;
    const sheet=get('xl/worksheets/sheet'+(idx+1)+'.xml'); if(!sheet) return null;
    const out={};
    const re=/<c r="([A-Z]+\d+)"([^>]*)>/g; let m2;
    while((m2=re.exec(sheet))){
      const sm=m2[2].match(/ s="(\d+)"/); if(!sm) continue;
      const c=s2c[+sm[1]]; if(c) out[m2[1]]=c;
    }
    return out;
  }catch(e){ return null; }
}
function classifyColor(hex){
  if(!hex) return '';
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  if(r>120&&r>g*2&&r>b*2) return 'r';           // אדום
  if(b>110&&b>r+40&&b>g+10) return 'b';          // כחול
  return '';                                      // שחור/ברירת מחדל
}

function gradesOf(st,sim){
  if(sim&&st.simg&&Object.keys(st.simg).length) return Object.assign({},st.grades||{},st.simg);
  return st.grades||{};
}
function isSimKey(st,key){ return !!(st.simg&&st.simg[key]!==undefined); }
function simCount(){ return state.students.reduce((a,s)=>a+(s.simg?Object.keys(s.simg).length:0),0); }
function setGradeSim(id,key,val){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.simg=st.simg||{};
  if(val===''||val===null){ delete st.simg[key]; }
  else{
    const v=Math.max(0,Math.min(100,+val));
    if((st.grades||{})[key]===v) delete st.simg[key]; // חזרה לערך האמיתי = ביטול השינוי
    else st.simg[key]=v;
  }
  save(); renderKeepScroll();
}
function clearSim(){
  const n=simCount();
  if(!n){ toast('אין שינויי ניסוי'); return; }
  if(!confirm('למחוק את '+n+' שינויי הניסוי ולחזור לציונים האמיתיים?')) return;
  pushUndo('מחיקת שינויי ניסוי');
  state.students.forEach(s=>{ delete s.simg; });
  save(); render(); toast('שינויי הניסוי נמחקו — חזרנו לציונים האמיתיים');
}
function commitSim(){
  const n=simCount();
  if(!n){ toast('אין שינויים בתרחיש'); return; }
  if(!confirm('להעביר '+n+' ציונים מהניסוי אל טבלת הציונים האמיתית?')) return;
  pushUndo('העברת ניסוי לטבלה');
  state.students.forEach(s=>{
    if(!s.simg) return;
    s.grades=s.grades||{};
    Object.keys(s.simg).forEach(k=>{ s.grades[k]=s.simg[k]; });
    delete s.simg;
  });
  save(); render(); toast(n+' ציונים הועברו לטבלה האמיתית');
}

    if(!confirm(`פתיחת קובץ הנתונים "${hn.name}"\n\nסימולטורים: ${(d.profiles||[]).map(p=>p.name||'(ללא שם)').join(', ')}\nתלמידות: ${tot}\n\n⚠️ הנתונים הפתוחים כרגע יוחלפו בתוכן הקובץ. להמשיך?`)) return;
    applyBackupObject(d);
    fileHandle=hn; fileName=hn.name; fileState='on';
    await idbSet('handle',hn);
    renderProfileBar(); renderLogo(); renderFileBar(); setTab('dash');
    toast('הקובץ נפתח — '+tot+' תלמידות · שמירה אוטומטית פעילה');
  }catch(e){ if(e.name!=='AbortError') toast('שגיאה: '+e.message); }
}
async function fileDisconnect(){
  if(!confirm('לנתק את השמירה האוטומטית לקובץ?\nהנתונים יישארו בדפדפן ובקובץ, אבל שינויים חדשים לא ייכתבו לקובץ.')) return;
  fileHandle=null; fileName=''; fileState='off'; await idbDel('handle');
  renderFileBar(); render();
}
async function fileWrite(force){
  if(!fileHandle||fileState!=='on') return;
  try{
    const w=await fileHandle.createWritable();
    await w.write(JSON.stringify(fullBackupObject()));
    await w.close();
    lastFileSave=new Date();
    try{ localStorage.setItem('bagrutLastBackup',JSON.stringify({at:lastFileSave.toISOString(),n:countAllStudents(),file:fileName})); }catch(e){}
    renderFileBar();
  }catch(e){
    fileState='need-permission'; renderFileBar();
  }
}
let lastFileSave=null;
function scheduleFileSave(){
  if(!fileHandle) return;
  clearTimeout(fileSaveTimer);
  fileSaveTimer=setTimeout(()=>fileWrite(),700);
}
async function fileReconnect(){
  if(!fileHandle) return;
  try{
    const perm=await fileHandle.requestPermission({mode:'readwrite'});
    if(perm==='granted'){ fileState='on'; await fileWrite(true); renderFileBar(); render(); toast('החיבור לקובץ חודש — שמירה אוטומטית פעילה'); }
    else toast('ההרשאה נדחתה');
  }catch(e){ toast('שגיאה: '+e.message); }
}
function renderFileBar(){
  const el=document.getElementById('fileBar'); if(!el) return;

    el.innerHTML=`<span class="pill" title="שמירה אוטומטית לקובץ: ${esc(fileName)}" style="background:#eef7f1; border-color:#cfe8db; color:#0f5132; font-weight:700; max-width:230px; overflow:hidden; text-overflow:ellipsis;">${ic('save',13)} ${esc(fileName)}${t?' · '+t:''}</span>`;

async function fileInit(){
  if(!FS_OK){ fileState='unsupported'; renderFileBar(); return; }
  const hn=await idbGet('handle');

function dupGroups(){
  const byKey={}, byName={};
  state.students.forEach(s=>{

  return {sameClass,crossClass};
}

let undoStack=[];
function pushUndo(label){
  try{ undoStack.push({label,at:Date.now(),snap:JSON.stringify(state)}); if(undoStack.length>12) undoStack.shift(); }catch(e){}

}
function doUndo(){
  const u=undoStack.pop();
  if(!u){ toast('אין פעולה לביטול'); return; }
  if(!confirm(`לבטל את הפעולה "${u.label}"?\nהמצב יחזור לרגע שלפניה.`)){ undoStack.push(u); return; }
  try{ state=Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)),JSON.parse(u.snap)); }catch(e){ toast('שגיאה בביטול'); return; }
  save(); render(); toast('✅ בוטל: '+u.label);
}
function renderUndo(){

    ↩️ בטל: ${esc(u.label)}${undoStack.length>1?` <span class="pill" style="padding:0 6px;">${undoStack.length}</span>`:''}</button>`;
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName||'')){

});

/* ============ מבחני כיתה (לחיזוי בלבד — לא חלק מהציון הרשמי) ============ */
// כל בדיקה: {n:שם, g:ציון, w:משקל יחסי}. תומך גם בפורמט הישן (מספר / מערך מספרים)
function normTests(t){
  if(t===undefined||t===null) return [];
  if(typeof t==='number') return [{n:'מבחן',g:t,w:1}];
  if(!Array.isArray(t)) return [];
  return t.map(x=>typeof x==='number'?{n:'מבחן',g:x,w:1}:{n:(x.n||'מבחן'),g:+x.g,w:(+x.w||1)}).filter(x=>!isNaN(x.g));
}
function testsOf(st,sid){ return normTests((st.tests||{})[sid]); }
function testAvg(st,sid){
  const a=testsOf(st,sid); if(!a.length) return null;
  const W=a.reduce((s,x)=>s+x.w,0)||1;
  return Math.round(a.reduce((s,x)=>s+x.g*x.w,0)/W*10)/10;
}
function saveTests(st,sid,arr){
  st.tests=st.tests||{};
  if(!arr||!arr.length) delete st.tests[sid]; else st.tests[sid]=arr;
}
/* ===== חלון ניהול בדיקות לתלמידה ===== */

function setTest(id,sid,val){

// כיול אוטומטי: הפער הממוצע בין בחינה למגן במקצוע, מתוך הנתונים שכבר קיימים
function autoGap(sid){
  let sum=0,n=0;
  state.students.forEach(st=>{
    const g=st.grades||{};
    Object.keys(g).forEach(k=>{
      if(!k.startsWith(sid+'.')||!k.endsWith('.m')) return;
      const e=g[k.slice(0,-2)+'.e'];
      if(typeof e!=='number'||typeof g[k]!=='number') return;
      if(g[k]===0&&e===0) return;
      sum+=e-g[k]; n++;
    });
  });
  return n>=5?Math.round(sum/n*10)/10:null;
}
function predOffset(sid){
  const lv=state.predLevel;
  if(lv==='auto'){ const a=autoGap(sid); return a===null?0:a; }
  return +lv||0;
}

/* ============ מנוע חישוב ============ */
function getUnits(st,subj){
  if(subj.opts.length===1) return subj.opts[0];
  const u=(st.units||{})[subj.id];
  return (u===0||u)?u:subj.opts[subj.opts.length-1];
}
function getComps(subj,u){
  const base=subj.comps(u);
  return base.map((c,i)=>{
    const ov=state.custom[subj.id+'.'+u+'.'+i];
    return ov?Object.assign({},c,ov):c;
  });
}
// רכיבים אפקטיביים לתלמידה ספציפית: ברירת מחדל ← הגדרות גלובליות ← התאמה אישית לתלמידה
function getCompsFor(st,subj,u){
  const base=getComps(subj,u);
  const stOv=st.ov||{};
  return base.map((c,i)=>{
    const po=stOv[subj.id+'.'+i];
    if(!po) return c;
    const merged=Object.assign({},c);
    if(po.w!==undefined&&po.w!==null&&po.w!=='') merged.w=+po.w;
    if(po.s!==undefined&&po.s!==null&&po.s!=='') merged.s=+po.s;
    merged._custom=true;
    return merged;
  });
}
function hasOverrides(st,subj){
  const stOv=st.ov||{};
  return Object.keys(stOv).some(k=>k.startsWith(subj.id+'.')&&stOv[k]&&Object.keys(stOv[k]).length);
}
function num(v){ if(v===''||v===null||v===undefined) return null; const n=+v; return isNaN(n)?null:n; }
// opts: {split: אחוז מגן גלובלי או null, predict:bool, bonus:number}
function calcSubject(st,subj,opts){
  opts=opts||{};
  const u=getUnits(st,subj);
  if(u===0) return {active:false,u:0};
  const comps=getCompsFor(st,subj,u);
  const g=gradesOf(st,opts.sim);
  let sum=0, missing=0, gaps=[], flips=[], predictedUsed=false;
  const details=[];
  comps.forEach((c,i)=>{
    if(!c.w){details.push(null); return;}
    const key=subj.id+'.'+i;
    let val=null;
    const skipBlue=k=>(state.countBlue===false&&gstatOf(st,k)==='b');   // כחול = פיקטיבי
    if(c.t==='i'){
      val=skipBlue(key)?null:num(g[key]);
      if(val===null) missing++;
    }else{
      let m=skipBlue(key+'.m')?null:num(g[key+'.m']), e=skipBlue(key+'.e')?null:num(g[key+'.e']);
      if(opts.predict && e===null){
        const tv=testAvg(st,subj.id);
        if(tv!==null){ e=tv; predictedUsed=true; }                       // ציון מבחן כיתתי — האינדיקטור הטוב ביותר
        else if(m!==null){ e=Math.max(0,Math.min(100,m+predOffset(subj.id))); predictedUsed=true; }
      }
      if(opts.bonus && e!==null){ e=Math.min(100,e+opts.bonus); }
      let s=(opts.split!==null&&opts.split!==undefined)?opts.split:c.s;
      // חוק ההיפוך: כשציון הבחינה גבוה מהמגן — המשקל הגדול עובר לבחינה
      let flipped=false;
      if(state.flipFav && s>0 && s<100 && m!==null && e!==null && e>m){
        const lo=Math.min(s,100-s);
        if(lo!==s){ s=lo; flipped=true; }
      }
      const needM=s>0, needE=s<100;
      if((needM&&m===null)||(needE&&e===null)){ missing++; }
      else{
        // ציון הרכיב (מגן+בחינה) מעוגל לשלם לפי הכלל — 85.5 ← 86
        val=Math.round((needM?m*s/100:0)+(needE?e*(100-s)/100:0));
        if(flipped) flips.push({comp:c.n,m,e,s});
        if(needM&&needE&&m-e>=state.thresholds.gap) gaps.push({comp:c.n,m,e});
      }
    }
    if(val!==null) sum+=val*c.w/100;
    details.push({comp:c,val:val===null?null:Math.round(val*10)/10});
  });
  const wSum=comps.reduce((a,c)=>a+(+c.w||0),0);
  // ציון חלקי — לפי הרכיבים שכבר הוזנו בלבד (לתצוגה בלבד, לא נכנס לזכאות ולממוצע)
  let wDone=0;
  comps.forEach((c,i)=>{ if(!c.w) return; const d=details[i]; if(d&&d.val!==null&&d.val!==undefined) wDone+=(+c.w||0); });
  const partial=(wDone>0)?Math.round(sum/wDone*100):null;
  const covered=wSum>0?Math.round(wDone/wSum*100):0;
  // נרמול: אם סך המשקלים שונה מ-100 (למשל אחרי הוספת עבודה נוספת) — האחוזים מתחלקים יחסית
  // ציון סופי מעוגל לשלם: 85.5 ← 86 · 85.4 ← 85
  const raw=(missing>0||wSum<=0)?null:sum/wSum*100;
  const final=raw===null?null:Math.round(raw);
  return {active:true,u,final,partial,covered,raw:raw===null?null:Math.round(raw*100)/100,missing,gaps,flips,details,predictedUsed,wSum,
          internalOnly:!!subj.internalOnly,
          blocker: final!==null&&final<state.thresholds.pass,
          borderline: final!==null&&final>=state.thresholds.pass&&final<60};
}
function calcStudent(st,opts){
  const per={}; let wsum=0, usum=0, blockers=[], missing=[], borderlines=[], gaps=[], flipList=[], anyFinal=false, predicted=false, predIn=[];
  SUBJECTS.forEach(subj=>{
    const r=calcSubject(st,subj,opts);
    per[subj.id]=r;
    if(!r.active) return;
    if(subj.internalOnly&&!state.includeInternal) return; // מקצוע פנימי — לא נכלל בממוצע ובזכאות
    if(r.final!==null){ wsum+=r.final*r.u; usum+=r.u; anyFinal=true; }
    if(r.missing>0) missing.push(subj);
    if(r.blocker) blockers.push(subj);
    if(r.borderline) borderlines.push(subj);
    if(r.gaps.length) gaps.push({subj,gaps:r.gaps});
    if(r.flips&&r.flips.length) flipList.push({subj,flips:r.flips});
    if(r.predictedUsed){ predicted=true; predIn.push(subj.name); }
  });
  const avg=usum>0?Math.round(wsum/usum*10)/10:null;
  const totalUnits=SUBJECTS.reduce((a,s)=>{const r=per[s.id]; if(!r.active)return a; if(s.internalOnly&&!state.includeInternal)return a; return a+r.u;},0);
  const complete=missing.length===0;
  const eligible=complete&&blockers.length===0&&anyFinal;
  // תנאי יח"ל להצטיינות: מתמטיקה 4-5 יח"ל + אנגלית 5 יח"ל
  const uMath=per.math&&per.math.active?per.math.u:0;
  const uEng=per.english&&per.english.active?per.english.u:0;
  const unitsOk=!state.reqUnits||(uMath>=4&&uEng>=5);
  let status, cls;
  const T=state.thresholds;
  if(!anyFinal){ status='אין נתונים'; cls='b-miss'; }
  else if(blockers.length>0){ status='מעכבים: '+blockers.length; cls='b-bad'; }
  else if(!complete){ status='חסר נתונים'; cls='b-miss'; }
  else if(avg>T.excel&&unitsOk){ status='מצטיינת ⭐'; cls='b-exc'; }
  else if(avg>=T.potential&&avg<=T.excel&&unitsOk){ status='פוטנציאל הצטיינות'; cls='b-pot'; }
  else{ status='זכאית'; cls='b-ok'; }
  return {per,avg,totalUnits,blockers,missing,borderlines,gaps,flipList,eligible,complete,status,cls,predicted,predIn,unitsOk,
          excellent: eligible&&avg>T.excel&&unitsOk,
          potential: complete&&blockers.length===0&&avg>=T.potential&&avg<=T.excel&&unitsOk};
}
function studentAlerts(st,r){
  const A=[];
  r.blockers.forEach(s=>A.push({sev:'bad',text:`${st.name}: ציון מעכב ב${s.name} (${r.per[s.id].final})`}));
  r.borderlines.forEach(s=>A.push({sev:'warn',text:`${st.name}: ציון גבולי ב${s.name} (${r.per[s.id].final}) — מומלץ תגבור`}));
  r.gaps.forEach(g=>g.gaps.forEach(x=>A.push({sev:'warn',text:`${st.name}: פער חריג ב${g.subj.name} · ${x.comp} — מגן ${x.m} מול בחינה ${x.e}`})));
  if(r.complete&&r.blockers.length===0&&r.avg>=88&&r.avg<=state.thresholds.excel&&r.unitsOk)
    A.push({sev:'pot',text:`${st.name}: ממוצע ${r.avg} — קרובה מאוד להצטיינות! נדרש ממוצע מעל ${state.thresholds.excel} (חסרות ${(state.thresholds.excel-r.avg+0.1).toFixed(1)} נק׳)`});
  else if(r.potential) A.push({sev:'pot',text:`${st.name}: פוטנציאל הצטיינות (ממוצע ${r.avg})`});
  if(r.complete&&r.blockers.length===0&&r.avg>=state.thresholds.potential&&!r.unitsOk)
    A.push({sev:'pot',text:`${st.name}: ממוצע ${r.avg} אך אינה עומדת בתנאי היח"ל להצטיינות (נדרש: מתמטיקה 4-5 יח"ל + אנגלית 5 יח"ל)`});
  if(r.missing.length>0&&r.missing.length<=3) A.push({sev:'miss',text:`${st.name}: חסרים ציונים ב: ${r.missing.map(s=>s.name).join(', ')}`});
  else if(r.missing.length>3) A.push({sev:'miss',text:`${st.name}: חסרים ציונים ב-${r.missing.length} מקצועות`});
  return A;
}
function gradeClass(v){
  if(v===null||v===undefined) return 'grade-miss';
  if(v<state.thresholds.pass) return 'grade-bad';
  if(v<60) return 'grade-warn';
  if(v>state.thresholds.excel) return 'grade-exc';
  return 'grade-ok';
}
// תצוגת ציון: סופי, או חלקי מסומן כשעדיין חסרים רכיבים
function scoreCell(r){
  if(!r||!r.active) return '<span style="color:#cbd5e1;">—</span>';
  if(r.final!==null) return `<span class="${gradeClass(r.final)}">${r.final}</span>`;
  if(r.partial!==null) return `<span class="grade-part" title="ציון חלקי — מבוסס על ${r.covered}% מהמשקל בלבד. הציון הסופי יחושב כשכל הרכיבים יוזנו.">${r.partial}</span> <span class="partTag">חלקי ${r.covered}%</span>`;
  return '<span class="grade-miss">—</span>';
}
// תצוגת ציון בדוח — חלקי מוצג שקוף ונטוי עם כוכבית (עובד גם בהדפסה בשחור-לבן)
function subjNote(st,sid){
  const ns=st.notes||{};
  const parts=[];
  if((ns[sid]||'').trim()) parts.push(ns[sid].trim());
  Object.keys(ns).forEach(k=>{
    if(k===sid||k.indexOf(sid+'.')!==0) return;
    const t=(ns[k]||'').trim(); if(!t) return;
    const subj=SUBJ_MAP[sid], idx=+k.split('.')[1];
    let lbl='';
    if(subj){ const cs=subj.comps(getUnits(st,subj)||subj.opts[subj.opts.length-1]); if(cs[idx]) lbl=cs[idx].n+': '; }
    parts.push(lbl+t);
  });
  return parts.join(' · ');
}
function scoreCellReport(r){
  if(!r||!r.active) return '<span style="color:#cbd5e1;">—</span>';
  if(r.final!==null) return `<span class="${gradeClass(r.final)}">${r.final}</span>`;
  if(r.partial!==null) return `<span class="rep-part" title="ציון חלקי — ${r.covered}% מהמשקל">${r.partial}<sup>*</sup></span>`;

}

let lockHash='', recCode='';
try{ lockHash=localStorage.getItem('bagrutLock')||''; recCode=localStorage.getItem('bagrutRec')||''; }catch(e){}
function makeRecCode(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // בלי תווים מבלבלים
  let s=''; for(let g=0;g<4;g++){ for(let i=0;i<4;i++) s+=A[Math.floor(Math.random()*A.length)]; if(g<3) s+='-'; }
  return s;
}
function downloadRecovery(code){

async function sha256(s){
  const b=new TextEncoder().encode('bagrut::'+s);
  const d=await crypto.subtle.digest('SHA-256',b);
  return Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

function showLock(){

function animateCounters(){
  document.querySelectorAll('.kpi .n[data-to]').forEach(el=>{
    const to=parseFloat(el.getAttribute('data-to')); if(isNaN(to)) return;
    const dec=(el.getAttribute('data-dec')==='1'), suf=el.getAttribute('data-suf')||'';
    const dur=650, t0=performance.now();
    const step=now=>{
      const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
      const v=to*e;
      el.textContent=(dec?(Math.round(v*10)/10).toFixed(1):Math.round(v))+suf;
      if(k<1) requestAnimationFrame(step);
    };
    el.textContent=dec?'0.0':'0'; requestAnimationFrame(step);
  });
}

}

        stroke-dasharray="${circ}" stroke-dashoffset="${off}" style="--circ:${circ}; animation:ringIn 1s cubic-bezier(.2,.9,.3,1) both;"/>
    </svg>
    <div class="rv"><div class="rn" style="color:${color};">${Math.round(pct)}%</div><div class="rl">${esc(label)}</div>${sub?`<div class="rl" style="opacity:.75;">${esc(sub)}</div>`:''}</div>

    </div>`).join(''):'<div class="it" style="color:var(--muted);">לא נמצאו תוצאות</div>';
}
function cmdKey(e){
  if(e.key==='Escape'){ closeCmd(); return; }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    cmdSel=Math.max(0,Math.min(cmdItems.length-1,cmdSel+(e.key==='ArrowDown'?1:-1)));
    const els=document.querySelectorAll('#cmdRes .it');
    els.forEach((el,i)=>el.classList.toggle('sel',i===cmdSel));
    if(els[cmdSel]) els[cmdSel].scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key==='Enter'){ e.preventDefault(); cmdGo(cmdSel); }
}
function cmdGo(i){
  const x=cmdItems[i]; if(!x) return;
  closeCmd();
  if(x.t==='tab') setTab(x.id);
  else if(x.t==='stu') openStudent(x.id);
  else if(x.t==='subj'){ entrySubj=x.id; setTab('entry'); }

function avgOf(arr){ return arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*10)/10:null; }
function topTable(results){
  const rows=results.filter(x=>x.r.avg!==null).sort((a,b)=>b.r.avg-a.r.avg).slice(0,15);
  if(!rows.length) return '<div class="note">אין עדיין ציונים</div>';
  return `<table class="tbl grades"><thead><tr><th>#</th><th>שם</th><th>כיתה</th><th>ממוצע משוקלל</th><th>יח"ל</th><th>סטטוס</th></tr></thead><tbody>
  ${rows.map((x,i)=>`<tr><td>${i+1}</td><td><span class="name-link" onclick="openStudent('${x.st.id}')">${esc(x.st.name)}</span></td><td>${esc(x.st.cls)}</td>
   <td class="${gradeClass(x.r.avg)}">${x.r.avg}</td><td>${x.r.totalUnits}</td><td class="status-cell"><span class="badge ${x.r.cls}">${x.r.status}</span></td></tr>`).join('')}
  </tbody></table>`;
}
const PALETTE=['#9333ea','#f59e0b','#10b981','#f43f5e','#94a3b8','#64748b'];
function drawDashCharts(results,cls){
  const order=['מצטיינת','פוטנציאל','זכאית','מעכבים','חסר נתונים'];
  const cnt=[results.filter(x=>x.r.excellent).length, results.filter(x=>x.r.potential).length,
    results.filter(x=>x.r.eligible&&!x.r.excellent&&!x.r.potential).length,
    results.filter(x=>x.r.blockers.length>0).length,
    results.filter(x=>x.r.blockers.length===0&&!x.r.complete).length];
  charts.st=new Chart(document.getElementById('chStatus'),{type:'doughnut',
    data:{labels:order,datasets:[{data:cnt,backgroundColor:PALETTE}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'left',rtl:true,labels:{font:{family:'Segoe UI'}}}}}});
  const classes=state.classes;
  const cavg=classes.map(c=>{const rs=state.students.filter(s=>s.cls===c).map(s=>calcStudent(s).avg).filter(v=>v!==null); return avgOf(rs);});
  const celig=classes.map(c=>{const ss=state.students.filter(s=>s.cls===c); if(!ss.length)return 0; return Math.round(ss.filter(s=>calcStudent(s).eligible).length/ss.length*100);});
  charts.cl=new Chart(document.getElementById('chClass'),{type:'bar',
    data:{labels:classes,datasets:[{label:'ממוצע משוקלל',data:cavg,backgroundColor:'#6366f1',borderRadius:6},{label:'% זכאות',data:celig,backgroundColor:'#10b981',borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:100}},plugins:{legend:{rtl:true}}}});
  const savg=SUBJECTS.map(sub=>{const vs=results.map(x=>x.r.per[sub.id]).filter(r=>r&&r.active&&r.final!==null).map(r=>r.final); return avgOf(vs);});
  charts.sj=new Chart(document.getElementById('chSubj'),{type:'bar',
    data:{labels:SUBJECTS.map(s=>s.name),datasets:[{label:'ממוצע',data:savg,backgroundColor:savg.map(v=>v===null?'#cbd5e1':v>=90?'#f59e0b':v>=75?'#6366f1':v>=55?'#f97316':'#ef4444'),borderRadius:6}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,scales:{x:{min:0,max:100}},plugins:{legend:{display:false}}}});
  const bins=[0,0,0,0,0,0]; const labels=['<55','55-64','65-74','75-84','85-89','90+'];
  results.forEach(x=>{const v=x.r.avg; if(v===null)return; if(v<55)bins[0]++;else if(v<65)bins[1]++;else if(v<75)bins[2]++;else if(v<85)bins[3]++;else if(v<90)bins[4]++;else bins[5]++;});
  charts.hi=new Chart(document.getElementById('chHist'),{type:'bar',
    data:{labels,datasets:[{label:'תלמידות',data:bins,backgroundColor:['#ef4444','#f97316','#eab308','#6366f1','#8b5cf6','#f59e0b'],borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
}

function addStudent(){
  const name=document.getElementById('newName').value.trim();
  const sel=document.getElementById('newCls');
  const cls=sel?sel.value:'';
  if(!name){toast('נא להזין שם');return;}
  if(!cls){toast('קודם צרי כיתה — בחלונית "ניהול כיתות" משמאל');return;}
  const ex=state.students.filter(s=>normName(s.name)===normName(name));
  if(ex.length&&!confirm(`⚠️ כבר קיימת תלמידה בשם "${name}"${ex.some(s=>s.cls===cls)?' באותה כיתה':' (בכיתה '+ex[0].cls+')'}.\n\nשמות כפולים עלולים לגרום לטעויות בייבוא ציונים.\nלהוסיף בכל זאת?`)) return;
  state.students.push({id:uid(),name,cls,units:{},mugbarNames:{},grades:{}});
  save(); render(); toast('נוספה: '+name);
}
function bulkAdd(){
  const sel=document.getElementById('newCls');
  const cls=sel?sel.value:'';
  if(!cls){toast('קודם צרי כיתה — בחלונית "ניהול כיתות" משמאל');return;}
  const names=document.getElementById('bulkNames').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!names.length){toast('לא הודבקו שמות');return;}
  const dups=names.filter(n=>state.students.some(s=>normName(s.name)===normName(n))||names.filter(x=>normName(x)===normName(n)).length>1);
  if(dups.length&&!confirm(`⚠️ ${[...new Set(dups)].length} שמות כפולים ברשימה או קיימים כבר:\n${[...new Set(dups)].slice(0,8).join(', ')}\n\nלהוסיף בכל זאת?`)) return;
  pushUndo('הוספת '+names.length+' תלמידות');
  names.forEach(name=>state.students.push({id:uid(),name,cls,units:{},mugbarNames:{},grades:{}}));
  save(); render(); toast(`נוספו ${names.length} תלמידות ל${cls}`);
}
function addClass(){
  const c=document.getElementById('newClsName').value.trim();
  if(!c||state.classes.includes(c)){toast('שם כיתה חסר או קיים');return;}
  state.classes.push(c);
  // אם לסימולטור עדיין אין שם — הכיתה הראשונה נותנת לו את שמה
  const pf=profiles.find(x=>x.id===currentProfileId);
  if(pf&&(pf.unnamed||!pf.name)){ pf.name=c; delete pf.unnamed; saveProfiles(); renderProfileBar(); }
  save(); render(); toast('נוצרה כיתה: '+c);
}
function delClass(c){
  const cnt=state.students.filter(s=>s.cls===c).length;
  if(!confirm(`למחוק את כיתה ${c}${cnt?` יחד עם ${cnt} תלמידותיה`:''}?`)) return;
  pushUndo('מחיקת כיתה — '+c);
  state.classes=state.classes.filter(x=>x!==c);
  state.students=state.students.filter(s=>s.cls!==c);
  save(); render();
}
function setStudentClass(id,val){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.cls=val; save();
  const modal=document.getElementById('studentModal');
  if(modal.classList.contains('show')) openStudent(id); else renderKeepScroll();
}
function delStudent(id){
  const st=state.students.find(s=>s.id===id);
  if(!confirm(`למחוק את ${st.name}?`)) return;
  pushUndo('מחיקת תלמידה — '+st.name);
  state.students=state.students.filter(s=>s.id!==id); save(); render();
}

function studentSubjEditor(st,subj){
  const u=getUnits(st,subj);
  const r=calcSubject(st,subj);
  const unitsSel=subj.opts.length>1?`<select onchange="setUnits('${st.id}','${subj.id}',this.value)">${subj.opts.map(o=>`<option value="${o}" ${o===u?'selected':''}>${o===0?'לא נלמד':o+' יח"ל'}</option>`).join('')}</select>`:`<span class="pill">${u} יח"ל</span>`;
  const nameInput=subj.named?`<input type="text" style="width:130px;" placeholder="שם המקצוע" value="${esc((st.mugbarNames||{})[subj.id]||'')}" onchange="setMugbarName('${st.id}','${subj.id}',this.value)">`:'';
  const custom=hasOverrides(st,subj);
  let body='';
  if(u===0){ body='<div class="note">לא נלמד</div>'; }
  else{
    const baseComps=getComps(subj,u);
    const comps=getCompsFor(st,subj,u);
    const stOv=st.ov||{}, codes=st.codes||{};
    body=`<div class="comp-grid">${comps.map((c,i)=>{
      // במקצועות מוגברים וברכיב "עבודה נוספת" מציגים גם רכיבים במשקל 0 כדי לאפשר הפעלה; בשאר מסתירים
      if(isHidden(st,subj.id+'.'+i)) return '';
      // "עבודה נוספת" מוצגת רק אם הופעלה, או שכבר יש בה משקל/ציון
      if(c.b&&!c.w&&!((st.grades||{})[subj.id+'.'+i]!==undefined)&&!((st.shw||{})[subj.id+'.'+i])) return '';
      // מציגים רכיב גם כשמשקלו 0 אם: מקצוע מוגבר · עבודה נוספת · או שהמשקל אופס ידנית (כדי שאפשר יהיה להחזירו)
      if(!c.w&&!subj.named&&!c.b&&!(baseComps[i]&&baseComps[i].w>0)) return '';
      const key=subj.id+'.'+i, g=st.grades||{};
      const po=stOv[key]||{};
      const wOv=po.w!==undefined&&po.w!==null&&po.w!=='';

      const codeIn=`<div class="comp-inputs" style="margin-top:4px;">סמל ${codeSelect(st,key)}</div>`;
      const wIn=`משקל <input type="number" min="0" max="100" data-k="w:${key}" style="width:52px; ${wOv?'border-color:var(--brand2); background:#f5f3ff; font-weight:700;':''}" value="${wOv?po.w:''}" placeholder="${baseComps[i].w}" title="ברירת מחדל: ${baseComps[i].w}% — הזנת ערך יוצרת התאמה אישית לתלמידה זו" onchange="setOv('${st.id}','${key}','w',this.value)">%`;

        <div class="comp-row"><span class="lbl">ציון</span><input type="number" min="0" max="100" data-k="${key}" class="${gstatCls(st,key).trim()}" value="${g[key]??''}" onchange="setGrade('${st.id}','${key}',this.value)">${stBtn(key)}
        ${(()=>{const dv=(r.details||[])[i]; const v=dv&&dv.val!==null&&dv.val!==undefined?dv.val:null;
          return (v!==null&&c.w)?`<span class="pill" title="תרומה לציון הסופי">= ${Math.round(v*c.w/100*10)/10} נק׳ מתוך ${c.w}</span>`:'';})()}</div>
        <div class="comp-row"><span class="lbl">משקל</span>${wIn}</div>
        <div class="comp-row"><span class="lbl">סמל</span>${codeSelect(st,key)} ${noteBtn(st,key,subj.name+' · '+c.n)}</div></div>`;
      }
      const fl=(r.flips||[]).find(f=>f.comp===c.n);
      const flBadge=fl?` <span class="badge b-warn" title="ציון הבחינה (${fl.e}) גבוה מהמגן (${fl.m}) — המשקל הגדול עבר לבחינה: מגן ${fl.s}% / בחינה ${100-fl.s}%">🔀 היפוך לטובת הבחינה</span>`:'';
      const sSel=`<select style="font-size:11px; ${sOv?'border-color:var(--brand2); background:#f5f3ff; font-weight:700;':''}" onchange="setOv('${st.id}','${key}','s',this.value)">
        <option value="">מגן ${baseComps[i].s}/${100-baseComps[i].s} (רגיל)</option>
        ${[70,60,50,40,30,20,0].map(s=>`<option value="${s}" ${sOv&&+po.s===s?'selected':''}>מגן ${s}% / בחינה ${100-s}%</option>`).join('')}</select>`;
      const eff=c.s;  // אחוז המגן בפועל
      const dv=(r.details||[])[i];
      const cVal=dv&&dv.val!==null&&dv.val!==undefined?dv.val:null;
      const contrib=cVal!==null&&c.w?Math.round(cVal*c.w/100*10)/10:null;
      const rowFinal=`<div class="comp-row" style="background:#f8faff; border-top:2px solid var(--line); font-weight:800;">
        <span class="lbl">ציון הרכיב</span>
        <span class="${gradeClass(cVal)}" style="font-size:14px;">${cVal===null?'—':cVal}</span>
        ${contrib!==null?`<span class="pill" title="תרומת הרכיב לציון הסופי במקצוע: ${cVal} × ${c.w}%">= ${contrib} נק׳ מתוך ${c.w}</span>`:''}
      </div>`;
      const rowM=eff>0?`<div class="comp-row"><span class="lbl">ציון מגן</span><input type="number" min="0" max="100" data-k="${key}.m" class="${gstatCls(st,key+'.m').trim()}" value="${g[key+'.m']??''}" onchange="setGrade('${st.id}','${key}.m',this.value)">${stBtn(key+'.m')}<span class="pill">${eff}%</span></div>`:'';
      const rowE=eff<100?`<div class="comp-row"><span class="lbl">ציון בחינה</span><input type="number" min="0" max="100" data-k="${key}.e" class="${gstatCls(st,key+'.e').trim()}" value="${g[key+'.e']??''}" onchange="setGrade('${st.id}','${key}.e',this.value)">${stBtn(key+'.e')}<span class="pill">${100-eff}%</span>${eff===0?' <span class="pill" style="background:#e0e7ff; color:#3730a3;">ללא מגן — 100% בחינה</span>':''}</div>`:'';
      return `<div class="comp-box" ${(wOv||sOv)?'style="border-color:var(--brand2); box-shadow:0 0 0 1px var(--brand2);"':''}>
      <button class="compHide" onclick="hideComp('${st.id}','${key}',${c.w||0},'${esc(c.n).replace(/'/g,"")}')" title="הסרת הרכיב">✕</button><div class="cn">${esc(c.n)}${c.w?'':' <span class="pill">כבוי — הזיני משקל להפעלה</span>'}${flBadge}</div>
      ${rowM}${rowE}${rowFinal}

    }).join('')}</div>`;
    const hid=comps.map((c,i)=>({c,i})).filter(x=>isHidden(st,subj.id+'.'+x.i));
    if(hid.length) body+=`<div class="hiddenChips"><span class="note" style="align-self:center;">רכיבים שהוסרו:</span>
      ${hid.map(x=>`<button onclick="showComp('${st.id}','${subj.id}.${x.i}')" title="החזרת הרכיב">➕ ${esc(x.c.n)}</button>`).join('')}</div>`;
    if(Math.round(r.wSum)!==100&&!subj.internalOnly) body+=`<div class="note" style="color:var(--warn); font-weight:700;">ℹ️ סה"כ משקלי הרכיבים: ${r.wSum}% — הציון הסופי מחושב בחלוקה יחסית (למשל אחרי הוספת עבודה נוספת)</div>`;
  }
  const finalHtml=u===0?'':`${subj.internalOnly&&!state.includeInternal?'<span class="pill">לא נכלל בממוצע</span> ':''}${custom?'<span class="badge b-pot">מותאם אישית</span> ':''}<span style="font-size:15px; font-weight:800;" title="${r.raw!==null?'לפני עיגול: '+r.raw:''}">${scoreCell(r)}</span>${r.blocker&&!subj.internalOnly?' <span class="badge b-bad">מעכב</span>':''}${r.missing?` <span class="badge b-miss">חסרים ${r.missing}</span>`:''}`;
  const resetBtn=custom?`<button class="btn sec sm" onclick="event.stopPropagation();resetOv('${st.id}','${subj.id}')" title="ביטול ההתאמות האישיות במקצוע זה">↩️ איפוס התאמות</button>`:'';
  const tA=testAvg(st,subj.id), tNn=testsOf(st,subj.id).length;
  const testChip=(u!==0&&!subj.internalOnly)?`<button class="btn sec sm" onclick="event.stopPropagation();openTestsDlg('${st.id}','${subj.id}')" title="ציוני מבחנים בכיתה — לחיזוי בלבד, לא נכנסים לציון" style="${tNn?'border-color:#c4b5fd; background:#faf5ff; color:#6d28d9;':''}">📝 מבחנים${tNn?`: ${tA} (${tNn})`:''}</button>`:'';
  // כפתור הוספת "עבודה נוספת" — רק אם היא לא מוצגת כרגע
  let bonusBtn='';
  if(u!==0&&!subj.internalOnly){
    const cAll=getCompsFor(st,subj,u);
    const bi=cAll.findIndex(c=>c.b);
    if(bi>=0){
      const bk=subj.id+'.'+bi;
      const shown=(cAll[bi].w>0)||((st.grades||{})[bk]!==undefined)||((st.shw||{})[bk]);
      if(!shown&&!isHidden(st,bk)) bonusBtn=`<button class="btn sec sm" style="border-color:#86efac; color:#166534; background:#f0fdf4;" onclick="event.stopPropagation();addBonus('${st.id}','${subj.id}',${bi})" title="הוספת עבודה נוספת / הערכה חלופית לשיפור הציון">➕ עבודה נוספת</button>`;
    }
  }
  const presetSel=subj.named?`<select onclick="event.stopPropagation()" onchange="applyMugbarPreset('${st.id}','${subj.id}',this.value)" style="font-size:11.5px;" title="החלת מבנה משקלים וסמלי שאלונים מקטלוג בית הספר">
    <option value="">📋 מבנה מהקטלוג...</option>
    ${Object.keys(MUGBAR_PRESETS).map(p=>`<option>${esc(p)}</option>`).join('')}</select>`:'';
  return `<div class="subj-card open"><div class="subj-head"><span>${esc(subj.name)} ${nameInput} ${unitsSel} ${noteBtn(st,subj.id,'הערה כללית — '+subj.name)} ${bonusBtn} ${presetSel} ${testChip} ${resetBtn}</span><span>${finalHtml}</span></div>
  <div class="subj-body">${body}</div></div>`;
}
function addBonus(id,sid,i){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.shw=st.shw||{}; st.shw[sid+'.'+i]=1;
  if(st.hid) delete st.hid[sid+'.'+i];
  save(); refreshOpenViews(id); toast('נוספה עבודה נוספת — הזיני משקל וציון');
}
function hideComp(id,key,w,name){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  if(w>0){
    if(!confirm(`לרכיב "${name}" יש משקל ${w}% בציון.\n\nהסרה תאפס את משקלו — האחוזים יתחלקו מחדש בין שאר הרכיבים והציון עשוי להשתנות.\n\nלהסיר?`)) return;
    pushUndo('הסרת רכיב — '+name);
    st.ov=st.ov||{}; st.ov[key]=Object.assign({},st.ov[key],{w:0});
  }
  st.hid=st.hid||{}; st.hid[key]=1;
  if(st.shw) delete st.shw[key];
  save(); refreshOpenViews(id); toast('הרכיב הוסר — אפשר להחזירו מהשורה התחתונה במקצוע');
}
function showComp(id,key){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  if(st.hid) delete st.hid[key];
  // אם המשקל אופס בעת ההסרה — מחזירים אותו לברירת המחדל
  if(st.ov&&st.ov[key]&&st.ov[key].w===0){
    delete st.ov[key].w;
    if(!Object.keys(st.ov[key]).length) delete st.ov[key];
    toast('הרכיב הוחזר יחד עם משקל ברירת המחדל');
  }else toast('הרכיב הוחזר');
  save(); refreshOpenViews(id);
}
function isHidden(st,key){ return !!((st.hid||{})[key]); }
function setOv(id,key,field,val){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.ov=st.ov||{};
  if(val===''||val===null){ if(st.ov[key]){ delete st.ov[key][field]; if(!Object.keys(st.ov[key]).length) delete st.ov[key]; } }
  else{ st.ov[key]=st.ov[key]||{}; st.ov[key][field]=+val; }
  save(); refreshOpenViews(id);
}
function resetOv(id,sid){
  const st=state.students.find(s=>s.id===id); if(!st||!st.ov) return;
  Object.keys(st.ov).filter(k=>k.startsWith(sid+'.')).forEach(k=>delete st.ov[k]);
  save(); refreshOpenViews(id);
}
function setCode(id,key,val){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.codes=st.codes||{};
  if(!val.trim()) delete st.codes[key]; else st.codes[key]=val.trim();
  save();
}
function setGrade(id,key,val){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.grades=st.grades||{};
  if(val===''||val===null) delete st.grades[key];
  else st.grades[key]=Math.max(0,Math.min(100,+val));
  save();
  const modal=document.getElementById('studentModal');
  if(modal&&modal.classList.contains('show')) refreshOpenViews(id);
  else renderKeepScroll();
}
function setUnits(id,sid,val){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.units=st.units||{}; st.units[sid]=+val;
  save();
  const modal=document.getElementById('studentModal');
  if(modal&&modal.classList.contains('show')) refreshOpenViews(id,true);
  else renderKeepScroll();
}
function setMugbarName(id,sid,val){
  const st=state.students.find(s=>s.id===id); if(!st) return;
  st.mugbarNames=st.mugbarNames||{}; st.mugbarNames[sid]=val.trim();
  save();
}
function refreshOpenViews(id,full){
  const modal=document.getElementById('studentModal');
  if(modal.classList.contains('show')){
    // שמירת מיקום הגלילה והשדה הפעיל — כדי שלא נקפוץ להתחלה בכל שינוי
    const body=document.querySelector('#studentBox .stBody');
    const sc=body?body.scrollTop:0;
    const ae=document.activeElement;
    const ak=(ae&&ae.getAttribute)?ae.getAttribute('data-k'):null;
    const sel=(ae&&ae.selectionStart!==undefined)?ae.selectionStart:null;
    openStudent(id);
    const nb=document.querySelector('#studentBox .stBody');
    if(nb) nb.scrollTop=sc;
    if(ak){
      const el=document.querySelector('#studentBox [data-k="'+ak+'"]');
      if(el){ el.focus(); try{ if(sel!==null&&el.setSelectionRange) el.setSelectionRange(sel,sel); }catch(e){} }
    }
  }
  else if(currentTab==='entry'&&full) render();
}
function closeStudent(){
  document.getElementById('studentModal').classList.remove('show');
  render();
}
/* ============ הזנת ציונים לפי מקצוע ============ */

function entryGrid(subj,studs){
  if(!studs.length) return '<div class="note">אין תלמידות — הוסיפי בלשונית "תלמידות"</div>';
  // כותרות לפי יח"ל מקסימלי כדי לכלול את כל הרכיבים
  const maxU=subj.opts[subj.opts.length-1];
  const headComps=subj.comps(maxU);
  let head=`<tr><th>שם</th>${subj.opts.length>1?'<th>יח"ל</th>':''}${subj.named?'<th>מקצוע</th>':''}`;
  headComps.forEach((c,i)=>{
    head+=c.t==='i'?`<th>${esc(c.n)}</th>`:`<th>${esc(c.n)}<br><small>${c.s===0?'100% בחינה':(c.s===100?'מגן בלבד':'מגן '+c.s+'% / בחינה '+(100-c.s)+'%')}</small></th>`;
  });
  head+='<th>ציון סופי</th><th>סטטוס</th></tr>';
  const rows=studs.map(st=>{
    const u=getUnits(st,subj);
    const r=calcSubject(st,subj);
    const comps=u===0?[]:getCompsFor(st,subj,u);
    let tds=`<td><span class="name-link" onclick="openStudent('${st.id}')">${esc(st.name)}</span><br><small style="color:var(--muted)">${esc(st.cls)}</small></td>`;
    if(subj.opts.length>1) tds+=`<td><select data-k="u|${st.id}|${subj.id}" onchange="setUnits('${st.id}','${subj.id}',this.value)">${subj.opts.map(o=>`<option value="${o}" ${o===u?'selected':''}>${o===0?'—':o}</option>`).join('')}</select></td>`;
    if(subj.named) tds+=`<td><input type="text" data-k="n|${st.id}|${subj.id}" style="width:110px;" value="${esc((st.mugbarNames||{})[subj.id]||'')}" onchange="setMugbarName('${st.id}','${subj.id}',this.value)"></td>`;
    headComps.forEach((hc,i)=>{
      const c=comps[i];
      if(u===0||!c||!c.w){ tds+='<td style="color:#cbd5e1;">—</td>'; return; }
      const key=subj.id+'.'+i, g=st.grades||{};
      const nt=noteOf(st,key);
      const kc=k=>((g[k]==null?'cell-miss':'')+gstatCls(st,k));
      const ct=k=>`oncontextmenu="event.preventDefault();cycleGstat('${st.id}','${k}')" title="לחיצה ימנית: שחור→אדום→כחול"`;
      if(c.t==='i'){
        tds+=`<td class="${nt?'hasNote':''}" title="${nt?esc(nt):''}"><div class="gcell"><input type="number" min="0" max="100" data-k="g|${st.id}|${key}" class="${kc(key)}" ${ct(key)} value="${g[key]??''}" onchange="setGrade('${st.id}','${key}',this.value)"></div></td>`;
      }else{
        const eff=c.s;
        const rM=eff>0?`<div class="gcell"><small>מגן</small><input type="number" min="0" max="100" data-k="g|${st.id}|${key}.m" class="${kc(key+'.m')}" ${ct(key+'.m')} value="${g[key+'.m']??''}" onchange="setGrade('${st.id}','${key}.m',this.value)"></div>`:'';
        const rE=eff<100?`<div class="gcell"><small>בחינה</small><input type="number" min="0" max="100" data-k="g|${st.id}|${key}.e" class="${kc(key+'.e')}" ${ct(key+'.e')} value="${g[key+'.e']??''}" onchange="setGrade('${st.id}','${key}.e',this.value)"></div>`:'';
        tds+=`<td class="${nt?'hasNote':''}" title="${nt?esc(nt):''}">${rM}${rE}</td>`;
      }
    });
    const flIc=(r.flips&&r.flips.length)?' <span title="היפוך אחוזים לטובת הבחינה ב: '+esc(r.flips.map(f=>f.comp).join(', '))+'">🔀</span>':'';
    const stat=u===0?'—':r.blocker?'<span class="badge b-bad">מעכב</span>':r.missing?`<span class="badge b-miss">חסרים ${r.missing}</span>`:r.borderline?'<span class="badge b-warn">גבולי</span>':(r.final>state.thresholds.excel?'<span class="badge b-exc">מצוין</span>':'<span class="badge b-ok">תקין</span>');
    tds+=`<td id="fin-${st.id}" style="font-weight:800;">${u===0?'<span style="color:#cbd5e1;">—</span>':scoreCell(r)}${flIc}</td><td>${stat}</td>`;
    return `<tr>${tds}</tr>`;
  }).join('');
  return `<table class="tbl grades"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

function normName(s){
  return String(s||'').replace(/["'`׳״]/g,'').replace(/\s+/g,' ').trim();
}
function matchStudent(name,pool){
  const n=normName(name);
  if(!n) return null;
  let f=pool.find(s=>normName(s.name)===n);
  if(f) return f;
  const rev=n.split(' ').reverse().join(' ');
  f=pool.find(s=>normName(s.name)===rev);
  if(f) return f;
  const words=n.split(' ').filter(Boolean);
  const cands=pool.filter(s=>{ const sw=normName(s.name).split(' '); return words.every(w=>sw.some(x=>x===w)); });
  if(cands.length===1) return cands[0];
  const part=pool.filter(s=>normName(s.name).indexOf(n)===0||n.indexOf(normName(s.name))===0);
  return part.length===1?part[0]:null;
}

function giSetMap(idx,val){
  if(val==='') delete gi.map[idx]; else gi.map[idx]=val;

function giParseText(){
  const t=(document.getElementById('giText')||{}).value||'';
  const rows=[]; let nameFirst=0, gradeFirst=0;
  const lines=t.split('\n').map(x=>x.trim()).filter(Boolean);
  // זיהוי הסדר: שם→ציון או ציון→שם
  lines.forEach(s=>{
    if(/^\d{1,3}(?:\.\d+)?[\t,;\s]+\D/.test(s)) gradeFirst++;
    else if(/[\t,;\s]\d{1,3}(?:\.\d+)?\s*$/.test(s)) nameFirst++;
  });
  const mode=gi.order==='auto'?(gradeFirst>nameFirst?'grade':'name'):gi.order;
  lines.forEach(s=>{
    let name=null,g=null;
    if(mode==='grade'){
      const m=s.match(/^(\d{1,3}(?:\.\d+)?)[\t,;\s]+(.+)$/);
      if(m){ g=+m[1]; name=m[2].trim(); }
    }else{
      const m=s.match(/^(.+?)[\t,;]+\s*(\d{1,3}(?:\.\d+)?)\s*$/)||s.match(/^(.+?)\s+(\d{1,3}(?:\.\d+)?)\s*$/);
      if(m){ name=m[1].trim(); g=+m[2]; }
    }
    if(name===null||g===null||isNaN(g)||g<0||g>100||!name) return;
    rows.push({name,grade:g});
  });
  if(!rows.length){ toast('לא זוהו שורות — כל שורה צריכה להכיל שם וציון (בכל סדר)'); return; }
  gi.rows=rows; gi.map={}; gi.detected=mode;
  renderGradeImport();
  toast(`זוהו ${rows.length} שורות · סדר: ${mode==='grade'?'ציון ואז שם':'שם ואז ציון'}`);
}
function giParseFile(input){
  const file=input.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false});
      // זיהוי עמודת שמות (טקסט) ועמודת ציונים (מספרים 0-100)
      const width=Math.max(...aoa.map(r=>r.length));
      const score=[],txt=[];
      for(let c=0;c<width;c++){ let n=0,s=0;
        aoa.forEach(r=>{ const v=r[c];
          if(typeof v==='number'&&v>=0&&v<=100) n++;
          else if(typeof v==='string'&&v.trim().length>1&&!/^\d+$/.test(v.trim())) s++; });
        score[c]=n; txt[c]=s; }
      const nameCol=txt.indexOf(Math.max(...txt));
      let gCol=-1,best=-1;
      for(let c=0;c<width;c++){ if(c!==nameCol&&score[c]>best){best=score[c];gCol=c;} }
      if(nameCol<0||gCol<0){ toast('לא זוהו עמודות שם וציון בקובץ'); input.value=''; return; }
      const rows=[];
      aoa.forEach(r=>{ const nm=r[nameCol], g=r[gCol];
        if(typeof nm!=='string'||!nm.trim()) return;
        const gv=typeof g==='number'?g:(g!==undefined&&g!==''&&!isNaN(+g)?+g:null);
        if(gv===null||gv<0||gv>100) return;
        rows.push({name:nm.trim(),grade:Math.round(gv*10)/10}); });
      if(!rows.length){ toast('לא נמצאו שורות עם שם וציון'); input.value=''; return; }
      gi.rows=rows; gi.map={}; renderGradeImport(); toast(`נקראו ${rows.length} שורות מהקובץ`);
    }catch(err){ toast('שגיאה בקריאת הקובץ: '+err.message); }
    input.value='';
  };
  rd.readAsArrayBuffer(file);
}
function giApply(){
  const subjP=SUBJ_MAP[gi.subj]||SUBJECTS[0];
  const isTestP=gi.comp==='T';
  const compsP=giCompOptions();
  const curP=isTestP?{t:'T',n:(gi.testName||'מבחן'),i:'T'}:(compsP.find(c=>c.i===gi.comp)||compsP[0]);
  const tgtP=isTestP?`📝 ${gi.testName||'מבחן'} (לחיזוי)`:(curP.t==='e'?(gi.target==='m'?'ציון מגן':'ציון בחינה'):'הערכה פנימית');
  const poolP=state.students.filter(s=>!entryClass||s.cls===entryClass);
  let willN=0;
  gi.rows.forEach((r,idx)=>{ const mn=gi.map[idx];
    if(mn==='__skip') return;
    if(mn?poolP.find(s=>s.id===mn):matchStudent(r.name,poolP)) willN++; });
  if(!confirm(`אישור אחרון — עדכון ציונים\n\n📘 מקצוע: ${subjP.name}\n📝 רכיב: ${curP.n}\n🎯 סוג הציון: ${tgtP}\n🏫 כיתה: ${entryClass||'כל השכבה'}\n👩‍🎓 תלמידות שיתעדכנו: ${willN}\n\nציונים קיימים ברכיב זה יידרסו. להמשיך?`)) return;
  pushUndo(`ייבוא ${subjP.name} · ${tgtP}`);
  const subj=SUBJ_MAP[gi.subj]||SUBJECTS[0];
  const isTest=gi.comp==='T';
  const comps=giCompOptions();
  const cur=isTest?{t:'T',i:'T'}:(comps.find(c=>c.i===gi.comp)||comps[0]);
  const pool=state.students.filter(s=>!entryClass||s.cls===entryClass);
  let n=0, skipped=[];
  gi.rows.forEach((r,idx)=>{
    const manual=gi.map[idx];
    let st;
    if(manual==='__skip'){ return; }
    else if(manual) st=pool.find(s=>s.id===manual);
    else st=matchStudent(r.name,pool);
    if(!st){ skipped.push(r.name); return; }
    if(isTest){
      // מבחן/בוחן/עבודה — נכנס לשכבת החיזוי, לא לציון הרשמי
      const arr=testsOf(st,subj.id);
      const nm=gi.testName||'מבחן', w=+gi.testW||2;
      const ex=arr.findIndex(x=>x.n===nm);
      if(ex>=0) arr[ex]={n:nm,g:Math.max(0,Math.min(100,r.grade)),w};
      else arr.push({n:nm,g:Math.max(0,Math.min(100,r.grade)),w});
      saveTests(st,subj.id,arr);
      n++; return;
    }
    const base=subj.id+'.'+cur.i;
    const key=cur.t==='e'?base+'.'+gi.target:base;
    st.grades=st.grades||{};
    st.grades[key]=Math.max(0,Math.min(100,r.grade));
    st.gstat=st.gstat||{};
    if(gi.color) st.gstat[key]=gi.color; else delete st.gstat[key];
    n++;
  });
  save();
  const cTxt=isTest?` · ${gi.testName} (לחיזוי בלבד)`:(gi.color==='r'?' (אדום — טרם דווח)':gi.color==='b'?' (כחול — פיקטיבי)':' (שחור — דווח)');
  toast(`הוזנו ${n} ציונים ב${subj.name}${isTest?'':' · '+cur.n}${cTxt}`+(skipped.length?` · ${skipped.length} לא זוהו ודולגו`:''));
  gi.rows=[]; closeGradeImport();
}

  const cTxt=color==='r'?'🔴 אדום (טרם דווח)':color==='b'?'🔵 כחול (פיקטיבי)':'⚫ שחור (דווח למשרד)';
  const sTxt=scope==='all'?'כל הציונים במקצוע':'הרכיב שנבחר';
  if(!confirm(`לצבוע ${sTxt} ב${subj.name} אצל ${studs.length} תלמידות בצבע ${cTxt}?\n(רק ציונים שהוזנו — תאים ריקים לא ישתנו)`)) return;
  pushUndo('צביעה גורפת — '+subj.name);
  let n=0;
  studs.forEach(st=>{
    const u=getUnits(st,subj); if(u===0) return;
    const comps=getCompsFor(st,subj,u);
    st.gstat=st.gstat||{};
    const mark=k=>{ if((st.grades||{})[k]===undefined) return;
      if(color) st.gstat[k]=color; else delete st.gstat[k]; n++; };
    if(scope==='all'){
      comps.forEach((c,i)=>{ const base=subj.id+'.'+i;
        if(c.t==='i') mark(base); else { mark(base+'.m'); mark(base+'.e'); } });
    }else{
      const [idxS,part]=String(scope).split('|');
      const i=+idxS, base=subj.id+'.'+i;
      if(part==='g') mark(base);
      else if(part==='m') mark(base+'.m');
      else if(part==='e') mark(base+'.e');
      else { mark(base+'.m'); mark(base+'.e'); }
    }
  });
  save(); render();
  toast(`נצבעו ${n} ציונים ב${subj.name} — ${cTxt}`);
}
