// טבלת עריכה של הסימולציה: מציגה את הציונים האמיתיים, שינויים נשמרים בשכבת הניסוי בלבד
function simGrid(subj,studs){
  if(!studs.length) return '<div class="note">אין תלמידות</div>';
  const maxU=subj.opts[subj.opts.length-1];
  const headComps=subj.comps(maxU);
  let head=`<tr><th>שם</th>${subj.opts.length>1?'<th>יח"ל</th>':''}`;
  headComps.forEach(c=>{ head+=c.t==='i'?`<th>${esc(c.n)}</th>`:`<th>${esc(c.n)}<br><small>${c.s===0?'100% בחינה':'מגן '+c.s+'%'}</small></th>`; });
  head+='<th style="background:#f5f3ff;">מבחנים · בחנים · עבודות<br><small>ממוצע משוקלל · לחיזוי בלבד</small></th><th>ציון אמיתי</th><th>ציון בניסוי</th></tr>';
  const rows=studs.map(st=>{
    const u=getUnits(st,subj);
    const comps=u===0?[]:getCompsFor(st,subj,u);
    const rReal=calcSubject(st,subj);
    const rSim=calcSubject(st,subj,{sim:true});
    const ic=internalComp(st,subj); const intIdx=ic?ic.i:-1;
    const g=gradesOf(st,true);
    let tds=`<td><span class="name-link" onclick="openStudent('${st.id}')">${esc(st.name)}</span><br><small style="color:var(--muted)">${esc(st.cls)}</small></td>`;
    if(subj.opts.length>1) tds+=`<td>${u===0?'—':u}</td>`;
    headComps.forEach((hc,i)=>{
      const c=comps[i];
      if(u===0||!c||!c.w){ tds+='<td style="color:#cbd5e1;">—</td>'; return; }
      const key=subj.id+'.'+i;
      const cls=k=>((g[k]==null?'cell-miss ':'')+(isSimKey(st,k)?'sim-cell':''));
      if(c.t==='i'){
        // תג "צריך X" — הציון המינימלי בהערכה הפנימית שיביא את המקצוע לציון עובר
        let need='';
        if(i===intIdx&&rReal.final!==null&&rReal.final<state.thresholds.pass){
          const nd=neededInternalForSubject(st,subj,Math.ceil(state.thresholds.pass));
          need=nd.ok?`<span class="needbadge" title="הזיני ציון זה כדי שהמקצוע יעבור">צריך ${nd.x}</span>`
                    :`<span class="badge b-bad" style="font-size:11px;">לא ניתן</span>`;
        }
        tds+=`<td><div class="gcell"><input type="number" min="0" max="100" data-k="s|${st.id}|${key}" class="${cls(key)}" value="${g[key]??''}" onchange="setGradeSim('${st.id}','${key}',this.value)">${need}</div></td>`;
      }else{
        const eff=c.s;
        const rM=eff>0?`<div class="gcell"><small>מגן</small><input type="number" min="0" max="100" data-k="s|${st.id}|${key}.m" class="${cls(key+'.m')}" value="${g[key+'.m']??''}" onchange="setGradeSim('${st.id}','${key}.m',this.value)"></div>`:'';
        const rE=eff<100?`<div class="gcell"><small>בחינה</small><input type="number" min="0" max="100" data-k="s|${st.id}|${key}.e" class="${cls(key+'.e')}" value="${g[key+'.e']??''}" onchange="setGradeSim('${st.id}','${key}.e',this.value)"></div>`:'';
        tds+=`<td>${rM}${rE}</td>`;
      }
    });
    // מבחני כיתה — לא נכנסים לציון הרשמי, רק משפרים את החיזוי
    const tAvg=testAvg(st,subj.id), tN=testsOf(st,subj.id).length;
    const tList=testsOf(st,subj.id);
    tds+=`<td style="background:#faf8ff;"><div class="gcell">
      ${tAvg!==null?`<span class="${gradeClass(tAvg)}" style="font-size:15px; font-weight:800;">${tAvg}</span>
        <span class="pill" style="font-size:9.5px; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${esc(tList.map(t=>t.n+' '+t.g+' (×'+t.w+')').join(' · '))}">${tList.map(t=>t.n).join(' · ')}</span>`
        :'<span style="color:#cbd5e1;">—</span>'}
      <button class="btn sec sm" style="padding:1px 8px; font-size:10.5px; border-color:#c4b5fd; color:#6d28d9;" onclick="event.stopPropagation();openTestsDlg('${st.id}','${subj.id}')" title="ניהול מבחנים, בחנים ועבודות">${tN?'✏️ ניהול':'➕ הוספה'}</button>
    </div></td>`;
    const diff=u!==0&&rReal.final!==rSim.final;
    tds+=`<td>${u===0?'<span style="color:#cbd5e1;">—</span>':scoreCell(rReal)}</td>
    <td style="font-weight:800; ${diff?'background:#fff7ed;':''}">${u===0?'<span style="color:#cbd5e1;">—</span>':scoreCell(rSim)}${diff?' 🔶':''}</td>`;
    return `<tr>${tds}</tr>`;
  }).join('');
  return `<table class="tbl grades"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

/* ============ מחשבון "כמה צריך בהערכה הפנימית" ============ */
// מאתר את רכיב ההערכה הפנימית שניתן לשחק בו
function internalComp(st,subj){
  const u=getUnits(st,subj); if(u===0) return null;
  const comps=getCompsFor(st,subj,u);
  for(let i=0;i<comps.length;i++){ if(comps[i].t==='i'&&comps[i].w>0) return {i,c:comps[i]}; }
  return null;
}
// הציון המינימלי בהערכה הפנימית שיביא את ציון המקצוע ליעד (חיפוש מדויק, מכבד עיגול והיפוך)
function neededInternalForSubject(st,subj,target){
  const ic=internalComp(st,subj); if(!ic) return {ok:false,reason:'אין הערכה פנימית'};
  const key=subj.id+'.'+ic.i;
  st.grades=st.grades||{};
  const orig=st.grades[key];
  const start=orig===undefined?0:Math.max(0,Math.min(100,Math.ceil(orig)));
  let found=null;
  for(let x=start;x<=100;x++){   // רק העלאה — לא נציע להוריד ציון קיים
    st.grades[key]=x;
    const r=calcSubject(st,subj);
    if(r.final!==null&&r.final>=target){ found=x; break; }
  }
  if(orig===undefined) delete st.grades[key]; else st.grades[key]=orig;
  return found===null?{ok:false,reason:'לא ניתן להגיע ליעד'}:{ok:true,x:found,comp:ic.c.n,key,cur:orig===undefined?null:orig,w:ic.c.w};
}
// הציון המינימלי בהערכה פנימית של מקצוע כלשהו שיביא את הממוצע ליעד
function neededInternalForAvg(st,target){
  const best=[];
  SUBJECTS.forEach(subj=>{
    if(subj.internalOnly) return;
    const ic=internalComp(st,subj); if(!ic) return;
    const key=subj.id+'.'+ic.i;
    st.grades=st.grades||{};
    const orig=st.grades[key];
    const start=orig===undefined?0:Math.max(0,Math.min(100,Math.ceil(orig)));
    let found=null;
    for(let x=start;x<=100;x++){   // רק העלאה
      st.grades[key]=x;
      const rr=calcStudent(st);
      if(rr.avg!==null&&rr.avg>target){ found=x; break; }
    }
    if(orig===undefined) delete st.grades[key]; else st.grades[key]=orig;
    if(found!==null) best.push({subj,x:found,cur:orig===undefined?null:orig,comp:ic.c.n,delta:found-(orig===undefined?0:orig)});
  });
  best.sort((a,b)=>a.delta-b.delta);
  return best[0]||null;
}
// מסלול שני: העלאת כל ההערכות הפנימיות לרף אחיד X (רק אלה שמתחתיו)
function neededInternalAll(st,target){
  const keys=[];
  SUBJECTS.forEach(subj=>{
    if(subj.internalOnly) return;
    const ic=internalComp(st,subj); if(!ic) return;
    keys.push({key:subj.id+'.'+ic.i,name:subj.name});
  });
  if(!keys.length) return null;
  st.grades=st.grades||{};
  const orig={}; keys.forEach(k=>{ orig[k.key]=st.grades[k.key]; });
  let found=null,changed=0;
  for(let x=0;x<=100;x++){
    let ch=0;
    keys.forEach(k=>{ const cur=orig[k.key];
      if(cur===undefined||cur<x){ st.grades[k.key]=x; ch++; } else st.grades[k.key]=cur; });
    const rr=calcStudent(st);
    if(rr.avg!==null&&rr.avg>target){ found=x; changed=ch; break; }
  }
  keys.forEach(k=>{ if(orig[k.key]===undefined) delete st.grades[k.key]; else st.grades[k.key]=orig[k.key]; });
  return found===null?null:{x:found,changed,total:keys.length};
}
function calcPanel(studs){
  const T=state.thresholds;
  // מדור "כדי לעבור" הוסר — המספר הנדרש מוצג כתג ירוק צמוד לשדה בטבלת הניסוי
  const excRows=[];
  studs.forEach(st=>{
    const r=calcStudent(st);
    if(r.avg===null||r.blockers.length||!r.complete) return;
    if(r.avg>T.excel) return;                 // כבר מצטיינת
    if(r.avg<T.excel-12) return;              // רחוקה מדי — לא רלוונטי
    const n=neededInternalForAvg(st,T.excel);
    const nAll=n?null:neededInternalAll(st,T.excel);
    excRows.push({st,avg:r.avg,n,nAll,unitsOk:r.unitsOk});
  });
  excRows.sort((a,b)=>b.avg-a.avg);
  if(!excRows.length) return '';
  return `<div class="card" style="margin-bottom:14px; border:2px solid var(--ok);">
    <h3 class="sec">⭐ כמה צריך כדי להצטיין (מעל ${T.excel})</h3>

      <td>${x.unitsOk?'✓':'<span class="badge b-warn">✗ לא עומדת</span>'}</td>

/* ============ חיזוי מצטיינות סוף שנה ============ */
function predictionPanel(studs){
  const T=state.thresholds;
  const pOpts={split:simSplit===''?null:+simSplit, predict:true, bonus:+simBonus, sim:true};
  const res=studs.map(st=>({st,r:calcStudent(st,pOpts)})).filter(x=>x.r.avg!==null);
  if(!res.length) return '';
  res.sort((a,b)=>b.r.avg-a.r.avg);
  const exc=res.filter(x=>x.r.excellent);
  const pot=res.filter(x=>x.r.potential);
  const close=res.filter(x=>x.r.complete&&x.r.blockers.length===0&&x.r.unitsOk&&x.r.avg>=87&&x.r.avg<=T.excel);
  const noUnits=res.filter(x=>x.r.complete&&x.r.blockers.length===0&&!x.r.unitsOk&&x.r.avg>=T.potential);
  const gapCell=v=>{
    const d=Math.round((v-T.excel)*10)/10;
    if(d>0) return `<span class="delta-up">+${d} ✓</span>`;
    return `<span class="${d>=-3?'grade-warn':'grade-bad'}" style="font-weight:800;">${d===0?'0 (לא מספיק — נדרש מעל)':d}</span>`;
  };
  return `<div class="card" style="margin-bottom:14px; border:2px solid var(--brand2);">
    <h3 class="sec">🔮 חיזוי סוף שנה — מי צפויה להיות מצטיינת</h3>
    <div class="note" style="margin-bottom:10px;">
      החיזוי משלים כל בחינה חסרה לפי סדר העדיפויות: <b>1)</b> ציון מבחן כיתתי אם הוזן · <b>2)</b> ציון המגן בתוספת רמת החיזוי שנבחרה.<br>
      ${state.predLevel==='auto'?`<b>🎯 כיול אוטומטי פעיל</b> — הפער בין בחינה למגן נלמד מהנתונים הקיימים: ${SUBJECTS.filter(s=>!s.internalOnly).map(s=>{const g=autoGap(s.id); return g===null?null:`${esc(s.name)} ${g>0?'+':''}${g}`;}).filter(Boolean).join(' · ')||'אין עדיין מספיק נתונים — מתנהג כאופטימי'}`
        :(state.predLevel?`רמת החיזוי: <b>מגן ${state.predLevel}</b> נקודות.`:'רמת החיזוי: <b>אופטימי</b> — בחינה = מגן. שימי לב שבפועל הבחינה נוטה להיות נמוכה מהמגן.')}
    </div>
    <div class="kpis">
      <div class="kpi k4"><div class="n">${exc.length}</div><div class="t">מצטיינות צפויות ⭐</div></div>
      <div class="kpi k3"><div class="n">${pot.length}</div><div class="t">פוטנציאל צפוי (${T.potential} עד ${T.excel})</div></div>
      <div class="kpi k1"><div class="n">${close.length}</div><div class="t">במרחק נגיעה (87+)</div></div>
      <div class="kpi k6"><div class="n">${noUnits.length}</div><div class="t">ממוצע גבוה בלי תנאי היח"ל</div></div>
    </div>
    <div class="scroll" style="max-height:50vh;">
    <table class="tbl"><thead><tr><th>#</th><th>שם</th><th>כיתה</th><th>ממוצע חזוי</th><th>פער מהסף (מעל ${T.excel})</th><th>מבוסס חיזוי ב...</th><th>תנאי יח"ל</th><th>סטטוס חזוי</th></tr></thead><tbody>
    ${res.slice(0,60).map((x,i)=>`<tr ${x.r.excellent?'style="background:#fffbeb;"':x.r.potential?'style="background:#f5f3ff;"':''}>
      <td>${i+1}</td>
      <td><span class="name-link" onclick="openStudent('${x.st.id}')">${esc(x.st.name)}</span></td>
      <td>${esc(x.st.cls)}</td>
      <td class="${gradeClass(x.r.avg)}" style="font-weight:800; font-size:14px;">${x.r.avg}</td>
      <td>${gapCell(x.r.avg)}</td>
      <td>${x.r.predIn.length?`<span class="pill" title="${esc(x.r.predIn.join(', '))}">${x.r.predIn.length} מקצועות</span>`:'<span class="badge b-ok">נתונים מלאים</span>'}</td>
      <td>${x.r.unitsOk?'✓':'<span class="badge b-warn" title="נדרש: מתמטיקה 4-5 ואנגלית 5 יח&quot;ל">✗</span>'}</td>
      <td><span class="badge ${x.r.cls}">${x.r.status}</span></td>
    </tr>`).join('')}
    </tbody></table></div>
  </div>`;
}

/* ============ התראות ============ */
function renderAlerts(m){
  const studs=filteredStudents(alertClass);
  const rows=[];
  studs.forEach(st=>{
    const r=calcStudent(st);
    const items=[];
    r.blockers.forEach(s=>items.push({sev:'bad',t:`${s.name} ${r.per[s.id].final}`,ttl:'ציון מעכב'}));
    r.borderlines.forEach(s=>items.push({sev:'warn',t:`${s.name} ${r.per[s.id].final}`,ttl:'ציון גבולי'}));
    r.gaps.forEach(g=>g.gaps.forEach(x=>items.push({sev:'warn',t:`${g.subj.name} · פער ${x.m}→${x.e}`,ttl:'פער חריג בין מגן לבחינה'})));
    if(r.complete&&!r.blockers.length&&r.unitsOk&&r.avg!==null&&r.avg>=88&&r.avg<=state.thresholds.excel)
      items.push({sev:'pot',t:`ממוצע ${r.avg} — קרובה להצטיינות`,ttl:'חסרות מעט נקודות'});
    if(r.missing.length) items.push({sev:'miss',t:`חסרים ציונים ב-${r.missing.length} מקצועות`,ttl:r.missing.map(s=>s.name).join(', ')});
    if(items.length) rows.push({st,r,items,
      pri: items.some(x=>x.sev==='bad')?0 : items.some(x=>x.sev==='warn')?1 : items.some(x=>x.sev==='pot')?2 : 3});
  });
  rows.sort((a,b)=>a.pri-b.pri||(b.r.avg||0)-(a.r.avg||0));
  const cnt=s=>rows.reduce((a,x)=>a+x.items.filter(i=>i.sev===s).length,0);
  const nBad=cnt('bad'), nWarn=cnt('warn'), nPot=cnt('pot'), nMiss=cnt('miss');
  const show=rows.filter(x=>alertFilter==='all'?true:x.items.some(i=>i.sev===alertFilter));
  const chip=(f,label,n,cls)=>`<button class="btn ${alertFilter===f?'':'sec'} sm" onclick="alertFilter='${f}';render()"
      style="${alertFilter===f?'':'opacity:'+(n?1:.45)}">${label} ${n?`<b>${n}</b>`:''}</button>`;
  m.innerHTML=`
  <div class="card" style="margin-bottom:14px;">
    <div class="toolbar" style="margin-bottom:0;">
      <label>כיתה:</label><select onchange="alertClass=this.value;render()"><option value="">כל השכבה</option>${state.classes.map(c=>`<option ${alertClass===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <span style="width:8px;"></span>
      ${chip('all','הכול',rows.length)}
      ${chip('bad','🔴 מעכבים',nBad)}
      ${chip('warn','🟠 גבוליים ופערים',nWarn)}
      ${chip('pot','⭐ קרובות להצטיינות',nPot)}
      ${chip('miss','⚪ חסרים',nMiss)}
    </div>
  </div>
  ${show.length?`<div class="card"><div class="scroll" style="max-height:70vh;">
    <table class="tbl"><thead><tr><th>תלמידה</th><th>ממוצע</th><th>מה דורש טיפול</th></tr></thead><tbody>
    ${show.map(x=>{
      const its=alertFilter==='all'?x.items:x.items.filter(i=>i.sev===alertFilter);
      const col={bad:'b-bad',warn:'b-warn',pot:'b-pot',miss:'b-miss'};
      return `<tr>
        <td><span class="name-link" onclick="openStudent('${x.st.id}')">${esc(x.st.name)}</span><br><small style="color:var(--muted)">${esc(x.st.cls)}</small></td>
        <td class="${gradeClass(x.r.avg)}">${fmt(x.r.avg)}</td>
        <td style="text-align:right;"><div style="display:flex; gap:5px; flex-wrap:wrap;">
          ${its.map(i=>`<span class="badge ${col[i.sev]}" title="${esc(i.ttl)}">${esc(i.t)}</span>`).join('')}
        </div></td></tr>`;
    }).join('')}
    </tbody></table></div>
    <div class="note" style="margin-top:8px;">${show.length} תלמידות · לחיצה על שם פותחת את כרטיס התלמידה. ציונים שטרם דווחו למשרד מסומנים באדום בטבלאות ואינם מופיעים כאן.</div>
  </div>`:'<div class="card"><div class="note" style="text-align:center; padding:20px;">✨ אין התראות בקטגוריה זו</div></div>'}`;
}

      <h2 style="font-size:20px;">${esc(reportTitle())} — ${cls?esc(cls):'כל השכבה'}</h2>
      ${state.coord?`<div style="font-size:13.5px; font-weight:700; color:var(--brand); margin-top:2px;">רכזת פדגוגית: ${esc(state.coord)}</div>`:''}
      <div class="note">הופק בתאריך ${today} · ${esc(appTitle())}</div>
    </div>

    <div class="kpi k4"><div class="n">${exc.length}</div><div class="t">מצטיינות</div></div>

  </div>
  <h3 class="sec">טבלת תלמידות מפורטת</h3>
  <div class="scroll" style="max-height:none;">
  <table class="tbl grades"><thead><tr><th>שם</th><th>כיתה</th>${SUBJECTS.map(s=>`<th>${esc(s.name)}</th>`).join('')}<th>ממוצע</th><th>סטטוס</th></tr></thead><tbody>
  ${results.map(x=>`<tr><td style="font-weight:700;">${esc(x.st.name)}</td><td>${esc(x.st.cls)}</td>
    ${SUBJECTS.map(s=>{const r=x.r.per[s.id]; if(!r||!r.active)return '<td style="color:#cbd5e1;">—</td>';
      const nt=subjNote(x.st,s.id);

    <td><span class="badge ${x.r.cls}">${x.r.status}</span></td></tr>`).join('')}

    return np?`<div class="note" style="margin-top:6px;">📝 — יש הערה (מעבר עכבר מציג אותה; הרשימה המלאה בהמשך) &nbsp;·&nbsp; <span class="rep-part">00<sup>*</sup></span> — <b>ציון חלקי</b>: טרם הוזנו כל רכיבי המקצוע. ציונים אלה אינם נכללים בממוצע, בזכאות ובספירת המצטיינות (${np} מקצועות).</div>`

function printReport(){
  document.getElementById('printArea').innerHTML='<div class="card" style="border:none; box-shadow:none;">'+buildReportHtml(reportClass)+'</div>';
  document.body.classList.add('print-mode');
  setTimeout(()=>{ window.print(); document.body.classList.remove('print-mode'); },100);
}
function reportText(cls){
  const studs=filteredStudents(cls);
  const results=studs.map(st=>({st,r:calcStudent(st)}));
  const n=studs.length; if(!n) return 'אין נתונים';
  const elig=results.filter(x=>x.r.eligible).length;
  const exc=results.filter(x=>x.r.excellent);
  const pot=results.filter(x=>x.r.potential);
  const blocked=results.filter(x=>x.r.blockers.length>0);
  const avgAll=avgOf(results.map(x=>x.r.avg).filter(v=>v!==null));
  let t=`${reportTitle()} — ${cls||'כל השכבה'} (${new Date().toLocaleDateString('he-IL')})\n`;
  if(state.coord) t+=`רכזת פדגוגית: ${state.coord}\n`;
  t+=`תלמידות: ${n} | זכאיות: ${elig} (${Math.round(elig/n*100)}%) | מצטיינות: ${exc.length} | פוטנציאל: ${pot.length} | עם מעכבים: ${blocked.length} | ממוצע: ${avgAll??'—'}\n\n`;
  const partN=results.reduce((a,x)=>a+SUBJECTS.filter(s=>{const r=x.r.per[s.id]; return r&&r.active&&r.final===null&&r.partial!==null;}).length,0);
  if(partN) t+=`(${partN} מקצועות עם ציון חלקי — טרם הוזנו כל הרכיבים)\n`;
  t+='\n';
  if(exc.length) t+='⭐ מצטיינות:\n'+exc.sort((a,b)=>b.r.avg-a.r.avg).map(x=>`  ${x.st.name} (${x.st.cls}) — ${x.r.avg}`).join('\n')+'\n\n';
  if(pot.length) t+='💜 פוטנציאל הצטיינות:\n'+pot.sort((a,b)=>b.r.avg-a.r.avg).map(x=>`  ${x.st.name} (${x.st.cls}) — ${x.r.avg}`).join('\n')+'\n\n';
  if(blocked.length) t+='🚨 עם מקצועות מעכבים:\n'+blocked.map(x=>`  ${x.st.name} (${x.st.cls}) — ${x.r.blockers.map(s=>s.name).join(', ')}`).join('\n')+'\n';
  return t;
}
function emailReport(){
  const t=reportText(reportClass);
  const subj=encodeURIComponent(`${reportTitle()} — ${reportClass||'כל השכבה'} — ${new Date().toLocaleDateString('he-IL')}`);
  window.location.href=`mailto:?subject=${subj}&body=${encodeURIComponent(t)}`;
}
function copyReport(){
  navigator.clipboard.writeText(reportText(reportClass)).then(()=>toast('הסיכום הועתק — אפשר להדביק במייל או בוואטסאפ'));
}
/* ============ הגדרות ============ */
function renderSettings(m){
  const T=state.thresholds;
  m.innerHTML=`

function T_set(k,v){ state.thresholds[k]=+v; save(); toast('נשמר'); }
let bulkSubj='lashon';
function bulkTargets(){
  const cls=(document.getElementById('bkCls')||{}).value||'';
  return state.students.filter(s=>!cls||s.cls===cls);
}
function bulkRows(){
  const subj=SUBJ_MAP[bulkSubj]||SUBJECTS[0];
  const u=subj.opts[subj.opts.length-1];
  const comps=getComps(subj,u);
  return `<div class="scroll" style="max-height:40vh;"><table class="tbl">
  <thead><tr><th>רכיב</th><th>ברירת מחדל</th><th>סמל שאלון לכולן</th><th>חלוקת מגן/בחינה חדשה</th><th>משקל חדש</th><th></th></tr></thead><tbody>
  ${comps.map((c,i)=>{
    const key=subj.id+'.'+i;
    const nOv=state.students.filter(s=>(s.ov||{})[key]).length;
    return `<tr>
      <td>${esc(c.n)}${c.b?' <span class="pill" style="background:#dcfce7;color:#166534;">עבודה נוספת</span>':''}</td>
      <td>${c.w}%${c.t==='e'?(c.s===0?' · 100% בחינה':` · מגן ${c.s}/${100-c.s}`):''}</td>
      <td>${(()=>{const opts=codeOptions(key);
        const nC=state.students.filter(s=>(s.codes||{})[key]).length;
        return `<select id="bc_${i}" style="font-size:11px; max-width:145px;"><option value="">— ללא שינוי —</option>${opts.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}<option value="__c">אחר — הקלדה…</option></select>${nC?`<br><span class="pill">${nC} עם סמל</span>`:''}`;})()}</td>
      <td>${c.t==='e'?`<select id="bs_${i}"><option value="">— ללא שינוי —</option>${[70,60,50,40,30,20,0].map(s=>`<option value="${s}">מגן ${s}% / בחינה ${100-s}%</option>`).join('')}</select>`:'<span class="note">הערכה פנימית</span>'}</td>
      <td><input type="number" id="bw_${i}" min="0" max="100" placeholder="ללא" style="width:60px;"></td>
      <td><button class="btn ok sm" onclick="bulkApply(${i})">החל</button>${nOv?`<br><span class="pill" title="לתלמידות אלה יש התאמה אישית שתידרס">${nOv} מותאמות</span>`:''}</td>
    </tr>`;
  }).join('')}
  </tbody></table></div>`;
}
function bulkApply(i){
  const subj=SUBJ_MAP[bulkSubj]||SUBJECTS[0];
  const key=subj.id+'.'+i;
  const sEl=document.getElementById('bs_'+i), wEl=document.getElementById('bw_'+i), cEl=document.getElementById('bc_'+i);
  const sVal=sEl?sEl.value:'', wVal=wEl?wEl.value:'';
  let cVal=cEl?cEl.value:'';
  if(cVal==='__c'){ const t=prompt('הקלידי סמל שאלון להחלה על כל התלמידות:',''); if(t===null) return; cVal=t.trim(); }
  if(sVal===''&&wVal===''&&cVal===''){ toast('בחרי סמל שאלון, חלוקה או משקל'); return; }
  const targets=bulkTargets();
  if(!targets.length){ toast('אין תלמידות בבחירה'); return; }
  const what=[cVal?`סמל ${cVal}`:'',sVal!==''?`מגן ${sVal}%/בחינה ${100-sVal}%`:'',wVal!==''?`משקל ${wVal}%`:''].filter(Boolean).join(' · ');
  if(!confirm(`להחיל על ${targets.length} תלמידות ב${esc(subj.name)} — ${esc(String(what))}?`)) return;
  pushUndo('שינוי גורף — '+subj.name);
  targets.forEach(st=>{
    if(cVal){ st.codes=st.codes||{}; st.codes[key]=cVal; }
    if(sVal!==''||wVal!==''){
      st.ov=st.ov||{}; st.ov[key]=Object.assign({},st.ov[key]);
      if(sVal!=='') st.ov[key].s=+sVal;
      if(wVal!=='') st.ov[key].w=+wVal;
    }
  });
  save(); render(); toast(`הוחל על ${targets.length} תלמידות`);
}
function bulkCodesAll(){
  const subj=SUBJ_MAP[bulkSubj]||SUBJECTS[0];
  const u=subj.opts[subj.opts.length-1];
  const comps=getComps(subj,u);
  const targets=bulkTargets();
  if(!targets.length){ toast('אין תלמידות בבחירה'); return; }
  const picks=[];
  comps.forEach((c,i)=>{
    const el=document.getElementById('bc_'+i);
    if(el&&el.value&&el.value!=='__c') picks.push([subj.id+'.'+i,el.value,c.n]);
  });
  if(!picks.length){ toast('בחרי סמלים בעמודת "סמל שאלון לכולן"'); return; }
  if(!confirm(`להחיל ${picks.length} סמלי שאלון על ${targets.length} תלמידות ב${subj.name}?\n\n`+picks.map(x=>'• '+x[2]+' ← '+x[1]).join('\n'))) return;
  pushUndo('סמלי שאלונים גורף');
  targets.forEach(st=>{ st.codes=st.codes||{}; picks.forEach(([k,v])=>{ st.codes[k]=v; }); });
  save(); render(); toast(`הוחלו ${picks.length} סמלים על ${targets.length} תלמידות`);
}
function bulkClear(){
  const subj=SUBJ_MAP[bulkSubj]||SUBJECTS[0];
  const targets=bulkTargets();
  const n=targets.filter(s=>Object.keys(s.ov||{}).some(k=>k.indexOf(subj.id+'.')===0)).length;

  save(); render(); toast('נוקו התאמות אצל '+n+' תלמידות');
}

function exportExcel(cls){
  cls=typeof cls==='string'?cls:'';
  const studs=filteredStudents(cls);
  if(!studs.length){toast('אין נתונים לייצוא');return;}
  const wb=XLSX.utils.book_new();
  // גיליון סיכום
  const sumRows=studs.map(st=>{
    const r=calcStudent(st);
    const row={'שם':st.name,'כיתה':st.cls};
    SUBJECTS.forEach(s=>{const p=r.per[s.id]; row[s.name]=p&&p.active?(p.final??'חסר'):'';});
    row['ממוצע משוקלל']=r.avg??'';
    row['סה"כ יח"ל']=r.totalUnits;
    row['מעכבים']=r.blockers.map(s=>s.name).join(', ');
    row['סטטוס']=r.status;
    return row;
  });
  if(state.coord) sumRows.forEach(r=>{ r['רכזת פדגוגית']=state.coord; });
  const ws1=XLSX.utils.json_to_sheet(sumRows);
  ws1['!cols']=Object.keys(sumRows[0]).map(()=>({wch:13}));
  XLSX.utils.book_append_sheet(wb,ws1,'סיכום');
  // גיליון גולמי (לייבוא חוזר)
  const rawRows=studs.map(st=>{
    const row={'שם':st.name,'כיתה':st.cls};
    SUBJECTS.forEach(subj=>{
      const sn=noteOf(st,subj.id); if(sn) row[subj.name+' - הערה כללית']=sn;
      if(subj.opts.length>1) row[subj.name+' - יח"ל']=getUnits(st,subj);
      if(subj.named) row[subj.name+' - שם מקצוע']=(st.mugbarNames||{})[subj.id]||'';
      const maxU=subj.opts[subj.opts.length-1];
      subj.comps(maxU).forEach((c,i)=>{
        const key=subj.id+'.'+i, g=st.grades||{}, codes=st.codes||{}, ov=(st.ov||{})[key]||{};
        if(c.t==='i') row[subj.name+' | '+c.n]=g[key]??'';
        else{ row[subj.name+' | '+c.n+' | מגן']=g[key+'.m']??''; row[subj.name+' | '+c.n+' | בחינה']=g[key+'.e']??''; }
        const gstat=st.gstat||{};
        const stTxt=k=>gstat[k]==='r'?'אדום — טרם דווח':gstat[k]==='b'?'כחול — פיקטיבי':'';
        const sTxt=c.t==='i'?stTxt(key):[stTxt(key+'.m'),stTxt(key+'.e')].filter(Boolean).join(' / ');
        if(sTxt) row[subj.name+' | '+c.n+' | סימון']=sTxt;
        if(codes[key]) row[subj.name+' | '+c.n+' | סמל שאלון']=codes[key];
        const nt=noteOf(st,key); if(nt) row[subj.name+' | '+c.n+' | הערה']=nt;
        if(ov.w!==undefined||ov.s!==undefined) row[subj.name+' | '+c.n+' | התאמה אישית']=(ov.w!==undefined?'משקל '+ov.w+'%':'')+(ov.s!==undefined?' מגן '+ov.s+'%':'');
      });
    });
    return row;
  });
  const ws2=XLSX.utils.json_to_sheet(rawRows);
  XLSX.utils.book_append_sheet(wb,ws2,'נתונים גולמיים');
  // ניתוח כיתתי
  const anRows=state.classes.map(c=>{
    const ss=state.students.filter(s=>s.cls===c);
    const rs=ss.map(s=>calcStudent(s));
    return {'כיתה':c,'תלמידות':ss.length,
      'זכאיות':rs.filter(r=>r.eligible).length,
      'מצטיינות':rs.filter(r=>r.excellent).length,
      'פוטנציאל':rs.filter(r=>r.potential).length,
      'עם מעכבים':rs.filter(r=>r.blockers.length>0).length,
      'ממוצע':avgOf(rs.map(r=>r.avg).filter(v=>v!==null))??''};
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(anRows),'ניתוח כיתתי');
  XLSX.writeFile(wb,`דוח-בגרות-${cls||'שכבה'}-${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('הקובץ ירד למחשב');
}
/* ייבוא חכם של קובץ הסימולטור המקורי (אקסל) — מזהה את המבנה וממלא את כל הציונים */
function parseSimulatorWorkbook(wb){
  const ws=wb.Sheets['סימולטור למגזר ממלכתי דתי'];
  const COLORS=sheetFontColors(wb,'סימולטור למגזר ממלכתי דתי')||{};
  const DC=XLSX.utils.decode_col, EC=XLSX.utils.encode_col;
  const cell=(col,row)=>ws[col+row];
  const val=(col,row)=>{const c=cell(col,row); return c?c.v:undefined;};
  // זיהוי גרסת הפריסה: בקובץ יב יש עמודות H,I נוספות (יח"ל וממוצע) ולשון מתחילה ב-J; בקובץ יא לשון מתחילה ב-H
  const h8=String(val('H',8)||'');
  const off=h8.indexOf('הזנת ציון')===0||h8.includes('הזנת ציון  הערכה')?-2:0;
  const S=c=>EC(DC(c)+off);
  const num=v=>{ if(v===undefined||v===null||v==='')return null; const n=+v; return isNaN(n)?null:Math.round(n*10)/10; };
  const wnum=v=>{ const n=+v; return isNaN(n)?null:n; };
  const fSplit=(col,row)=>{ const c=cell(col,row); if(!c||!c.f)return null; const m=String(c.f).match(/\*\s*0?\.(\d+)\)\s*\+/); return m?Math.round(('0.'+m[1])*100):null; };
  const tSplit=v=>{ v=String(v||''); if(v.includes('מגן 50'))return 50; if(v.includes('מגן 30'))return 30; return null; };
  const DEF={'lashon.1':50,'history.1':30,'sifrut.1':30,'machshevet.1':30,'ezrachut.1':30,'english.1':30,'english.2':60,'english.3':30,'math.1':50,'math.2':60,'tanakh.1':30,'tanakh.2':30,'tanakh.4':30,'toshba.1':30,'toshba.2':30,'toshba.3':30};
  const SPLIT_COLS={'lashon.1':'N','history.1':'V','sifrut.1':'AD','machshevet.1':'AL','ezrachut.1':'AT','english.1':'BE','english.2':'BJ','english.3':'BN','math.1':'BW','math.2':'CA','tanakh.1':'CJ','tanakh.2':'CN','tanakh.4':'CT','toshba.1':'DC','toshba.2':'DG','toshba.3':'DK'};
  const out=[];
  for(let r=9;r<400;r++){
    let name=val('B',r);
    if(name===undefined||name===null||String(name).trim()==='') continue;
    if(typeof name==='number') continue;
    name=String(name).split(/\s+/).join(' ').trim();
    if(!name) continue;
    const st={name,units:{},mugbarNames:{},grades:{},codes:{},ov:{},gstat:{}};
    const setg=(key,col)=>{ const v=num(val(col,r)); if(v===null) return;
      st.grades[key]=Math.max(0,Math.min(100,v));
      const c=classifyColor(COLORS[col+r]); if(c) st.gstat[key]=c; };
    setg('hng.0','C'); setg('mada.0','D'); setg('shelach.0','E'); setg('taavura.0','F');
    const core={lashon:['J','L','M'],history:['R','T','U'],sifrut:['Z','AB','AC'],machshevet:['AH','AJ','AK'],ezrachut:['AP','AR','AS']};
    Object.keys(core).forEach(sid=>{ const[i_,m_,e_]=core[sid]; setg(sid+'.0',S(i_)); setg(sid+'.1.m',S(m_)); setg(sid+'.1.e',S(e_)); });
    st.units.english=num(val(S('AX'),r))||5;
    setg('english.0',S('AZ')); setg('english.1.m',S('BC')); setg('english.1.e',S('BD'));
    setg('english.2.m',S('BH')); setg('english.2.e',S('BI')); setg('english.3.m',S('BL')); setg('english.3.e',S('BM'));
    [['english.0','AY'],['english.1','BB'],['english.2','BG']].forEach(([k,c])=>{ const v=val(S(c),r); if(v&&!String(v).includes('בחר')) st.codes[k]=String(v).trim(); });
    st.units.math=num(val(S('BR'),r))||5;
    if(st.units.math===3) setg('math.0',S('BS'));
    setg('math.1.m',S('BU')); setg('math.1.e',S('BV')); setg('math.2.m',S('BY')); setg('math.2.e',S('BZ'));
    st.units.tanakh=num(val(S('CE'),r))||3;
    setg('tanakh.0',S('CF')); setg('tanakh.1.m',S('CH')); setg('tanakh.1.e',S('CI')); setg('tanakh.2.m',S('CL')); setg('tanakh.2.e',S('CM'));
    if(st.units.tanakh===5){ setg('tanakh.3',S('CP')); setg('tanakh.4.m',S('CR')); setg('tanakh.4.e',S('CS')); }
    st.units.toshba=num(val(S('CX'),r))||5;
    setg('toshba.0',S('CY')); setg('toshba.1.m',S('DA')); setg('toshba.1.e',S('DB')); setg('toshba.2.m',S('DE')); setg('toshba.2.e',S('DF'));
    if(st.units.toshba===5){ setg('toshba.3.m',S('DI')); setg('toshba.3.e',S('DJ')); setg('toshba.4',S('DM')); }
    Object.keys(SPLIT_COLS).forEach(key=>{ const s=fSplit(S(SPLIT_COLS[key]),r); if(s!==null&&s!==DEF[key]) st.ov[key]={s}; });
    const mug=[['mugbar1',{name:'DQ',u:null,code0:'DR',w0:'DS',g0:'DT',ext:[[1,'EB','EC','ED','EE','EF',70],[2,'EH','EI','EJ','EK','EL',0],[3,'EN','EO','EP','EQ','ER',0]]}],
               ['mugbar2',{name:'EW',u:'EV',code0:'EX',w0:'EY',g0:'EZ',ext:[[1,'FH','FI','FJ','FK','FL',70],[2,'FN','FO','FP','FQ','FR',0],[3,'FT','FU','FV','FW','FX',0]]}]];
    mug.forEach(([sid,cols])=>{
      const mname=val(S(cols.name),r);
      if(mname&&!String(mname).includes('בחר')){
        st.units[sid]=(cols.u?num(val(S(cols.u),r)):5)||5;
        st.mugbarNames[sid]=String(mname).trim();
        setg(sid+'.0',S(cols.g0));
        const c0=val(S(cols.code0),r);
        if(c0&&!String(c0).includes('בחר')) st.codes[sid+'.0']=String(c0).trim();
        const wi=wnum(val(S(cols.w0),r));
        if(wi!==null&&Math.round(wi*100)!==30) st.ov[sid+'.0']={w:Math.round(wi*100)};
        cols.ext.forEach(([idx,cCode,cW,cM,cE,cS,defW])=>{
          const w=wnum(val(S(cW),r))||0;
          if(!w) return;
          const w100=Math.round(w*100), key=sid+'.'+idx;
          setg(key+'.m',S(cM)); setg(key+'.e',S(cE));
          const code=val(S(cCode),r);
          if(code&&!String(code).includes('בחר')) st.codes[key]=String(code).trim();
          const ov={};
          if(w100!==defW) ov.w=w100;
          const s=tSplit(val(S(cS),r));
          if(s!==null&&s!==30) ov.s=s;
          if(Object.keys(ov).length) st.ov[key]=Object.assign(st.ov[key]||{},ov);
        });
      } else st.units[sid]=0;
    });
    st.units.mugbar3=0;
    out.push(st);
  }
  return out;
}
function importSimulator(wb){
  const parsed=parseSimulatorWorkbook(wb);
  if(!parsed.length){ toast('לא נמצאו תלמידות בקובץ'); return; }
  let cls=prompt(`זוהה קובץ סימולטור מקורי עם ${parsed.length} תלמידות.\nלאיזו כיתה לשייך אותן?`, state.classes[0]||'יב');
  if(cls===null) return;
  cls=cls.trim()||state.classes[0]||'יב';
  if(!state.classes.includes(cls)) state.classes.push(cls);
  const pf=profiles.find(x=>x.id===currentProfileId);
  if(pf&&(pf.unnamed||!pf.name)){ pf.name=cls; delete pf.unnamed; saveProfiles(); renderProfileBar(); }
  pushUndo('ייבוא מקובץ סימולטור');
  let added=0, updated=0;
  const seen={};
  parsed.forEach(p=>{
    applyLegacyStructure(p);
    if(seen[p.name]){ p.name=p.name+' ('+(++seen[p.name])+')'; toast('שימי לב: שם כפול בקובץ — '+p.name); }
    else seen[p.name]=1;
    let st=state.students.find(s=>s.name===p.name&&s.cls===cls);
    if(st){ Object.assign(st,{units:p.units,mugbarNames:p.mugbarNames,grades:p.grades,codes:p.codes,ov:p.ov,gstat:p.gstat}); updated++; }
    else{ state.students.push(Object.assign({id:uid(),cls},p)); added++; }
  });
  let nr=0,nb=0;
  parsed.forEach(p=>{ Object.values(p.gstat||{}).forEach(v=>{ if(v==='r')nr++; else if(v==='b')nb++; }); });
  save(); render();
  toast(`הקובץ נקלט! ${added} חדשות, ${updated} עודכנו` + (nr+nb?` · זוהו ${nr} ציונים אדומים (לא דווחו) ו-${nb} כחולים (פיקטיביים)`:''));
}
function importExcel(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array',bookFiles:true});
      if(wb.SheetNames.includes('סימולטור למגזר ממלכתי דתי')){ importSimulator(wb); input.value=''; return; }
      const wsName=wb.SheetNames.includes('נתונים גולמיים')?'נתונים גולמיים':wb.SheetNames[0];
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wsName]);
      if(!rows.length){toast('הגיליון ריק');return;}
      let added=0, updated=0;
      rows.forEach(row=>{
        const name=String(row['שם']||'').trim(); if(!name) return;
        const cls=String(row['כיתה']||state.classes[0]||'כיתה א').trim();
        if(!state.classes.includes(cls)) state.classes.push(cls);
        let st=state.students.find(s=>s.name===name&&s.cls===cls);
        if(!st){ st={id:uid(),name,cls,units:{},mugbarNames:{},grades:{}}; state.students.push(st); added++; }
        else updated++;
        SUBJECTS.forEach(subj=>{
          const uKey=subj.name+' - יח"ל';
          if(row[uKey]!==undefined&&row[uKey]!=='') st.units[subj.id]=+row[uKey];
          const nKey=subj.name+' - שם מקצוע';
          if(row[nKey]) st.mugbarNames[subj.id]=String(row[nKey]);
          const maxU=subj.opts[subj.opts.length-1];
          subj.comps(maxU).forEach((c,i)=>{
            const key=subj.id+'.'+i;
            const set=(k,v)=>{ if(v!==undefined&&v!=='') st.grades[k]=+v; };
            if(c.t==='i') set(key,row[subj.name+' | '+c.n]);
            else{ set(key+'.m',row[subj.name+' | '+c.n+' | מגן']); set(key+'.e',row[subj.name+' | '+c.n+' | בחינה']); }
          });
        });
      });
      save(); render(); toast(`ייבוא הושלם: ${added} חדשות, ${updated} עודכנו`);
    }catch(err){ toast('שגיאה בקריאת הקובץ: '+err.message); }
    input.value='';
  };
  reader.readAsArrayBuffer(file);
}
function exportJSON(){

  a.download=`גיבוי-${(schoolName||'סימולטור-בגרות').replace(/[\\/:*?"<>|]/g,'')}-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;

function countAllStudents(){
  let n=0;
  profiles.forEach(pr=>{
    const key=pr.id==='main'?'bagrutSimPro':'bagrutSimPro:'+pr.id;
    try{ if(pr.id===currentProfileId){ n+=state.students.length; return; }
      const raw=localStorage.getItem(key); if(raw) n+=(JSON.parse(raw).students||[]).length; }catch(e){}
  });
  return n;
}
function lastBackupInfo(){
  try{ const r=localStorage.getItem('bagrutLastBackup'); if(!r) return null; return JSON.parse(r); }catch(e){ return null; }
}
function importJSON(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d&&d._type==='bagrut-backup'&&d.data){
        // גיבוי מלא — כל הסימולטורים
        let tot=0; Object.values(d.data).forEach(s=>tot+=((s&&s.students)||[]).length);
        const when=d._at?new Date(d._at).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'לא ידוע';
        const names=(d.profiles||[]).map(p=>p.name||'(ללא שם)').join(', ');
        if(!confirm(`שחזור גיבוי מלא\n\nתאריך הגיבוי: ${when}\nסימולטורים: ${names}\nסך תלמידות: ${tot}\n\n⚠️ הנתונים הקיימים במכשיר זה יוחלפו. להמשיך?`)){ input.value=''; return; }
        (d.profiles||[]).forEach(pr=>{
          const key=pr.id==='main'?'bagrutSimPro':'bagrutSimPro:'+pr.id;
          if(d.data[pr.id]) localStorage.setItem(key,JSON.stringify(d.data[pr.id]));
        });
        profiles=(d.profiles&&d.profiles.length)?d.profiles:[{id:'main',name:'',unnamed:1}];
        currentProfileId=(d.current&&profiles.some(p=>p.id===d.current))?d.current:profiles[0].id;
        saveProfiles();
        state=loadState();
        renderProfileBar(); renderLogo(); setTab('dash');
        toast(`שוחזרו ${profiles.length} סימולטורים · ${tot} תלמידות`);
      }else{
        // גיבוי בפורמט הישן — סימולטור בודד
        const n=((d&&d.students)||[]).length;
        if(!confirm(`שחזור גיבוי לסימולטור הנוכחי\n\nתלמידות בקובץ: ${n}\n\n⚠️ הנתונים בסימולטור הנוכחי יוחלפו. להמשיך?`)){ input.value=''; return; }
        state=Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)),d);
        save(); render(); toast(`שוחזרו ${n} תלמידות`);
      }
    }
    catch(err){ toast('קובץ גיבוי לא תקין: '+err.message); }
    input.value='';
  };
  reader.readAsText(file);
}

function loadDemo(){
  if(state.students.length&&!confirm('לטעון נתוני דוגמה בנוסף לנתונים הקיימים?')) return;
  const names=['שירה כהן','נעמה לוי','אביגיל פרץ','תהילה מזרחי','הודיה ביטון','רננה דהן','אמונה אזולאי','יעל אוחיון','מוריה חדד','אילה גבאי','צופיה עמר','בת-אל אלבז','נועה שלום','רוני ממן','הדס אטיאס','תמר בן-דוד','אוריה סבן','שקד יוסף','ליאור אברהם','מיכל נחום','אסתר קדוש','חנה טל','רות פנחס','דבורה שרעבי'];
  const classes=['יב-1','יב-2'];
  classes.forEach(c=>{ if(!state.classes.includes(c)) state.classes.push(c); });
  const rnd=(a,b)=>Math.round(a+Math.random()*(b-a));
  const clamp=v=>Math.max(40,Math.min(100,Math.round(v)));
  names.forEach((name,idx)=>{
    const cls=classes[idx%2];
    const ability=idx<5?rnd(88,97):idx<10?rnd(80,90):idx<20?rnd(65,85):rnd(50,68);
    const st={id:uid(),name,cls,units:{math:[3,4,5][idx%3],english:idx%2?4:5,tanakh:idx%4===0?5:3,toshba:3,mugbar2:idx%3===0?5:0,mugbar3:0},mugbarNames:{mugbar1:['ביולוגיה','פיזיקה','מדעי המחשב','כימיה'][idx%4],mugbar2:'אומנות'},grades:{}};
    SUBJECTS.forEach(subj=>{
      const u=getUnits(st,subj); if(u===0) return;
      getComps(subj,u).forEach((c,i)=>{
        if(!c.w) return;
        const key=subj.id+'.'+i;
        if(c.t==='i'){ st.grades[key]=clamp(ability+rnd(-6,8)); }
        else{
          const magen=clamp(ability+rnd(-4,10));
          st.grades[key+'.m']=magen;
          if(Math.random()<0.9) st.grades[key+'.e']=clamp(magen+rnd(-14,6));
        }
      });
    });
    // כמה חריגות מכוונות לדוגמה
    if(idx===21){ st.grades['math.1.e']=38; }
    if(idx===7){ st.grades['lashon.1.m']=95; st.grades['lashon.1.e']=62; }
    state.students.push(st);
  });
  save(); render(); toast('נטענו '+names.length+' תלמידות לדוגמה');
}

  ${step('🎨','צבעי הציונים — מה דווח ומה לא',`

  ${step('💾','גיבוי ידני — לגיבוי נוסף והעברה בין מכשירים',`

    שיתוף עם מישהו אחר? שולחים לו את הקישור לאפליקציה — הוא מתחיל ריק ועובד על נתונים משלו. הציונים שלך לא נשלחים ולא גלויים לאיש.`)}
  <div class="card">
    <h3 class="sec" style="font-size:15px;">🔧 בעיות נפוצות</h3>
